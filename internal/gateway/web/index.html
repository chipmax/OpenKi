/* Khối chỉ thị trượt của điều khiển phân đoạn: di chuyển mượt theo nút được chọn */
function segThumb(seg){
  if(!seg) return;
  let thumb = seg.querySelector(".thumb");
  if(!thumb){ thumb = document.createElement("span"); thumb.className = "thumb"; seg.appendChild(thumb); }
  const on = seg.querySelector("button.on") || seg.querySelector("button");
  if(!on){ thumb.style.opacity = "0"; return; }
  thumb.style.opacity = "1";
  thumb.style.left = on.offsetLeft + "px";
  thumb.style.width = on.offsetWidth + "px";
}
function initSegs(){
  document.querySelectorAll(".seg").forEach(seg => {
    segThumb(seg);
    if(!seg.dataset.thumbBound){
      seg.dataset.thumbBound = "1";
      seg.addEventListener("click", e => { if(e.target.closest("button")) requestAnimationFrame(()=>segThumb(seg)); });
    }
  });
}
window.addEventListener("resize", ()=> initSegs());

const NAV_GROUPS = [["Gateway",0,4],["Dữ liệu",4,6],["Hệ thống",6,9]];
function nav(){
  let html = "";
  for(const [title, from, to] of NAV_GROUPS){
    html += `<div class="grp grp-txt">${title}</div>`;
    html += PAGES.slice(from,to).map(([id,label,ic])=>
      `<button data-p="${id}" title="${label}" aria-label="${label}" aria-current="${id===cur?"page":"false"}" class="${id===cur?"on":""}">${icon(ic)}<span class="lbl">${label}</span></button>`).join("");
  }
  $("#nav").innerHTML = html;
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{ cur=b.dataset.p; localStorage.setItem("openki.page",cur); nav(); render(); logTimer = syncLogTimer(logTimer); });

  // Co giãn thanh bên (ghi nhớ trạng thái)
  const side = document.getElementById("side");
  const applySide = () => {
    const collapsed = localStorage.getItem("openki.side") === "collapsed";
    side.classList.toggle("collapsed", collapsed);
    document.getElementById("side-toggle").innerHTML =
      (collapsed ? icon("chevRight") : icon("chevLeft")) + '<span class="lbl">Thu gọn thanh bên</span>';
  };
  document.getElementById("side-toggle").onclick = () => {
    localStorage.setItem("openki.side",
      side.classList.contains("collapsed") ? "open" : "collapsed");
    applySide();
  };
  const themeToggle = document.getElementById("theme-toggle");
  if (themeToggle) {
    themeToggle.onclick = () => setTheme(
      document.documentElement.dataset.theme === "light" ? "dark" : "light");
    syncThemeToggle();
  }
  applySide();
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on", p.id==="page-"+cur));
}

function skeleton(){
  if(STATE) return;
  const el = document.getElementById("page-"+cur);
  if(!el) return;
  el.innerHTML = `<div class="skel">
    <div class="sk-head"><i style="width:150px;height:22px"></i><i style="width:110px;height:11px"></i></div>
    <div class="sk-kpis">${"<div class=\"sk-kpi\"><i></i><i></i></div>".repeat(5)}</div>
    <div class="sk-panel"><i></i><i></i><i></i><i></i></div>
    <div class="sk-cols">${"<div class=\"sk-panel\"><i></i><i></i><i></i></div>".repeat(2)}</div>
    <div class="sk-cards">${"<div class=\"sk-panel\"><i></i><i></i></div>".repeat(4)}</div>
  </div>`;
}

function render(){ if(!STATE){ skeleton(); return; } const s=STATE;
  $("#svcdot").className = "dot";
  $("#svcstat").textContent = "Đang chạy";
  const todayKey0 = Object.keys(s.stats.days||{}).sort().pop();
  $("#side-today").textContent = fmtN(todayKey0 ? (s.stats.days[todayKey0].output||0) : 0);
  // Thanh bên chỉ để ô này xuất hiện khi thực sự có số liệu cache: hiển thị「Cache 0%」so với không hiển thị còn khiến người ta
  // tưởng là đã hỏng, mà bất kỳ upstream nào không trả về mức sử dụng cache cũng đều tạo ra 0%.
  (()=>{
    const d = todayKey0 ? s.stats.days[todayKey0] : null;
    const pct = d ? cachePct(d.cacheRead||0, d.input||0) : null;
    const wrap = $("#side-cache-wrap");
    if(!wrap) return;
    wrap.style.display = (pct!==null && (d.cacheRead||0) > 0) ? "" : "none";
    const v = $("#side-cache");
    if(v) v.textContent = pct!==null ? pct+"%" : "—";
  })();
  // Only the free lane is probed on a timer; a custom provider's models are
  // tested on demand, so counting them here would cap the ratio below 100%.
  const lane = s.models.filter(m=>!m.custom);
  $("#side-models").textContent = lane.filter(m=>m.state==="available").length + "/" + lane.length;
  $("#side-ver").textContent = s.version || "";
  $("#egress-foot").textContent = s.egress&&s.egress.ip ? `${s.egress.ip} (${s.egress.country||"?"})` : "Không rõ lối ra";
  // Only the visible page is rebuilt. The old all-pages pass constructed the
  // full model grid, provider wall and agent cards every ten seconds even when
  // the user was reading the log or settings page; switching pages still calls
  // render() and paints the destination from the same STATE snapshot.
  if (cur === "dash") { renderDash(s); renderDashExtras(s); }
  else if (cur === "agents") renderAgents(s);
  else if (cur === "models") renderModels(s);
  else if (cur === "providers") renderProviders(s);
  else if (cur === "usage") renderUsage(s);
  else if (cur === "logs") renderLogs();
  else if (cur === "network") renderNetwork(s);
  else if (cur === "update") renderUpdate(s);
  else if (cur === "settings") renderSettings(s);
  if (cur !== "models" && tickTimer) { clearInterval(tickTimer); tickTimer = 0; }
  // Con trượt của điều khiển phân đoạn phải nhờ JS đo chiều rộng mới vào đúng vị trí: phiên bản đăng nhập ở trang「API tuỳ chỉnh」, chế độ nhiệt ở trang tổng quan,
  // trước đây chỉ trang nhật ký/cài đặt mới gọi nó, seg trên các trang khác cứ luôn đội con trượt mặc định 40px.
  initSegs();
  logTimer = syncLogTimer(logTimer);
}

/* ---- Tổng quan ---- */
function fmtBytes(n){
  n = Number(n);
  if(!isFinite(n) || n <= 0) return "—";
  const units = ["B","KB","MB","GB","TB"];
  let i = 0;
  while(n >= 1024 && i < units.length-1){ n /= 1024; i++; }
  return (i===0 ? n.toFixed(0) : n.toFixed(1)) + " " + units[i];
}
function platformLabel(p){
  return {windows:"Windows", wsl:"WSL / Linux", linux:"Linux", darwin:"macOS"}[p] || p || "—";
}
/* Thẻ thông tin hệ thống: gom các trường máy chủ/mạng vốn rải rác trong phần
   thu gọn cũ thành bốn khối đọc được, để người dùng WSL thấy ngay gateway
   đang chạy ở đâu và tài nguyên nào đang bị chiếm. */
function systemInfoCard(s){
  const sys = s.system || {};
  const total = Number(sys.memoryTotal) || 0;
  const avail = Number(sys.memoryAvailable) || 0;
  const used = total > 0 ? Math.max(0, total - avail) : 0;
  const pct = total > 0 ? Math.min(100, Math.round(used / total * 100)) : 0;
  const started = sys.startedAt || "—";
  const kv = (k,v,mono)=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v${mono?" mono":""}">${v==null||v===""?"—":esc(String(v))}</span></div>`;
  return `<div class="card" id="sysinfo-card">
    <h3>Thông tin hệ thống <span class="muted" style="font-size:11px">${sys.platform==="wsl"?"Gateway đang chạy trong WSL · Agent Windows và WSL được tách riêng":"Thông số máy đang chạy gateway"}</span></h3>
    <div class="sysgrid">
      <section class="syssec">
        <h4>Hệ điều hành</h4>
        <div class="sysinfo" style="grid-template-columns:1fr">
          ${kv("Nền tảng", platformLabel(sys.platform))}
          ${kv("Hệ điều hành", sys.os)}
          ${kv("Phiên bản", sys.osVersion)}
          ${kv("Nhân", sys.kernel, true)}
          ${kv("Kiến trúc", sys.arch, true)}
          ${sys.platform==="wsl"?kv("Bản WSL", sys.wslDistro || "WSL 2"):""}
          ${kv("Hostname", sys.hostname, true)}
          ${kv("Người dùng", sys.user)}
        </div>
      </section>
      <section class="syssec">
        <h4>Phần cứng</h4>
        <div class="sysinfo" style="grid-template-columns:1fr">
          ${kv("CPU", sys.cpu || sys.cpuModel)}
          ${kv("Số luồng", sys.cpuThreads)}
          ${kv("RAM", fmtBytes(total))}
          ${kv("Khả dụng", fmtBytes(avail))}
          ${kv("Đã dùng", total>0?`${fmtBytes(used)} (${pct}%)`:"—")}
          ${total>0?`<div class="membar"><i style="width:${pct}%"></i></div>`:""}
          ${kv("Go", sys.goVersion, true)}
          ${kv("GOMAXPROCS", sys.gomaxprocs)}
        </div>
      </section>
      <section class="syssec">
        <h4>Tiến trình</h4>
        <div class="sysinfo" style="grid-template-columns:1fr">
          ${kv("Phiên bản", s.version, true)}
          ${kv("PID", sys.pid)}
          ${kv("Khởi động", started)}
          <div class="kv"><span class="k">Đã chạy</span><span class="v" id="uptime-val">${s.uptimeSec!=null?fmtUptime(s.uptimeSec):esc(s.uptime||"—")}</span></div>
          ${kv("Thư mục dữ liệu", s.dataDir, true)}
          ${kv("Tệp cấu hình", sys.configPath, true)}
        </div>
      </section>
      <section class="syssec">
        <h4>Mạng</h4>
        <div class="sysinfo" style="grid-template-columns:1fr">
          ${kv("Cổng nghe", s.port)}
          ${kv("Địa chỉ LAN", s.lanBaseURL || "Chỉ loopback (127.0.0.1)")}
          ${kv("Lối ra", s.egress&&s.egress.ip ? `${s.egress.ip} (${s.egress.country||"?"})` : "Không rõ")}
          ${kv("Proxy", proxyLabel(s.settings.proxyMode, s.settings.proxyURL))}
          ${kv("Phạm vi Agent", s.settings.agentScope)}
          ${kv("Mở LAN", s.settings.allowLan?"Bật":"Tắt")}
        </div>
      </section>
    </div>
  </div>`;
}
function renderDash(s){
  const laneModels = s.models.filter(m=>!m.custom);
  const avail = laneModels.filter(m=>m.state==="available" && !m.hidden).length;
  const on = s.agents.filter(a=>a.enabled).length;
  const todayKey = Object.keys(s.stats.days||{}).sort().pop();
  const day = todayKey ? s.stats.days[todayKey] : null;
  // Windows builds can replace the running binary; Linux/macOS send the user
  // to the update page and release page instead.
  const banner = s.settings.updateAvailable ? `
    <div class="card updbar">
      <span class="txt">Có bản cập nhật <b>${esc(s.settings.updateVersion)}</b>（hiện tại ${esc(s.version)}）</span>
      <span class="acts"><a href="#" id="upd-open">Chi tiết →</a><a href="${esc(safeHref(s.settings.updateURL))}" target="_blank">Trang phát hành →</a></span>
    </div>` : "";
  // Thẻ thông báo luôn hiển thị ở Tổng quan: tô màu theo mức critical/warn/info, làm nổi bật mục chưa đọc + có thể đánh dấu đã đọc;
  // Thẻ chỉ hiển thị 2 mục mới nhất, xem tất cả trong cửa sổ bật lên 「Thông báo trước đây」 (bao gồm cả lưu trữ đã kết thúc).
  const anns = s.announcements || [];
  const annArch = s.announcementArchive || [];
  const annItem = (a, ended, compact = true) => {
    const lv = {critical:"var(--bad)",warn:"var(--warn)",info:"var(--accent)"}[a.level]||"var(--accent)";
    const unread = !!a.unread && !ended;
    // Nội dung dài mặc định thu gọn thành ba dòng, cung cấp một lối vào để mở rộng, tránh cả trang thành tường thông báo.
    const clamped = compact && !!a.body && a.body.length > 120;
    const open = annOpen.has(a.id);
    return `<div class="annitem${unread?" unread":""}${ended?" ended":""}${clamped&&!open?" clamp":""}${open?" open":""}" style="--lv:${lv}">
      <div class="ann-head">
        <span class="ann-title">${esc(a.title)}</span>
        ${a.level==="critical"?'<span class="pill bad">Quan trọng</span>':a.level==="warn"?'<span class="pill warn">Lưu ý</span>':""}
        ${ended?'<span class="pill hidsync">Đã kết thúc</span>':""}
        ${a.start?`<span class="ann-date">${esc(a.start)}${a.end?" ~ "+esc(a.end):""}</span>`:""}
        <span class="ann-acts">
          ${clamped?`<button class="linkbtn ann-more" data-id="${esc(a.id)}">${open?"Thu gọn":"Mở rộng toàn văn"}</button>`:""}
          ${a.url?`<a class="ann-link" href="${esc(safeHref(a.url))}" target="_blank">Chi tiết →</a>`:""}
          ${unread?`<button class="ghost ann-read" data-id="${esc(a.id)}">Đã hiểu</button>`:""}
        </span>
      </div>

    else {

/* ---- Tuỳ biến Agent ---- */
function agentBaseID(id){ return String(id||"").replace(/-windows$/, ""); }
function agentBrand(id){
  const base = agentBaseID(id);
  return BRAND_LOGOS[base] || BRAND_LOGOS[id] || null;
}
function agentIcon(id){
  const base = agentBaseID(id);
  return AGENT_ICONS[base] || AGENT_ICONS[id] || "agents";
}
const AGENT_GROUP_META = {
  windows: { label: "Windows", note: "Agent cài trên Windows; cấu hình nằm trong hồ sơ Windows" },
  wsl:     { label: "WSL / Linux", note: "Agent cài trong WSL; cấu hình nằm trong Linux" },
  linux:   { label: "Linux", note: "Agent cài trên máy Linux này" },
  darwin:  { label: "macOS", note: "Agent cài trên máy macOS này" },
  host:    { label: "Máy này", note: "Agent cài trên máy đang chạy gateway" },
};
function agentGroupOf(a, s){
  if(a.platform) return a.platform;
  if(String(a.id||"").endsWith("-windows")) return "windows";
  return (s.system && s.system.platform) || "host";
}
function renderAgents(s){
  const el = $("#page-agents");
  el.innerHTML = `<h2 class="pt">Tương thích Agent <span class="sub">Sau khi bật, bộ chọn mô hình của Agent tương ứng sẽ xuất hiện mô hình miễn phí; file cấu hình được sao lưu trước, tắt đi sẽ khôi phục lại</span></h2>
    <div id="agent-list"></div>`;
  const box = el.querySelector("#agent-list");
  const hostPlatform = (s.system && s.system.platform) || "";
  let order;
  if(hostPlatform === "wsl") order = ["windows", "wsl"];
  else if(hostPlatform) order = [hostPlatform];
  else order = [...new Set(s.agents.map(a=>agentGroupOf(a,s)))];
  for(const a of s.agents){
    const p = agentGroupOf(a, s);
    if(!order.includes(p)) order.push(p);
  }
  let html = "";
  for(const platform of order){
    const meta = AGENT_GROUP_META[platform] || { label: platform, note: "" };
    const list = s.agents.filter(a=>agentGroupOf(a,s)===platform)
      .sort((a,b)=>Number(b.installed)-Number(a.installed) || String(a.name).localeCompare(String(b.name)));
    if(!list.length && hostPlatform !== "wsl") continue;
    const installed = list.filter(a=>a.installed).length;
    const enabled = list.filter(a=>a.enabled).length;
    html += `<div class="msec"><span class="dot ${enabled?"on":"off"}"></span>
      <span class="chname">${esc(meta.label)}</span>
      <span class="chdesc">${esc(meta.note)}</span>
      <span class="chcount">${installed}/${list.length} đã cài · ${enabled} đang bật</span></div>`;
    if(!list.length){
      html += `<div class="muted" style="font-size:12px;padding:4px 2px var(--gap-card)">Không phát hiện Agent nào trên ${esc(meta.label)}.</div>`;
      continue;
    }
    html += `<div class="agrid">`;
    for(const a of list){
      const lg = agentBrand(a.id);
      html += `<div class="acard${a.enabled?" st-on":""}${a.installed?"":" st-noinst"}">
        <div class="ahead">
          <div class="aicon${lg?(lg.wide?" lg-wide":"")+(lg.neutral?" lg-neutral":""):""}">${lg?lg.svg:icon(agentIcon(a.id))}</div>
          <div class="att">
            <div class="aname">${esc(a.name)}</div>
            ${a.version?`<div class="aver">${esc(a.version)}</div>`:""}
          </div>
        </div>
        <div class="ads">${esc(a.detail||"")}</div>
        ${a.warn?`<div class="warnline">⚠ ${esc(a.warn)}</div>`:""}
        <div class="afoot">
          ${a.enabled?`<span class="pill ok">Đã bật</span>`:(a.installed?`<span class="pill unknown">Chưa bật</span>`:`<span></span>`)}
          <button class="tgl${a.enabled?" on":""}" role="switch" aria-checked="${a.enabled?"true":"false"}"
            data-agent-id="${esc(a.id)}" data-enabled="${a.enabled?1:0}" data-installed="${a.installed?1:0}"
            title="${a.installed?(a.enabled?"Đóng":"Bật"):("Chưa phát hiện "+esc(a.name))}"></button>
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll("[data-agent-id]").forEach(btn=>{
    btn.disabled = btn.dataset.installed !== "1";
    btn.onclick = async ()=>{
      const id = btn.dataset.agentId;
      const wasEnabled = btn.dataset.enabled === "1";
      btn.disabled = true;
      const j = await api(`/agent/${encodeURIComponent(id)}/${wasEnabled?"disable":"enable"}`);
      if(j){ toast(wasEnabled?"Đã tắt, cấu hình đã khôi phục":"Đã bật, có hiệu lực sau khi khởi động lại Agent tương ứng"); refresh(); }
      else { btn.disabled = false; }
    };
  });
}

/* ---- Mô hình ---- */
const STATE_ORDER = { available:0, custom:1, unknown:2, throttled:3, "region-blocked":4, unavailable:5 };

/* Tiến độ dò kiểm tra: trạng thái lưu ở nơi đăng ký nhiệm vụ phía máy chủ, nên việc dựng lại lưới 10s sẽ không xoá mất tiến độ. */
let fastPollTimer = 0, tickTimer = 0, drawerFor = "", drawerTimer = 0;

function fmtMs(ms){
  if(ms >= 60000) return Math.floor(ms/60000) + "phút" + String(Math.round(ms%60000/1000)).padStart(2,"0") + "giây";
  return ms >= 1000 ? (ms/1000).toFixed(1) + "s" : Math.round(ms) + "ms";
}
function fmtClock(ms){ return ms ? new Date(ms).toTimeString().slice(0,8) : ""; }
const TP_MARK = { running:"…", ok:"✓", fail:"✕", unknown:"·" };
const TP_CLASS = { running:"run", ok:"ok", fail:"fail", unknown:"unknown" };
function taskKindLabel(kind){ return kind === "caps" ? "Kiểm tra năng lực thực tế" : "Kiểm tra tính khả dụng"; }
// Một phương thức sẽ báo 「Bắt đầu」 trước rồi mới báo 「Kết luận」, trên thẻ chỉ hiển thị bước mới nhất đó.
function lastPhases(steps){
  const by = new Map();
  for(const st of (steps||[])) by.set(st.name, st);
  return [...by.values()];
}
function taskBand(m){
  const t = m.task;
  if(!t) return "";
  const running = t.status === "running";
  const when = running
    ? `Thời gian đã dùng <b class="elapsed" data-start="${t.started}">…</b>`
    : (t.status === "failed" ? "Đã dừng · " : "Hoàn thành · ") + fmtClock(t.updated);
  const phases = lastPhases(t.steps).map(st=>{
    const cls = TP_CLASS[st.status] || "unknown";
    return `<span class="tp ${cls}" title="${esc(st.detail||"")}">${esc(st.name)} ${TP_MARK[st.status]||"·"}`
      + (st.ms?` <b>${fmtMs(st.ms)}</b>`:"") + `</span>`;
  }).join("");
  return `<div class="mtask"><div class="th"><span>${taskKindLabel(t.kind)}</span>`
    + `<span class="grow">${when}</span>`
    + `<button class="ghost tdet" data-m="${esc(m.id)}" title="Mở rộng chi tiết giai đoạn của lần dò kiểm tra này">Chi tiết</button></div>`
    + `<div class="tps">${phases}</div></div>`;
}
function startTaskTicker(){
  if(!document.querySelector("#page-models .elapsed")){
    if(tickTimer){ clearInterval(tickTimer); tickTimer = 0; }
    return;
  }
  const paint = ()=>{
    const now = Date.now();
    document.querySelectorAll("#page-models .elapsed").forEach(e=>{
      e.textContent = fmtMs(Math.max(0, now - Number(e.dataset.start)));
    });
  };
  paint();
  if(!tickTimer) tickTimer = setInterval(paint, 250);
}

function drawerRows(runs){
  if(!runs.length) return `<div class="empty">Mô hình này chưa có bản ghi kiểm tra. Nhấn 「Kiểm tra」 hoặc 「Kiểm tra năng lực thực tế」 trên thẻ sẽ xuất hiện tiến độ.</div>`;
  return runs.map(t=>{
    const st = t.status === "running" ? "Đang tiến hành" : (t.status === "failed" ? "Đã dừng" : "Đã hoàn thành");
    // Cùng một giai đoạn sẽ có hai dòng 「Bắt đầu」 và 「Kết quả」, trong ngăn kéo chỉ giữ trạng thái cuối cùng, nếu không mỗi phương thức sẽ lặp lại một lần.
    const rows = lastPhases(t.steps).map(s=>{
      const detail = s.detail
        ? `<span class="${s.status==="fail"||s.status==="unknown" ? "err" : "out"}">${esc(s.detail)}</span>` : "";
      return `<div class="row"><span class="tm">${fmtClock(s.at)}</span>`
        + `<span class="nm">${esc(s.name)} ${TP_MARK[s.status]||"·"}</span>`
        + `<span class="ms">${s.ms?fmtMs(s.ms):""}</span>${detail}</div>`;
    }).join("");
    return `<div class="run"><div class="rh"><b>${taskKindLabel(t.kind)}</b><span>${st}</span>`
      + `<span>Bắt đầu ${fmtClock(t.started)}</span></div>${rows}</div>`;
  }).join("");
}
async function paintDrawer(){
  if(!drawerFor) return;
  const box = document.getElementById("tdrawer");
  if(!box) return;
  const j = await fetch("/admin/api/tasks?model=" + encodeURIComponent(drawerFor)).then(r=>r.json()).catch(()=>null);
  if(!drawerFor || !document.getElementById("tdrawer")) return;
  const runs = (j && j.runs) || [];
  box.querySelector(".bd").innerHTML = drawerRows(runs);
  clearTimeout(drawerTimer);
  if(runs.some(t=>t.status === "running")) drawerTimer = setTimeout(paintDrawer, 1000);
}
function closeTaskDrawer(){
  drawerFor = "";
  clearTimeout(drawerTimer);
  document.getElementById("tdrawer")?.remove();
  document.getElementById("tdmask")?.remove();
}
async function openTaskDrawer(model){
  closeTaskDrawer();
  drawerFor = model;
  const mask = document.createElement("div");
  mask.id = "tdmask";
  mask.style.cssText = "position:fixed; inset:0; z-index:79; background:rgba(0,0,0,.45)";
  mask.onclick = closeTaskDrawer;
  const box = document.createElement("div");
  box.id = "tdrawer";
  box.innerHTML = `<div class="hd"><span class="t">${esc(model)}</span>`
    + `<button class="ghost" id="tdclose">Đóng ✕</button></div><div class="bd"></div>`;
  document.body.appendChild(mask);
  document.body.appendChild(box);
  box.querySelector("#tdclose").onclick = closeTaskDrawer;
  await paintDrawer();
}
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && drawerFor) closeTaskDrawer(); });

// Lỗi gốc từ thượng nguồn → Một câu dễ hiểu; nguyên văn đưa vào title, không in JSON lên thẻ nữa.
function humanDetail(m){
  const d = String(m.detail || "");
  if(!d) return "";
  const map = [
    [/FreeUsageLimitError/i, "Hạn mức miễn phí của đầu ra này đã dùng hết, đợi cửa sổ hạn mức làm mới hoặc đổi đầu ra rồi thử lại"],
    [/FreeTierError/i,       "Cổng client ở thượng nguồn đã chặn yêu cầu này"],
    [/RegionError/i,         "Đầu ra hiện tại bị cổng khu vực ở thượng nguồn chặn (đầu ra ở nước ngoài khả dụng)"],
    [/Hạn mức thời gian thực (đang chờ khôi phục)/,   "Tạm thời bị giới hạn tốc độ, đợi khôi phục hoặc kiểm tra lại thủ công"],
    [/Có trong danh sách (danh sách pool miễn phí chính là căn cứ xác định)/, ""],
  ];
  for(const [re, msg] of map) if(re.test(d)) return msg;
  if(d.trim().startsWith("{")){
    const t = (d.match(/"type"\s*:\s*"([A-Za-z]+(?:Error|Exception))"/) || [])[1];
    return t ? "Thượng nguồn trả về " + t + " · Di chuột để xem nguyên văn" : "Thượng nguồn trả về phản hồi ngoài dự kiến · Di chuột để xem nguyên văn";
  }
  return d.length > 90 ? d.slice(0, 90) + "…" : d;
}
function rawDetailTitle(m){
  const d = String(m.detail || "");
  return d.trim().startsWith("{") ? d : "";
}
const chanBadge = (ch) => `<span class="chan-badge chan-${esc(ch)}">${esc(ch)}</span>`;

// Đặt làm chính bằng một cú nhấp: đặt mô hình mặc định + đảm bảo được chọn, cả hai bước đều thành công mới tính là xong.
async function setPrimary(id){
  const cur = STATE.settings.defaultModel;
  if(cur === id){
    const j = await api("/settings", { defaultModel: "" });
    if(j){ toast("Đã huỷ đặt làm chính, khôi phục theo mục đầu tiên trong danh sách"); refresh(); }
    return;
  }
  const m = STATE.models.find(x => x.id === id);
  if(m && m.hidden){
    const v = await api("/models/visibility", { id, hidden: false });
    if(!v) return;
  }
  const j = await api("/settings", { defaultModel: id });
  if(j){ toast("Đã đặt làm mô hình chính:" + id + ", đang tiêm lại vào các Agent đã bật"); refresh(); }
}

function renderModels(s){
  const el = $("#page-models");
  // Nếu không có đầu vào nào thay đổi thì không vẽ lại: nếu polling 1s khi nhiệm vụ đang chạy chỉ thay đổi số liệu, thì innerHTML của toàn trang
  // dựng lại sẽ nhấp nháy, còn làm mất vị trí cuộn.
  const sig = JSON.stringify([mf, mview, [...foldedChans], s.probingModel, s.probeDone, s.probeTotal, s.channels,
    s.settings.defaultModel, s.models.map(m => [m.id, m.state, m.hidden, m.ttftMs, m.ttftMedMs,
      m.quotaUsed, m.quotaEstimate, m.throttledAt, m.task && m.task.status, m.detail])]);
  if(el.dataset.sig === sig) return;
  const scrollY = window.scrollY;
  el.dataset.sig = sig;

  const sorted = [...s.models].sort((a,b)=>{
    if(a.id===s.probingModel) return -1;
    if(b.id===s.probingModel) return 1;
    return (STATE_ORDER[a.state]??1)-(STATE_ORDER[b.state]??1);
  });
  const laneModels = s.models.filter(m=>!m.custom);
  const customModels = s.models.filter(m=>m.custom);
  const customProbed = customModels.filter(m=>m.state!=="custom").length;
  const avail = laneModels.filter(m=>m.state==="available" && !m.hidden).length;
  const hiddenCount = s.models.filter(m=>m.hidden).length;
  const blurbCount = new Map();
  for(const m of sorted) if(m.blurb) blurbCount.set(m.blurb, (blurbCount.get(m.blurb)||0)+1);
  const sharedBlurbs = [...blurbCount].filter(([,n])=>n>=3).map(([b])=>b);
  const sharedBlurbSet = new Set(sharedBlurbs);
  const sharedNote = sharedBlurbs.length
    ? `<div class="mnote"><span class="k">Mô tả</span><div>${sharedBlurbs.map(b=>`<div>${esc(b)}</div>`).join("")}</div></div>` : "";

  // ---- hero：hiện đang dùng cái nào ----
  const defId = s.settings.defaultModel || "";
  const defModel = defId ? s.models.find(m => m.id === defId) : null;
  const candidates = s.models.filter(m => m.state === "available" && !m.hidden && !m.systemOne);
  const best = (defModel && defModel.state === "available" && !defModel.hidden && !defModel.systemOne)
    ? defModel
    : (candidates.length ? candidates.reduce((a,b) => {
        const ka = (a.ttftMedMs||a.ttftMs||99999) - (b.ttftMedMs||b.ttftMs||99999);
        return ka !== 0 ? (ka < 0 ? a : b) : ((b.contextWindow||0) - (a.contextWindow||0) > 0 ? b : a);
      }) : null);
  let hero = "";
  if(best){
    const isPrimary = best.id === defId;
    const chans = best.channels && best.channels.length ? best.channels : [best.custom?"custom":(best.channel||"zen")];
    const caps = [best.vision?"Thị giác":"", best.audioInput?"Âm thanh":"", best.fileInput?"Tệp":"", best.reasoning?"Suy luận":""].filter(Boolean).join(" · ");
    hero = `<div class="hero${defModel && defModel.id !== best.id ? " degraded" : ""}">
      <span class="h-name">${isPrimary ? "Đang dùng chính：" : "Hiện đang dùng cái này："}${esc(best.name)}</span>
      <span class="h-meta">
        ${chans.map(chanBadge).join(" ")}
        <span>token đầu tiên <b>${best.ttftMs?(best.ttftMs/1000).toFixed(1)+"s":(best.ttftMedMs?(best.ttftMedMs/1000).toFixed(1)+"s":"—")}</b></span>
        ${best.contextWindow?`<span>Ngữ cảnh <b>${fmtCap(best.contextWindow)}</b></span>`:""}
        ${caps?`<span>${esc(caps)}</span>`:""}
      </span>
      ${defModel && defModel.id !== best.id && defModel.state !== "available" ? `<span class="h-meta" style="color:var(--warn)">mặc định ${esc(defModel.id)} Hiện tại${defModel.state==="throttled"?"Đang bị giới hạn tốc độ":"Không khả dụng"}，đề xuất chuyển đổi</span>` : ""}
      <div class="h-act">
        <button class="btn-primary" data-primary="${esc(best.id)}" ${isPrimary?"disabled":""} title="Đặt làm mô hình mặc định và đảm bảo xuất hiện trong bộ chọn Agent">${isPrimary?"✓ Hiện đang dùng chính":"Đặt làm chính"}</button>
      </div>
    </div>`;
  } else if(laneModels.length){
    const region = laneModels.filter(m=>m.state==="region-blocked").length;
    hero = `<div class="hero degraded">
      <span class="h-name">Đầu ra hiện tại không có mô hình miễn phí khả dụng đã đo thực tế</span>
      <span class="h-meta">${region?`<span>${region}  cái bị cổng khu vực chặn lại——đổi sang đầu ra nước ngoài (xoay vòng đăng ký proxy) thì khả năng cao sẽ khả dụng ngay</span>`:"<span>Nhiều khả năng đang trong cửa sổ bị giới hạn tốc độ, đợi một lúc hoặc đổi đầu ra rồi thử lại</span>"}</span>
    </div>`;
  }

  // ---- bộ đếm ----
  const cnt = (arr, fn) => arr.filter(fn).length;
  const stateCounts = {
    available: cnt(s.models, m=>m.state==="available"),
    throttled: cnt(s.models, m=>m.state==="throttled"),
    "region-blocked": cnt(s.models, m=>m.state==="region-blocked"),
    unavailable: cnt(s.models, m=>m.state==="unavailable"),
    unknown: cnt(s.models, m=>m.state==="unknown"||m.state==="custom"),
  };

  // ---- Thanh điều khiển dính trên cùng một dòng: tìm kiếm/mặc định/lọc/hàng loạt/chế độ xem gói gọn trong một dòng (cửa sổ hẹp sẽ tự xuống dòng) ----
  const chip = (kind, id, label, n) =>
    `<span class="mchip ${mf[kind]===id?"on":""}${n===0?" zero":""}" data-${kind}="${id}">${label}${n!=null?`<span class="cnt">${n}</span>`:""}</span>`;
  const active = mf.q || mf.chan || mf.state;
  const toolbar = `<div class="msticky">
    <h2 class="pt">Mô hình <span class="sub">${avail}/${laneModels.length} Khả dụng${customModels.length?` · Tuỳ chỉnh ${customProbed}/${customModels.length} Đã đo thực tế`:""}${hiddenCount?` · Đã ẩn ${hiddenCount}`:""}</span></h2>
    <div class="mbar">
      <input class="msearch" id="m-q" placeholder="Tìm kiếm id / tên mô hình…" value="${esc(mf.q)}">
      <select class="msearch" id="m-def" title="Mô hình mặc định được chèn vào cấu hình của từng Agent（để trống = cái đầu tiên trong danh sách）" style="width:auto;cursor:pointer">
        <option value="">Mô hình mặc định：（cái đầu tiên trong danh sách）</option>
        ${sorted.filter(m=>!m.hidden&&!m.systemOne).map(m=>`<option value="${esc(m.id)}" ${s.settings.defaultModel===m.id?"selected":""}>Mặc định：${esc(m.id)}</option>`).join("")}
      </select>
      <span class="mchip ${!mf.chan?"on":""}" data-chan="">Kênh</span>
      ${["zen","kilo","codearts"].map(c=>chip("chan",c,c,cnt(s.models,m=>!m.custom&&(m.channel||"zen")===c))).join("")}
      ${chip("chan","custom","Tuỳ chỉnh",customModels.length)}
      <span class="mchip ${!mf.state?"on":""}" data-state="">Trạng thái</span>
      ${chip("state","available","Khả dụng",stateCounts.available)}
      ${chip("state","throttled","bị giới hạn tốc độ",stateCounts.throttled)}
      ${chip("state","region-blocked","Bị giới hạn khu vực",stateCounts["region-blocked"])}
      ${chip("state","unavailable","Không khả dụng",stateCounts.unavailable)}
      <span class="spacer"></span>
      <button class="ghost" id="hide-dead" title="Ẩn khỏi bộ chọn Agent các mô hình được dò kiểm tra là không khả dụng / bị hạn chế theo khu vực; khi dò thấy khả dụng sẽ tự động gỡ ẩn">Ẩn toàn bộ mục không khả dụng</button>
      <button class="ghost" id="show-all" title="Khôi phục tất cả mô hình đã ẩn${hiddenCount?`（hiện tại ${hiddenCount}  cái）`:""}">Khôi phục hiển thị</button>
      <button class="ghost" id="reprobe">${s.probeTotal ? "Đang dò kiểm tra…" : "Dò kiểm tra lại"}</button>
      <span class="muted" id="m-count" style="font-size:11.5px"></span>
      ${s.probeTotal ? `<span class="muted" id="m-progress" style="font-size:11.5px">Đã dò kiểm tra <b>${s.probeDone}/${s.probeTotal}</b>${s.probingModel?` · Đang kiểm tra <code class="k">${esc(s.probingModel)}</code>`:""}</span>` : ""}
      ${active?`<span class="mchip on" id="m-clear" style="cursor:pointer">✕ Xoá bỏ</span>`:""}
      <span class="vtoggle" title="Thẻ để xem chi tiết, danh sách để quét nhanh toàn bộ">
        <button data-view="grid" class="${mview==="grid"?"on":""}">Thẻ</button>
        <button data-view="list" class="${mview==="list"?"on":""}">Danh sách</button>
      </span>
    </div>
  </div>`;

  // ---- lọc ----
  const chans = s.channels || [];
  const chanState = Object.fromEntries(chans.map(c=>[c.id, c]));
  const match = (m) =>
    (!mf.q || (m.id+" "+(m.name||"")).toLowerCase().includes(mf.q.toLowerCase()))
    && (!mf.chan || mf.chan === (m.custom ? "custom" : (m.channel || "zen")))
    && (!mf.state || m.state === mf.state);

  const groups = [];
  // Mỗi kênh một nhóm, thứ tự và danh sách đều lấy từ state.channels ở backend (cùng nguồn với lane.Channels).
  // Không hardcode danh sách kênh ở đây: làm vậy thì thêm một kênh phải sửa vài chỗ, sót một chỗ là cả loạt mô hình không có nhóm.
  for(const st of chans){
    if(st.id === "qoder") continue;   // Mô hình của Qoder do mục nhà cung cấp riêng của nó đảm nhiệm
    const meta = CHAN_META[st.id] || { name: st.id, desc: "", mark: st.id.slice(0,1).toUpperCase() };
    groups.push({ ch: st.id, meta, enabled: st.enabled, roster: st.models,
      refreshedAt: st.refreshedAt||0,
      cards: sorted.filter(m => !m.custom && (m.channel||"zen") === st.id) });
  }
  groups.push({ ch: "custom", meta: CHAN_META.custom, enabled: true, roster: customModels.length,
    cards: sorted.filter(m => m.custom) });

  const totalShown = s.models.filter(match).length;

  // ---- chế độ xem danh sách ----
  let listBody = "";
  if(mview === "list"){
    const rows = s.models.filter(m => !m.systemOne && match(m));
    listBody = `<table class="mlist"><thead><tr>
      <th>Trạng thái</th><th>Mô hình</th><th>Kênh</th><th>token đầu tiên</th><th>Điển hình</th><th>Ngữ cảnh</th><th>Đầu ra</th><th>Năng lực</th><th style="text-align:right">Thao tác</th>
    </tr></thead><tbody>`;
    for(const m of rows){
      const chans2 = m.channels && m.channels.length ? m.channels : [m.custom?"custom":(m.channel||"zen")];
      const caps = [m.vision?"Thị":"", m.audioInput?"Âm":"", m.fileInput?"Văn":"", m.reasoning?"Suy":""].filter(Boolean).join(" ");
      const hd = humanDetail(m);
      listBody += `<tr>
        <td>${m.id === s.probingModel ? '<span class="pill warn">Đang dò kiểm tra</span>' : statePill(m.state)}${m.hidden?' <span class="pill hidsync">Ẩn</span>':""}</td>
        <td><b>${esc(m.name)}</b><div class="mono" style="opacity:.75">${esc(m.id)}</div>${hd?`<div style="font-size:11px;color:var(--ink-mute)">${esc(hd)}</div>`:""}</td>
        <td>${chans2.map(chanBadge).join(" ")}</td>
        <td>${m.ttftMs?(m.ttftMs/1000).toFixed(1)+"s":"—"}</td>
        <td>${m.ttftMedMs?(m.ttftMedMs/1000).toFixed(1)+"s":"—"}</td>
        <td>${m.contextWindow?fmtCap(m.contextWindow):"—"}</td>
        <td>${m.maxOutput?fmtCap(m.maxOutput):"—"}</td>
        <td>${caps||"—"}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="starbtn ${s.settings.defaultModel===m.id?"on":""}" data-primary="${esc(m.id)}" title="Đặt làm chính（mô hình mặc định）">★</button>
          <button class="vpill ${m.hidden?"":"on"}" data-vis="${esc(m.id)}">${m.hidden?"＋Chọn dùng":"✓ Đã chọn dùng"}</button>
          <button class="ghost" data-copy="${esc(m.id)}" title="Sao chép id mô hình">Sao chép id</button>
          <button class="ghost mtest" data-m="${esc(m.id)}">Kiểm tra</button>
        </td>
      </tr>`;
    }
    listBody += `</tbody></table>${rows.length?"":`<div class="mempty">Không có mô hình nào khớp</div>`}`;
  }

  // ---- chế độ xem nhóm thẻ ----
  let body = "";
  let anyShown = false;
  if(mview === "grid"){
    for(const g of groups){
      const shown = g.cards.filter(match);
      const disabled = !g.enabled;
      const availInGroup = g.cards.filter(m => m.state === "available" && !m.hidden).length;
      if(!shown.length && (mf.q || mf.state || (mf.chan && mf.chan !== g.ch))) continue;
      anyShown = anyShown || shown.length > 0;
      // Kênh có 0 khả dụng mặc định thu gọn (ghi nhớ thao tác mở thủ công); khi lọc rõ ràng thì không thu gọn
      const folded = !disabled && availInGroup === 0 && !mf.state && (!mf.chan || mf.chan === g.ch) && foldedChans.has(g.ch);
      body += `<div class="msec">
        <span class="dot ${disabled?"off":"on"}"></span>
        <span class="chname">${esc(g.meta.name)}</span>
        ${g.ch!=="custom"?chanBadge(g.ch):`<span class="chan-badge chan-custom">custom</span>`}
        <span class="chdesc">${esc(g.meta.desc)}</span>
        ${disabled?`<span class="pill region">Đã tắt</span><button class="ghost" data-en="${g.ch}">Bật</button>`
          :`<span class="chcount">${shown.length}/${g.cards.length} cái${availInGroup?` · khả dụng ${availInGroup}`:""}${g.ch!=="custom"&&g.roster?` · danh sách ${g.roster}${g.refreshedAt?` · cập nhật ${new Date(g.refreshedAt*1000).toTimeString().slice(0,5)}`:""}`:""}</span>
            ${!disabled && availInGroup === 0 && !mf.state && (!mf.chan || mf.chan === g.ch) ? `<button class="ghost fold" data-fold="${g.ch}">${folded?"Mở rộng":"Thu gọn"}</button>`:""}`}
      </div>`;
      if(disabled && !shown.length){
        body += `<div class="mempty">Kênh đã tắt ——  ${g.roster||0}  mô hình của nó đã bị gỡ khỏi mọi bộ chọn Agent; nhấn「Bật」để khôi phục theo danh sách trong tệp kênh.</div>`;
        continue;
      }
      if(folded){
        body += `<div class="mempty" style="padding:8px 0">Nhóm này ở đầu ra hiện tại đều không khả dụng nên đã thu gọn · <button class="ghost fold" data-fold="${g.ch}" style="padding:2px 8px">Mở ra xem ${shown.length} cái</button></div>`;
        continue;
      }
      if(!shown.length){
        body += `<div class="mempty">${mf.q?"Không có mô hình nào khớp":"Kênh này hiện không có mô hình nào để hiển thị"}</div>`;
        continue;
      }
      body += `<div class="mgrid">`;
      for(const m of shown){
        const card = document.createElement("div");
        card.className = "mcard st-" + (m.hidden ? "hidden" : (m.state||"unknown")) + (m.hidden ? " dimmed" : "");
        const effLevel = (s.modelPrefs||{})[m.id] || s.settings.defaultEffort || "balanced";
        const canonEff = (rid, i, n) => ({light:"light",minimal:"light",low:"light",
          balanced:"balanced",medium:"balanced",deep:"deep",high:"deep",xhigh:"deep",max:"deep"}[String(rid).toLowerCase()]
          || (n<=1 ? "balanced" : i < n/3 ? "light" : i < 2*n/3 ? "balanced" : "deep"));
        const eff = (m.efforts||[]).map((e,i,arr)=>`<span class="eff m-eff" data-m="${esc(m.id)}" data-eff="${esc(e.id)}"
          title="Nhấn một lần = Các yêu cầu của mô hình này mà không có mức rõ ràng đều đi theo mức này（★ là mặc định hiện tại; nhấn thêm lần nữa để xoá）"
          style="cursor:pointer">${esc(e.zh || e.name || e.id)} <b>${(e.tokens/1024|0)}K</b>${canonEff(e.id,i,arr.length)===effLevel?" ★":""}</span>`).join("");
        const probeBusy = !!(m.task && m.task.kind === "probe" && m.task.status === "running");
        const capsBusy = !!(m.task && m.task.kind === "caps" && m.task.status === "running");
        const pill = m.id === s.probingModel
          ? `<span class="pill warn">Đang dò kiểm tra…</span>`
          : (m.hidden ? `<span class="pill hidsync">Đã ẩn</span>` : statePill(m.state));
        let quotaRow = "";
        if(!m.systemOne && !m.custom){
          const used = m.quotaUsed||0, est = m.quotaEstimate||0;
          const parts = [];
          if(est > 0){
            const pct = Math.min(100, Math.round(used/est*100));
            const cls = pct > 90 ? "bad" : (pct > 70 ? "warn" : "ok");
            parts.push(`<div class="qbar" title="Hôm nay ${fmtK(used)} / hạn mức ước tính ${fmtK(est)} tok"><i class="${cls}" style="width:${pct}%"></i></div>`
              + `<div class="qtext">Hôm nay ${fmtK(used)} / ước tính ${fmtK(est)} · ${pct}%</div>`);
          } else if(used > 0){
            parts.push(`<div class="qtext">Hôm nay ${fmtK(used)} tok · đang thống kê hạn mức</div>`);
          }
          if(m.throttledAt){
            const since = fmtUptime(Math.max(1,(Date.now()-m.throttledAt)/1000));
            const eta = m.recoverEta ? ` · dự kiến ${new Date(m.recoverEta).toTimeString().slice(0,5)} Khôi phục` : "";
            parts.push(`<div class="qtext warn2">Tạm thời bị giới hạn tốc độ ${since}${eta}</div>`);
          }
          if(parts.length) quotaRow = `<div class="mquota">${parts.join("")}</div>`;
        }
        const tags = (m.systemOne?'<span class="pill warn">Đánh giá mô hình</span>':"")
          + (m.vision?'<span class="tag">Thị giác</span>':"")
          + (m.audioInput?'<span class="tag">Âm thanh</span>':"")
          + (m.fileInput?'<span class="tag">Tệp</span>':"")
          + (m.reasoning?'<span class="tag">Suy luận</span>':"")
          + (m.tagSource==="Đo thực tế"?'<span class="tag" style="opacity:.65">Đo thực tế</span>':"");
        const meta = [];
        if(m.ttftMs || m.ttftMedMs){
          meta.push(`<span title="token đầu tiên của lần dò kiểm tra gần nhất${m.ttftCount?`；trung vị của  ${m.ttftCount}  mẫu gần nhất ${m.ttftMedMs?(m.ttftMedMs/1000).toFixed(1)+"s":"—"}，định tuyến sắp xếp theo đó`:""}">token đầu tiên <b>${m.ttftMs?(m.ttftMs/1000).toFixed(1)+"s":"—"}</b>${m.ttftMedMs?` <span style="opacity:.7">· điển hình ${(m.ttftMedMs/1000).toFixed(1)}s</span>`:""}</span>`);
        }
        if(m.contextWindow) meta.push(`<span title="${m.custom?"Được cung cấp từ khai báo /v1/models của nhà cung cấp hoặc từ chú thích của AI":"Bảng năng lực cục bộ"}">Ngữ cảnh <b>${fmtCap(m.contextWindow)}</b></span>`);
        if(m.maxOutput) meta.push(`<span title="${m.custom?"Giới hạn hoàn thành do nhà cung cấp khai báo（không hiển thị đối với nhà cung cấp chỉ trả về cửa sổ ngữ cảnh）":"Bảng năng lực cục bộ"}">Đầu ra <b>${fmtCap(m.maxOutput)}</b></span>`);
        const hd = humanDetail(m);
        const rawTitle = rawDetailTitle(m);
        const isPrimary = s.settings.defaultModel === m.id;
        card.innerHTML = `
          <div class="mhead">
            <button class="starbtn ${isPrimary?"on":""}" data-primary="${esc(m.id)}" title="${isPrimary?"Mô hình chính hiện tại, nhấn một lần để huỷ":"Đặt làm chính（mô hình mặc định + xuất hiện trong bộ chọn）"}">★</button>
            <span class="mname" title="${esc(m.name)}">${esc(m.name)}</span>${pill}</div>
          <div class="mid">${(m.channels&&m.channels.length?m.channels:[m.custom?"custom":(m.channel||"zen")]).map(chanBadge).join(" ")} <span style="opacity:.85">${esc(m.id)}</span></div>
          ${m.blurb && !sharedBlurbSet.has(m.blurb)?`<div class="mblurb${openBlurbs.has(m.id+"|"+m.blurb.slice(0,20))?" open":""}" data-bk="${esc(m.id)}|${esc(m.blurb.slice(0,20))}" title="${esc(m.blurb)}">${esc(m.blurb)}</div>`:""}
          ${meta.length?`<div class="mmeta">${meta.join("")}</div>`:""}
          ${(tags||eff)?`<div class="mtags">${tags}${eff?`<span class="meff">${eff}</span>`:""}</div>`:""}
          ${quotaRow}
          ${hd?`<div class="mdetail" ${rawTitle?`title="${esc(rawTitle)}"`:""}>${esc(hd)}</div>`:""}
          ${taskBand(m)}
          <div class="mfoot">

              <button class="ghost mtest" data-m="${esc(m.id)}" ${probeBusy?"disabled":""} title="${m.custom?"Gửi một yêu cầu tối thiểu tới nhà cung cấp đó, đo thực tế tính khả dụng và độ trễ token đầu tiên":"Dò kiểm tra riêng tính khả dụng của mô hình này"}">${probeBusy?"Đang kiểm tra…":"Kiểm tra"}</button>
              ${m.custom?`<button class="ghost capstest" data-m="${esc(m.id)}" ${capsBusy?"disabled":""} title="Dùng Key của bạn để gửi yêu cầu hình ảnh / âm thanh / PDF tối thiểu, đo thực tế các phương thức đầu vào mà mô hình thực sự hỗ trợ（kết quả được ưu tiên cao nhất）">${capsBusy?"Đang đo thực tế…":"Kiểm tra năng lực thực tế"}</button>`:""}

  el.querySelector("#hide-dead").onclick = async ()=>{

        if(r.state==="available") toast("✓ Khả dụng" + (sec?" · "+sec:""));
        else if(r.state==="throttled") toast("Tạm thời bị giới hạn tốc độ·có thể thử lại —— yêu cầu đã bị từ chối trước khi tạo, không có dữ liệu token đầu tiên" + (r.detail?" · "+humanDetail({detail:r.detail}):""));
        else if(r.state==="unavailable") toast("Không khả dụng · " + (r.detail||""));
        else toast("Dò kiểm tra không thành công · " + (r.detail||"Phía upstream không phản hồi, thử lại sau một lúc"));
      }
      refresh();
    };
  });
  el.querySelectorAll(".capstest").forEach(b=>{
    b.onclick = async ()=>{
      b.disabled = true; b.textContent = "Đang đo thực tế…";
      const j = await api("/tags/probe", { id: b.dataset.m });
      if(j && j.running){ toast("Đang đo thực tế năng lực, xem tiến độ trên thẻ"); refresh(); return; }
      if(j && j.ok) toast("Đã bắt đầu đo thực tế năng lực（mỗi loại hình ảnh/âm thanh/PDF một lượt）, xem tiến độ trên thẻ");
      else if(j && j.error) toast("Đo thực tế thất bại · " + j.error);
      refresh();
    };
  });
  el.querySelectorAll(".tdet").forEach(b=>{
    b.onclick = ()=>openTaskDrawer(b.dataset.m);
  });
  // Đang có tác vụ dò kiểm tra chạy: thẻ tự chạy bộ đếm theo 250ms, và theo nhịp 1s xin giai đoạn mới từ phía máy chủ.
  startTaskTicker();
  clearTimeout(fastPollTimer);
  if(sorted.some(m=>m.task && m.task.status === "running")) fastPollTimer = setTimeout(refresh, 1000);
  window.scrollTo(0, scrollY);
}

async function renderQoderCard(){
  const st = await fetch("/admin/api/qoder/status").then(r=>r.json()).catch(()=>null);
  wallStatus.qoder = st;
  const stateEl = $("#qoder-state"), body = $("#qoder-body");
  if(!stateEl || !body) return;
  const repo = 'https://github.com/Morpheus799/qodercn-gateway';
  if(!st || !st.running){
    stateEl.textContent = "Chưa chạy";
    body.innerHTML = 'Gateway Qoder tích hợp chưa khởi động——thường là do cổng 8095 bị một phiên bản qodercn-gateway khác chiếm dụng' +
      '（chỉ cần tắt phiên bản đó và khởi động lại openki）.' +
      'Sau đó mở <a href="'+repo+'" target="_blank">Qoder IDE</a> Đăng nhập một lần, mô hình sẽ tự động xuất hiện.';
    return;
  }
  // The device login works with no IDE at all: the grant is what mints the
  // credential, so the button has to survive the "not logged in" branch below.
  const btnLogin = $("#qoder-login");
  if(btnLogin) btnLogin.style.display = st.poolEnabled ? "" : "none";
  if(!st.loggedIn){
    stateEl.textContent = "Chưa đăng nhập";
    body.innerHTML = 'Gateway đang trực tuyến, nhưng chưa có phiên đăng nhập Qoder nào khả dụng.' +
      (st.poolEnabled
        ? 'Nhấn thẳng「Đăng nhập uỷ quyền」, đăng nhập một tài khoản Qoder trong trình duyệt——thông tin đăng nhập sẽ vào nhóm tài khoản, không cần mở IDE trước; muốn thêm tài khoản thứ hai thì nhấn thêm lần nữa.'
        : 'Mở <a href="'+repo+'" target="_blank">Qoder IDE</a> Đăng nhập một lần——gateway sẽ đọc lại thông tin đăng nhập ở mỗi yêu cầu, sau khi làm mới mô hình sẽ tự động khôi phục, không cần khởi động lại gateway.') +
      (st.detail ? '<div class="acc-note">'+esc(st.detail)+'</div>' : '');
    qoderRenderPool(st);
    return;
  }
  const pool = st.pool || [];
  stateEl.textContent = "Đã đăng nhập · " + (st.models||[]).length + "  mô hình" +
    (st.poolEnabled ? " · " + pool.length + "  tài khoản" : "");
  body.innerHTML = 'Mô hình đã vào mọi bộ chọn Agent（<code>qoder/tên mô hình</code>）。' +
    (st.poolEnabled
      ? 'Khi hạn mức của một tài khoản dùng hết hoặc đăng nhập mất hiệu lực, cùng một yêu cầu sẽ tự động chuyển sang tài khoản tiếp theo để tiếp tục trả lời.'
      : 'Hiện chỉ đang dùng phiên đăng nhập đó của Qoder IDE——đưa nó vào nhóm tài khoản là có thể tiếp tục dùng khi IDE mất kết nối.') +
    '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">' +
    (st.models||[]).map(m=>'<span class="badge">'+m.replace(/^qoder\//,'')+'</span>').join('') +
    '</div>';
  qoderRenderPool(st);
}

// Trạng thái thẻ của một tài khoản trong nhóm: văn bản chỉ nêu sự thật, màu sắc do cls đi theo biến chủ đề（trước đây hardcode #c55/#c88）.
function qoderPoolState(a){
  if(a.state === "auth") return {text:"Đăng nhập mất hiệu lực", cls:"bad"};
  if(a.state === "disabled") return {text:"Đã tắt", cls:"unknown"};
  if(a.state === "cooldown") return {text:"Đang bị giới hạn tốc độ", cls:"warn"};
  if(a.state === "ok") return {text:"Khả dụng", cls:"ok"};
  return {text:a.state || "Không rõ", cls:"unknown"};
}

function qoderRenderPool(st){
  const list = $("#qoder-pool");
  if(!list) return;
  const pool = st.pool || [];
  if(!st.poolEnabled){ list.innerHTML = ""; return; }
  // Several device logins may be waiting at once — that is how a second and
  // third account get added — so the count is part of the roster's state.
  const waiting = qoderLoginTimers.size ? `<div class="acc-wait"><span class="dot"></span>` +
    `Đang chờ ${qoderLoginTimers.size}  cửa sổ uỷ quyền hoàn tất: sau khi đăng nhập trong trình duyệt, tài khoản sẽ tự động vào nhóm；` +
    `Trong thời gian đó có thể nhấn thêm「Đăng nhập uỷ quyền」để tiếp tục thêm tài khoản.</div>` : "";
  if(!pool.length){
    list.innerHTML = waiting + '<div class="acc-empty">Nhóm tài khoản vẫn trống. Nhấn「Đăng nhập uỷ quyền」để đăng nhập một tài khoản Qoder trong trình duyệt——' +
      'Thông tin đăng nhập sẽ vào thẳng nhóm, muốn thêm tài khoản thứ hai thì nhấn thêm lần nữa; cũng có thể nhấn「Thu thập đăng nhập IDE hiện tại」để lưu tài khoản hiện tại trong IDE vào.</div>';
    return;
  }
  list.innerHTML = waiting + pool.map((a, i) => {
    const s = qoderPoolState(a);
    const now = i === 0;
    const name = esc(a.label || a.uid || a.id || "-");
    const uid = a.uid ? `<div class="acc-id" title="${esc(a.uid)}">uid ${esc(a.uid)}</div>` : "";
    const until = a.state === "cooldown" && a.cooldownUntil
      ? new Date(a.cooldownUntil).toLocaleTimeString().slice(0,5) : "";
    const chips = [];
    if(now) chips.push('<span class="acc-chip now">Đang nhận yêu cầu</span>');
    if(!a.enabled) chips.push('<span class="acc-chip">Đã tắt · Không tham gia luân phiên</span>');
    if(until) chips.push(`<span class="acc-chip warn">${until} Khôi phục</span>`);
    // A device-authorized account expires on its own; say when, so a dead row
    // is not mistaken for an upstream outage.
    if(a.expiresAt){
      const left = Math.ceil((new Date(a.expiresAt) - Date.now()) / 86400000);
      chips.push(left <= 3
        ? `<span class="acc-chip warn">${left <= 0 ? "Đăng nhập đã hết hạn" : "Còn " + left + "  ngày nữa sẽ hết hạn"}</span>`
        : `<span class="acc-chip">Còn ${left}  ngày nữa sẽ hết hạn</span>`);
    }
    const note = a.lastError
      ? `<div class="acc-note${s.cls === "bad" ? " bad" : ""}">${esc(a.lastError)}</div>` : "";
    return `<div class="acc${now ? " now" : ""}${a.enabled ? "" : " off"}" data-id="${esc(a.id)}">
      <div class="acc-hd">
        <span class="acc-idx">${i+1}</span>
        <span class="acc-name" title="${name}">${name}</span>
        <span class="pill ${s.cls} acc-badge">${s.text}</span>
      </div>
      ${uid}
      ${note}
      <div class="acc-chips">${chips.join("")}</div>
      <div class="acc-acts">
        <button class="qoder-act" data-act="primary" data-id="${esc(a.id)}"${now ? " disabled" : ""}>Ưu tiên sử dụng</button>
        <button class="qoder-act" data-act="toggle" data-id="${esc(a.id)}" data-enabled="${a.enabled ? "0" : "1"}">${a.enabled ? "Tắt" : "Bật"}</button>
        <button class="qoder-act danger" data-act="delete" data-id="${esc(a.id)}">Gỡ bỏ</button>
      </div>
    </div>`;
  }).join("");
}

// Device logins are independent windows, so several can be open at once —
// that is the whole point of "sign another account in". Each state gets its
// own timer; the pool list shows how many are still waiting.
const qoderLoginTimers = new Map();

// pollQoderLogin follows one authorization window until the browser finishes.
// Pending is the normal answer — 404/202 upstream — so it stays quiet.
function pollQoderLogin(state){
  if(qoderLoginTimers.has(state)) return;
  const started = Date.now();
  const stop = () => { clearInterval(timer); qoderLoginTimers.delete(state); };
  const timer = setInterval(async () => {
    if(Date.now() - started > 10 * 60 * 1000){
      stop();
      toast("Cửa sổ uỷ quyền đã hết thời gian chờ, hãy nhấn lại 「Đăng nhập uỷ quyền」");
      renderQoderCard();
      return;
    }
    const j = await api("/qoder/pool", { action: "login-poll", state });
    if(!j){ stop(); renderQoderCard(); return; }
    if(j.status === "pending") return;
    stop();
    if(j.status === "ok"){
      toast("Đã thêm vào nhóm tài khoản：" + ((j.account && j.account.label) || "Tài khoản Qoder"));
    } else {
      toast(j.message || "Uỷ quyền chưa hoàn tất");
    }
    renderQoderCard();
  }, 2500);
  qoderLoginTimers.set(state, timer);
}

function bindQoderCard(){
  // Thẻ tài khoản đã được chuyển vào cửa sổ bật lên của kênh (.chan-pane[data-chan="qoder"]), id thẻ cũ đã không còn từ lâu,
  // Dùng nó làm điều kiện bảo vệ sẽ khiến cả khối không bao giờ được gắn kết (nút vẫn hiển thị nhưng nhấn vào không có phản ứng, issue #126).
  // Điều kiện bảo vệ đổi sang nhìn vào vùng chứa nhóm tài khoản thực sự tồn tại: nó luôn ở cùng cửa sổ bật lên, chỉ cần gắn kết một lần.
  const card = $("#qoder-pool");
  if(!card || card.dataset.bound) return;
  card.dataset.bound = "1";
  const lg = $("#qoder-login");
  if(lg) lg.onclick = async () => {
    lg.disabled = true;
    const start = await api("/qoder/pool", { action: "login-start" });
    lg.disabled = false;
    if(!start || !start.authUrl){ if(!start) toast("Không thể bắt đầu uỷ quyền Qoder"); return; }
    window.open(start.authUrl, "_blank", "noopener");
    toast("Đã mở trang uỷ quyền Qoder trong trình duyệt, sau khi đăng nhập hoàn tất tài khoản sẽ tự động được thêm vào");
    pollQoderLogin(start.state);
    renderQoderCard();
  };
  const imp = $("#qoder-import");
  if(imp) imp.onclick = async () => {
    imp.disabled = true;
    const j = await api("/qoder/pool", { action: "import" });
    imp.disabled = false;
    if(j && j.ok) toast("Đã thu thập đăng nhập Qoder IDE hiện tại vào nhóm tài khoản");
    renderQoderCard();
  };
  // Rows are re-rendered on every refresh, so actions are delegated.
  const list = $("#qoder-pool");
  if(list) list.onclick = async (ev) => {
    const btn = ev.target.closest(".qoder-act");
    if(!btn) return;
    const id = btn.dataset.id, act = btn.dataset.act;
    btn.disabled = true;
    let j = null;
    if(act === "primary") j = await api("/qoder/pool", { action: "primary", id });
    else if(act === "toggle") j = await api("/qoder/pool", { action: "toggle", id, enabled: btn.dataset.enabled === "1" });
    else if(act === "delete"){
      if(!confirm("Xoá tài khoản này khỏi nhóm tài khoản này? (Đăng nhập trong IDE không bị ảnh hưởng)")){ btn.disabled = false; return; }
      j = await api("/qoder/pool", { action: "delete", id });
    }
    if(j && j.ok) toast("Nhóm tài khoản đã được cập nhật");
    renderQoderCard();
  };
}

/* Thẻ kênh tài khoản CodeArts (华为云): trạng thái đọc từ /admin/api/codearts/status, đăng nhập là
   PKCE + kênh đôi callback/dò kiểm tra——máy chủ mở trang uỷ quyền trong trình duyệt mặc định, ở đây hai giây dò kiểm tra một lần.
   Cùng một dạng với thẻ WorkBuddy: đăng nhập, đăng xuất, công tắc bật/tắt. */
let caPollTimer = null;
async function renderCodeartsCard(){
  const st = await fetch("/admin/api/codearts/status").then(r=>r.json()).catch(()=>null);
  wallStatus.codearts = st;
  const state = $("#ca-state"), body = $("#ca-body");
  if(!state || !body || !st){ if(state) state.textContent = "Lấy trạng thái thất bại"; return; }
  setToggle("#tg-codearts", !!st.enabled);
  const lg = $("#ca-logout");
  if(lg) lg.style.display = st.loggedIn ? "" : "none";
  const lb = $("#ca-login");
  if(lb) lb.style.display = st.loggedIn ? "none" : "";
  if(!st.loggedIn){
    state.textContent = "Chưa đăng nhập";
    body.innerHTML = 'Sau khi uỷ quyền bằng tài khoản 华为云, các mô hình miễn phí của CodeArts Agent (GLM / DeepSeek / Qwen-VL và các gói phúc lợi có thời hạn luân phiên)'+
      'trực tiếp xuất hiện trong trang 「Mô hình」 và mọi bộ chọn Agent, tự động điểm danh mỗi ngày để nhận điểm (hoạt động chính thức kết thúc vào '+
      '<span style="white-space:nowrap">2026-12-31</span>）。'+
      'Nội dung prompt có thể bị phía upstream ghi lại, đừng gửi nội dung bí mật.';
    return;
  }
  state.textContent = st.enabled ? "Đã bật" : "Đã tắt";
  const exp = st.expiresAtMs ? new Date(st.expiresAtMs).toLocaleString() : "Không rõ";
  // Nickname, uid and the check-in date are upstream/config data, not markup.
  // They used to reach innerHTML raw, so one imported config value could run
  // script in the admin origin and read /admin/api/export?secrets=1.
  body.innerHTML = 'Tài khoản <b>' + esc(st.nickname || st.uid || "-") + '</b> · Thông tin xác thực STS có hiệu lực đến ' + esc(exp) +
    ' · Mô hình trong danh mục <b>' + esc(String(st.models || 0)) + '</b> · Lần điểm danh trước ' + esc(st.lastCheckinDate || "—") +
    (st.canRefresh ? '' : '<br><span style="color:#c88">Thiếu thông tin xác thực có thể gia hạn, hãy uỷ quyền lại một lần</span>');
}
function bindCodeartsCard(){
  const card = $("#ca-body");
  if(!card || card.dataset.bound) return;
  card.dataset.bound = "1";
  $("#ca-login").onclick = async () => {
    const b = $("#ca-login");
    b.disabled = true;
    const j = await api("/codearts/login/start", {});
    b.disabled = false;
    if (!j || !j.authUrl) return;
    // Máy chủ đã mở trang uỷ quyền bằng trình duyệt mặc định của hệ thống; ở đây đưa liên kết dự phòng và dò kiểm tra hai giây một lần.
    const state = $("#ca-state"), body = $("#ca-body");
    state.textContent = "Đang chờ uỷ quyền…";
    body.innerHTML = 'Trang uỷ quyền đã được mở trong trình duyệt mặc định (đăng nhập tài khoản 华为云 + uỷ quyền tài khoản).' +
      'Khi không tự động bật lên <a href="' + esc(safeHref(j.authUrl)) + '" target="_blank" rel="noopener">Nhấn vào đây để mở trang uỷ quyền</a>。' +
      'Sau khi hoàn tất, ở đây sẽ tự động đổi thông tin xác thực STS và kéo danh mục mô hình (thời hạn hiệu lực tối đa 5 phút).';
    const deadline = Date.now() + 5*60*1000;
    if (caPollTimer) clearInterval(caPollTimer);
    caPollTimer = setInterval(async () => {
      if (Date.now() > deadline) { clearInterval(caPollTimer); caPollTimer = null; renderCodeartsCard(); return; }
      const p = await fetch("/admin/api/codearts/login/poll").then(r=>r.json()).catch(()=>null);
      if (p && p.state === "ok") {
        clearInterval(caPollTimer); caPollTimer = null;
        toast("Uỷ quyền CodeArts thành công, các mô hình miễn phí đang được đưa vào danh mục");
        renderCodeartsCard();
      } else if (p && p.state === "error") {
        clearInterval(caPollTimer); caPollTimer = null;
        toast("Đăng nhập CodeArts chưa hoàn tất：" + (p.error || "Hãy thử lại"));
        renderCodeartsCard();
      }
    }, 2000);
  };
  $("#ca-logout").onclick = async () => {
    const j = await api("/codearts/logout", {});
    if (j) toast("Đã đăng xuất khỏi tài khoản CodeArts");
    renderCodeartsCard();
  };
  const tgb = $("#tg-codearts");
  tgb.onclick = async () => {
    const on = tgb.dataset.on !== "1";
    const j = await api("/settings", { codeArtsEnabled: on });
    if(j){ setToggle("#tg-codearts", on); toast(on ? "Kênh CodeArts đã được bật" : "Kênh CodeArts đã tắt"); }
    renderCodeartsCard();
  };
}

      const name = el.querySelector("#pv-name").value.trim();
      const url = el.querySelector("#pv-url").value.trim();
      if(!url){ toast("Điền Base URL trước"); return; }
      const btn = el.querySelector("#pv-fetch");
      btn.disabled = true; btn.textContent = "Đang kéo…";
      // Khi chỉnh sửa, Key là write-only (để trống=giữ nguyên giá trị ban đầu), dùng Key đã lưu để kéo với save:false
      let body, usingStored = false;
      const keyLines = pvKeyLines();
      if(pvEditing && !keyLines.length && !el.querySelector("#pv-key").value){
        body = { id: pvEditing, save:false }; usingStored = true;
      } else if(keyLines.length){
        body = { name: name||"provider", baseUrl: url, apiKeys: keyLines, protocol: pvProto() };
      } else {
        body = { name: name||"provider", baseUrl: url, apiKey: el.querySelector("#pv-key").value, protocol: pvProto() };
      }
      const r = await fetch("/admin/api/providers/models", {method:"POST",
        headers:{"content-type":"application/json","x-openki-admin":"1"}, body: JSON.stringify(body)});
      btn.disabled = false; btn.textContent = "Kéo danh sách mô hình";
      const j = await r.json().catch(()=>({}));
      if(!j.ok){ toast(j.error || "Kéo thất bại"); return; }
      if(j.saved){ pvResetForm(); toast("Danh sách mô hình đã được làm mới"); refresh(); return; }
      pvFetched = j.models || [];
      pvCatalog = j.catalog || [];
      // Mặc định chỉ đánh dấu các mô hình được backend đề xuất là"dễ dùng"tập con (danh sách tuyển chọn + lọc theo heuristic), không đánh dấu tất cả
      const rec = j.recommended || [];
      pvSelected = new Set(rec.filter(m => pvFetched.includes(m)));
      pvRenderPicker();
      toast("Đã kéo được " + pvFetched.length + " mô hình, đã đánh dấu mặc định " + pvSelected.size + " mô hình dễ dùng");
    };
    el.querySelector("#pv-save").onclick = async ()=>{
      const name = el.querySelector("#pv-name").value.trim();
      const url = el.querySelector("#pv-url").value.trim();
      if(!name || !url){ toast("Tên và Base URL là bắt buộc"); return; }
      const keyLines = pvKeyLines();
      const body = { name, baseUrl: url,
        apiKey: keyLines.length ? "" : el.querySelector("#pv-key").value,
        protocol: pvProto(), enabled: true };
      if(keyLines.length) body.apiKeys = keyLines;
      if(pvEditing){
        body.id = pvEditing;
        if(pvFetched.length){
          body.models = [...pvSelected];
          if(pvCatalog.length) body.catalog = pvCatalog;
        }
      } else {
        // Khi thêm mới mà chưa từng kéo mô hình thì kéo một lần trước: tiện thể kiểm tra khả năng kết nối
        if(!pvFetched.length){
          const probeBody = {name, baseUrl: url, protocol: body.protocol};
          if(keyLines.length) probeBody.apiKeys = keyLines; else probeBody.apiKey = body.apiKey;
          const fr = await fetch("/admin/api/providers/models", {method:"POST",
            headers:{"content-type":"application/json","x-openki-admin":"1"}, body: JSON.stringify(probeBody)});
          const fj = await fr.json().catch(()=>({}));
          if(fj.ok){
            pvFetched = fj.models || [];
            pvCatalog = fj.catalog || [];
            pvSelected = new Set((fj.recommended || []).filter(m => pvFetched.includes(m)));
            pvRenderPicker();
          }
          else if(!confirm("Kéo mô hình thất bại：" + (fj.error||"") + "\nvẫn muốn lưu chứ? (Có thể kéo và chọn thủ công sau)")) return;
        }
        if(!pvSelected.size && pvFetched.length && !confirm("Chưa đánh dấu bất kỳ mô hình nào, sau khi lưu danh sách mô hình sẽ trống. Tiếp tục?")) return;
        if(pvFetched.length){
          body.models = [...pvSelected];
          if(pvCatalog.length) body.catalog = pvCatalog;
        }
      }
      const j = await api("/providers", body);
      if(j){ const wasEditing = !!pvEditing; pvResetForm(); toast(wasEditing ? "Đã lưu, danh sách mô hình đã được cập nhật" : "Đã kết nối, các mô hình đã đánh dấu đã xuất hiện trong /v1/models"); refresh(); }
    };
    el.dataset.rendered = "1";
    // Con trượt của .seg chỉ đo được khi phần tử hiện: thư viện preset nằm
    // trong <details> đóng lúc render, nên đo lại ngay khi người dùng mở ra.
    const presetFold = el.querySelector("#pv-preset-fold");
    if(presetFold) presetFold.addEventListener("toggle", ()=>{ if(presetFold.open) initSegs(); });
  }
  // Preset (backend cấp xuống, frontend không ghi cứng): thuộc mục 「Preset nhà cung cấp」, tìm kiếm / chuyển đổi Thường dùng xem pvRenderPresets
  pvPresetsAll = s.providerPresets || [];
  pvRenderPresets();
  renderProviderList(s);
  bindCodeartsCard();
  renderQoderCard();
  bindQoderCard();
  renderZCodeCard();
  bindZCodeCard();
  renderTraeCard();
  bindTraeCard();
  renderExtCard();
  bindExtCard();
  // Dữ liệu tường kênh là /channel/wall của backend, và việc mỗi thẻ ở trên tự kéo status là hai đường song song
  // : tường vẽ một nét trước theo ảnh chụp đã có, sau khi wall trả về thì vẽ thêm một nét nữa (nếu chữ ký bằng nhau thì không vẽ lại).
  renderChannelWall(s);
  loadWallChannels();
}

/* ---- Tường kênh ------------------------------------------------------------

   Một thẻ = một kênh, việc phân nhóm chỉ nhìn vào một tiêu chí duy nhất: enabled.
   Dòng trạng thái chỉ nói những điều **chắc chắn** thành bất thường (chưa đăng nhập / đã tắt), thiếu dữ liệu thì đều hiển thị như bình thường
   —— cùng định hướng với groupProviders của hub: hiển thị có thể thận trọng, thao tác phải rõ ràng.

   Tường không giữ dữ liệu kênh: các mục đến từ /admin/api/channel/wall (backend cấp đủ cả 12 mục trong một lần),
   nhấn vào thì uỷ thác cho bảng điều khiển quản lý thật ở phía dưới trang. */
const wallStatus = {};

/* Hàm thuần: một thẻ cần hiển thị gì. tone chỉ có ba loại——ok / warn / off.
   「Không có tài khoản」 là hướng dẫn (warn, nhấn mở là thêm được), 「Kênh đã tắt」 là trạng thái (off, làm mờ),
   hai điều này không thể lẫn lộn: điều trước cần người ta hành động, điều sau là việc người ta đã làm. */
function wallStateOf(channel, accounts, models, hint){
  if(channel && channel.enabled === false){
    return { tone: "off", prefix: "Đã đóng", text: "" };
  }
  if(accounts && accounts.total === 0){
    // Chỉ khi có việc có thể làm mới đưa ra 「nhấn mở…」; kênh không có cổng đăng nhập thì không nên hiển thị một thao tác không làm được.
    return { tone: "warn", prefix: "Chưa đăng nhập", text: hint ? "Nhấn để mở" + hint : "" };
  }
  if(accounts && accounts.enabled === 0 && accounts.total > 0){
    return { tone: "warn", prefix: "Đã tắt", text: "" };
  }
  const bits = [];
  if(accounts && typeof accounts.total === "number") bits.push(accounts.total + " Tài khoản");
  if(typeof models === "number" && models > 0) bits.push(models + " Mô hình");
  return { tone: "ok", prefix: "", text: bits.join(" · ") };
}

// Qoder trong config.json có một id=qoder là mục nhà cung cấp, nhưng đó là do chính gateway tự đồng bộ
// ra, nếu liệt kê thành nhà cung cấp tuỳ chỉnh sẽ trùng tên với thẻ kênh của chính nó.
const WALL_MANAGED_PROVIDERS = new Set(["qoder"]);

/* Tất cả kênh dùng chung một bộ dữ liệu: /admin/api/channel/wall trả về trong một lần 12 kênh + nhóm tài khoản của từng kênh.
   Trước đây là ghép từ bốn yêu cầu độc lập (status của ba thẻ tài khoản + tệp kênh trong state),
   cái giá là thẻ sẽ được vẽ thành 「Không có tài khoản」 trước rồi mới bổ sung số, và thêm một loại kênh là phải thêm một lần ở phía client
   yêu cầu. Nay backend nói rõ mỗi thẻ là gì (loại login), frontend chỉ việc vẽ.

   Lưu ý: ở đây chỉ nói 「kênh này có gì」. Đăng nhập/thêm tài khoản vẫn đi qua các giao diện sẵn có tương ứng——
   wall là mô hình đọc, mô hình ghi không triển khai lặp lại. */
let wallChannels = null;     // null = chưa lấy về; [] = đã lấy nhưng không có
let wallChannelsErr = "";
let wallChannelsFetching = false;

async function loadWallChannels(){
  if(wallChannelsFetching) return;
  wallChannelsFetching = true;
  try{
    const j = await fetch("/admin/api/channel/wall").then(r=>r.json());
    wallChannels = (Array.isArray(j.channels) ? j.channels : []).filter(c => c && c.id !== "workbuddy");
    wallChannelsErr = j.error || "";
  }catch(e){
    wallChannels = [];
    wallChannelsErr = "Đọc trạng thái kênh thất bại：" + (e && e.message || e);
  }finally{
    wallChannelsFetching = false;
    renderChannelWall(STATE || {});
  }
}

/* Loại login → thẻ này sau khi nhấn mở có thể làm gì. Nội dung hiển thị đi theo khả năng, không đi theo tên kênh：
   một kênh không có cổng đăng nhập thì không thể hiển thị 「Nhấn mở để thêm tài khoản」. */
function wallLoginHint(login){
  if(login === "paste")   return "Đăng nhập bằng cách dán thông tin xác thực";
  if(login === "browser") return "Đăng nhập uỷ quyền qua trình duyệt";
  return "";
}

function wallChannelEntries(){
  return (wallChannels || []).map(c=>{
    const accs = c.accounts || { total: 0, enabled: 0 };
    return {
      key: c.id, id: c.id, name: c.label || c.id,
      mark: (c.label || c.id).trim().slice(0,1).toUpperCase() || "+",
      icon: "", iconURI: CHAN_ICONS[c.id] || "",
      off: c.enabled === false,
      accounts: c.login ? accs : null,   // Kênh không có nhóm tài khoản thì không vẽ số tài khoản
      models: c.models || 0,
      target: c.id,
      login: c.login || "",
      blurb: c.blurb || "",
      extra: c.extra || "",
    };
  });
}

function wallEntries(s){
  const list = wallChannelEntries();
  for(const p of (s.providers||[])){
    if(WALL_MANAGED_PROVIDERS.has(p.id)) continue;
    list.push({
      key: "pv:" + p.id, id: "pv:" + p.id, name: p.name || p.id,
      mark: (p.name || p.id).trim().slice(0,1).toUpperCase() || "+",
      icon: "", host: hostOf(p.baseUrl || "").toLowerCase(),
      off: !p.enabled,
      // A custom provider has no account pool — its "credential" is the Key the
      // user typed, and a count of 1 would read as "one account logged in".
      accounts: p.hasKey === false ? { total: 0, enabled: 0 } : null,
      models: (p.models||[]).length,
      target: "pv:" + p.id,
    });
  }
  return list;
}

function renderChannelWall(s){
  const wall = $("#cwall"); if(!wall) return;
  // Ô nhập tồn tại riêng biệt, khi lọc chỉ vẽ lại vùng thẻ. Vẽ lại toàn bộ innerHTML sẽ thay ô nhập cùng lúc——
  // các ký tự trong thời gian đang tổ hợp bằng bộ gõ tiếng Trung sẽ bị nuốt, đây là lỗi thường gặp nhất của kiểu 「vừa nhập vừa lọc」 này.
  let tools = wall.querySelector(".cwall-tools");
  if(!tools){
    wall.innerHTML = `
      <div class="cwall-tools">
        <input class="cwall-filter" type="search" placeholder="Lọc kênh…" value=""
          aria-label="Lọc kênh theo tên">
        <span class="muted" style="font-size:11.5px">Nhấn vào một thẻ để mở phần quản lý tài khoản của nó</span>
        <button class="ghost" id="cwall-add" title="Kết nối một nhà cung cấp tuỳ chỉnh tương thích OpenAI / Anthropic"
          style="margin-left:auto">＋ Thêm nhà cung cấp</button>
      </div>
      <div class="cwall-body"></div>`;
    tools = wall.querySelector(".cwall-tools");
    const addBtn = wall.querySelector("#cwall-add");
    if(addBtn) addBtn.onclick = ()=>{ pvResetForm(); pvSetFormOpen(true); };
    const input = wall.querySelector(".cwall-filter");
    input.oninput = ()=>{
      wall.dataset.q = input.value;
      renderChannelWall(STATE);
    };
    // Esc để xoá: nút 「Huỷ」 trong ô tìm kiếm ở một số trình duyệt không phát sự kiện input
    input.onkeydown = (ev)=>{
      if(ev.key === "Escape" && input.value !== ""){
        input.value = "";
        wall.dataset.q = "";
        renderChannelWall(STATE);
      }
    };
  }
  const body = wall.querySelector(".cwall-body");
  if(!body) return;

  const entries = wallEntries(s);
  const needle = (wall.dataset.q || "").trim().toLowerCase();
  const match = e => !needle || e.name.toLowerCase().includes(needle) || e.id.toLowerCase().includes(needle) || (e.host||"").includes(needle);
  // Thiếu trạng thái thì đều coi như đang mở: thà hiển thị thêm một thẻ còn hơn giấu kênh đi vì không đọc được.
  const open = entries.filter(e => !e.off).filter(match);
  const closed = entries.filter(e => e.off).filter(match);
  const groups = [
    { key:"open", title:`Gateway trên máy này (${open.length})`, list: open },
    { key:"closed", title: closed.length ? `Đã đóng (${closed.length})` : null, list: closed },
  ].filter(g => g.title === null || g.list.length > 0);

  const sig = JSON.stringify([needle, entries.map(e=>[e.key,e.off,e.models,e.accounts&&e.accounts.total,e.accounts&&e.accounts.enabled,e.extra])]);
  if(body.dataset.sig === sig) return;   // Polling 10 giây không nên làm tường nhấp nháy
  body.dataset.sig = sig;

  const card = e => {
    const st = wallStateOf({ enabled: !e.off }, e.accounts, e.models, wallLoginHint(e.login));
    const meta = st.prefix || st.text
      ? `<span class="wcard-meta">
           ${st.tone === "ok" ? '<span class="wcard-dot" aria-hidden="true"></span>'
             : `<span class="wcard-state" data-tone="${st.tone}">${esc(st.prefix)}</span>`}
           ${st.text ? `<span class="wcard-meta-text">${esc(st.text)}</span>` : ""}
         </span>`
      : "";
    // Biểu tượng: biểu tượng kênh tích hợp sẵn của gateway này → Khối vuông chữ cái đầu（nhà cung cấp tuỳ chỉnh không có biểu tượng, đó là tình trạng thực tế）。
    const icon = e.iconURI || CHAN_ICONS[e.icon];
    const bare = e.icon === "zen";
    const mark = icon
      ? `<span class="wcard-ic"${bare?' data-bare="true"':""}><img src="${icon}" alt="" loading="lazy"></span>`
      : `<span class="wcard-mark">${esc(e.mark)}</span>`;
    const hint = e.off ? "（Đã tắt, nhấn mở để bật）" : "（Nhấn mở để quản lý）";
    return `<button class="wcard" type="button" data-target="${esc(e.target)}"
        data-off="${e.off ? "true" : "false"}"
        title="${esc(e.name)}${esc(e.blurb ? " · " + e.blurb : "")}${hint}">
        <span class="wcard-head">${mark}
          <span class="wcard-name">${esc(e.name)}</span>
        </span>${meta}</button>`;
  };

  // 「＋ Thêm nhà cung cấp」ở phía bên phải của hàng lọc, không nằm trong lưới thẻ —— đó là hành động của trang, không phải kênh thứ N.
  body.innerHTML = `
    ${groups.map(g => `
      <div class="cwall-group">
        ${g.title !== null ? `<div class="cwall-group-title">${esc(g.title)}${
          g.note ? `<span class="cwall-group-note">${esc(g.note)}</span>` : ""}</div>` : ""}
        <div class="cwall-grid">${g.list.map(card).join("")}</div>
      </div>`).join("")}
    ${entries.length && !groups.length ? `<div class="cwall-empty">Không có kênh nào có tên chứa「${esc(needle)}」</div>` : ""}
    ${!entries.length ? `<div class="cwall-empty">Chưa có kênh nào.</div>` : ""}
    ${wallChannelsErr ? `<div class="cwall-empty">${esc(wallChannelsErr)}</div>` : ""}`;

  body.querySelectorAll(".wcard").forEach(b=>{
    b.onclick = ()=> chanModalOpen(b.dataset.target);
  });
}

/* ---- Cửa sổ bật lên của kênh ----------------------------------------------------------
   Mỗi kênh một thẻ, nhấn vào thẻ để mở cửa sổ bật lên này. Cửa sổ bật lên không triển khai bất kỳ logic tài khoản nào: tất cả .chan-pane
   đều thường trú trong DOM（chỉ bị ẩn đi）, cửa sổ bật lên chỉ hiển thị khối tương ứng đó. Như vậy id đầu vào render và polling của từng
   kênh đều không cần thay đổi. */
let openChannelId = null;

// Sáu kênh preset dùng chung một bảng điều khiển（cách đăng nhập của chúng giống nhau: dán token）, các kênh còn lại mỗi kênh một bảng riêng.
const EXT_PANES = new Set(["cline","loomy","raccoon","lobsterai","astudio","modelscope"]);

function chanPaneFor(target){
  const t = String(target || "");
  if(EXT_PANES.has(t)) return "ext";
  return t.startsWith("pv:") ? "pv" : t;
}

function chanModalOpen(target){
  const el = $("#page-providers"); if(!el) return;
  const modal = el.querySelector("#chan-modal"); if(!modal) return;
  const key = chanPaneFor(target);
  const pane = modal.querySelector(`.chan-pane[data-chan="${key}"]`);
  if(!pane){ return; }
  openChannelId = target;

  // Dòng đầu: tên kênh + một câu mô tả + biểu tượng, cùng một bộ nhận diện như trên thẻ.
  const entry = wallEntries(STATE || {}).find(e => e.target === target || e.key === target) || {};
  const icon = entry.iconURI || CHAN_ICONS[entry.icon || key];
  el.querySelector("#chan-modal-name").textContent = entry.name || key;
  el.querySelector("#chan-modal-desc").textContent =
    key === "pv" ? "Upstream tương thích OpenAI / Anthropic, Key là của riêng bạn" : (entry.blurb || "");
  const ic = el.querySelector("#chan-modal-ic");
  ic.innerHTML = icon ? `<img src="${icon}" alt="">` : "";
  ic.dataset.bare = icon && key === "zen" ? "true" : "false";
  if(!icon){ ic.innerHTML = `<span class="wcard-mark">${esc(entry.mark || "+")}</span>`; }

  modal.querySelectorAll(".chan-pane").forEach(p=> p.hidden = p !== pane);
  // Mỗi lần mở đều làm mới trạng thái của khối này một lượt: số liệu trên thẻ có thể đã cũ so với lần mở cửa sổ trước.
  if(key === "qoder") renderQoderCard();
  else if(key === "codearts") renderCodeartsCard();
  else if(key === "zcode") renderZCodeCard();
  else if(key === "trae") renderTraeCard();
  else if(key === "ext") renderExtCard(entry.id || target);
  else if(key === "pv") renderProviderList(STATE || {});
  else paintLanePane(key);

  modal.classList.add("open");
  const first = modal.querySelector(".modal-card");
  if(first) first.scrollTop = 0;

  // Cái được nhấn là một nhà cung cấp tuỳ chỉnh cụ thể nào đó: cuộn đến thẻ của nó và vẽ một vòng quanh nó, chứ không chồng thêm một lớp cửa sổ bật lên chỉnh sửa
  // —— hai cửa sổ bật lên chồng lên nhau, đóng cái ở trên sẽ để lộ cái ở dưới, một cửa sổ bật lên「trông như chưa được đóng」.
  // Chỉnh sửa vẫn là nút「Chỉnh sửa」của chính thẻ đó, logic chỉ giữ một bản.
  if(String(target).startsWith("pv:")){
    const id = String(target).slice(3);
    const card = Array.from(el.querySelectorAll("#pv-list .pvcard")).find(c=>c.dataset.pvId === id);
    if(card){
      card.scrollIntoView({ block:"nearest" });
      card.classList.remove("flash-target");
      void card.offsetWidth;          // Đọc layout một lần thì animation mới phát lại
      card.classList.add("flash-target");
      setTimeout(()=> card.classList.remove("flash-target"), 1900);
    }
  }
}

function chanModalClose(){
  openChannelId = null;
  const el = $("#page-providers"); if(!el) return;
  const modal = el.querySelector("#chan-modal");

/* ---- Kênh tài khoản ZCode / TRAE --------------------------------------------
   Cả hai kênh này đều là luồng uỷ quyền do chính gateway này khởi tạo（ZCode là polling bằng mã thiết bị, TRAE là callback cục bộ）,
   nên nhóm tài khoản chỉ có một bản này, không có chương trình thứ hai cần đồng bộ. Hai bảng điều khiển có hình thức giống nhau: đăng nhập, bảng
   tài khoản, bật/tắt, điểm khác biệt chỉ ở tiền tố giao diện và hình dạng trạng thái. */

/* Dòng tài khoản của một kênh: tên + huy hiệu trạng thái + ghi chú tuỳ chọn, ba thẻ dùng chung. */
function accRow(name, enabled, id, notes){
  return `<div class="acc${enabled ? "" : " off"}">
    <div class="acc-hd">
      <span class="acc-name" title="${esc(name)}">${esc(name)}</span>
      <span class="pill ${enabled ? "ok" : "unknown"} acc-badge">${enabled ? "Đang dùng" : "Đã tắt"}</span>
    </div>
    ${id ? `<div class="acc-id">${esc(id)}</div>` : ""}
    ${notes && notes.length ? `<div class="acc-meta">${notes.join(" · ")}</div>` : ""}
  </div>`;
}

/* Hai trạng thái của nút bật/tắt kênh: chữ hiển thị và class .off thay đổi theo, dataset.on là nguồn đọc khi nhấn
   （bộ setToggle đó dùng cho trang Cài đặt, chữ hiển thị là「Đã bật/Đã tắt」；nút ở đầu kênh là hành động,
   nên chữ viết là「Tắt/Bật」—— trên nút viết điều sẽ xảy ra khi nhấn vào nó）. */
function setChannelToggle(sel, on){
  const b = $(sel);
  if(!b) return;
  b.classList.toggle("off", !on);
  b.textContent = on ? "Đóng" : "Bật";
  b.dataset.on = on ? "1" : "";
}

/* Bật/tắt một kênh: đi qua backend /channel/<id>/enabled。 */
async function toggleChannel(id, on){
  const j = await api("/channel/" + id + "/enabled", { enabled: on });
  if(j) toast(on ? "Kênh đã bật" : "Kênh đã tắt, mô hình bị gỡ khỏi bộ chọn");
  await refresh();
  if(openChannelId) chanModalOpen(openChannelId);
  loadWallChannels();
}
