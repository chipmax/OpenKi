/* ---- Kênh preset（dán thông tin xác thực） ---------------------------------------------
   Sáu kênh dùng chung bảng điều khiển này: cách đăng nhập của chúng giống nhau（đăng
   nhập trong IDE / console của chính hãng, dán token lấy được vào）, điểm khác biệt chỉ ở địa chỉ, header riêng và một chỗ điền body, tất cả đều ở backend.
   Vì vậy bảng điều khiển chỉ cần biết「hiện tại là kênh nào」, phần còn lại lấy từ cùng một snapshot của /ext/status. */

let extKinds = [];       // Bảng kênh do /ext/status trả về, theo thứ tự được gửi xuống
let extCurrent = "";     // kind mà bảng điều khiển đang hiển thị hiện tại

async function renderExtCard(kind){
  const el = $("#page-providers"); if(!el) return;
  if(kind) extCurrent = kind;
  const j = await fetch("/admin/api/ext/status").then(r=>r.json()).catch(()=>null);
  if(!j || !Array.isArray(j.channels)) return;
  extKinds = j.channels;
  const row = extKinds.find(c=>c.kind === extCurrent) || extKinds[0];
  if(!row) return;
  extCurrent = row.kind;

  const nameEl = el.querySelector("#ext-name");
  const metaEl = el.querySelector("#ext-meta");
  const bodyEl = el.querySelector("#ext-body");
  const listEl = el.querySelector("#ext-accounts");
  const accts = row.accounts || [];
  if(nameEl) nameEl.textContent = row.label || row.kind;
  if(metaEl) metaEl.textContent = (accts.length
    ? accts.filter(a=>a.enabled).length + "/" + accts.length + "  tài khoản đang dùng"
    : "Chưa có tài khoản nào") + " · " + (row.enabled === false ? "Kênh đã tắt" : "Kênh đã bật");
  setChannelToggle("#tg-ext", row.enabled !== false);

  if(bodyEl){
    // Bảng điều khiển chỉ nói cách làm, không đưa phán đoán ngoài phạm vi rủi ro: câu này là sự thật cố định về tính chất của kênh.
    bodyEl.innerHTML = 'Đăng nhập trong IDE hoặc console của chính  <b>' + esc(row.label || row.kind) + '</b> ,'
      + 'dán token lấy được vào「Thông tin xác thực」ở bên dưới. Trước khi thêm, gateway sẽ dùng nó để kéo danh mục mô hình một lần——'
      + 'nếu kéo không được thì không lưu vào kho, tránh lưu lại một token không dùng được.'
      + 'Mỗi kênh có thể có nhiều thông tin xác thực, dùng cùng một nút để thêm, thêm lặp lại sẽ ghi đè mục có cùng vân tay.';
  }
  if(!listEl) return;
  listEl.innerHTML = accts.length ? accts.map(a=>{
    const notes = [];
    if(!a.hasSecret) notes.push("Không có thông tin xác thực");
    if(a.extraKeys && a.extraKeys.length) notes.push("Trường bổ sung:" + a.extraKeys.join("、"));
    return `<div class="acc${a.enabled ? "" : " off"}" data-acc="${esc(a.id)}">
      <div class="acc-hd">
        <span class="acc-name" title="${esc(a.label || a.id)}">${esc(a.label || a.id)}</span>
        <span class="pill ${a.enabled ? "ok" : "unknown"} acc-badge">${a.enabled ? "Đang dùng" : "Đã tắt"}</span>
        <button class="ghost ext-act" data-act="toggle" data-id="${esc(a.id)}"
          data-enabled="${a.enabled ? "1" : "0"}" style="margin-left:auto">${a.enabled ? "Tắt" : "Bật"}</button>
        <button class="ghost ext-act" data-act="remove" data-id="${esc(a.id)}">Xoá</button>
      </div>
      ${a.id ? `<div class="acc-id">${esc(a.id)}</div>` : ""}
      ${notes.length ? `<div class="acc-meta">${notes.join(" · ")}</div>` : ""}
    </div>`;
  }).join("") : '<div class="acc-empty">Kênh này chưa có thông tin xác thực nào, dán một cái vào là dùng được.</div>';
}

/* Trường bổ sung: mỗi dòng key=value, dòng trống và dòng không có ký tự =  sẽ bị loại bỏ. */
function parseExtraFields(text){
  const out = {};
  for(const line of String(text||"").split(/\r?\n/)){
    const i = line.indexOf("=");
    if(i <= 0) continue;
    const k = line.slice(0, i).trim(), v = line.slice(i+1).trim();
    if(k && v) out[k] = v;
  }
  return out;
}

function bindExtCard(){
  const el = $("#page-providers"); if(!el) return;
  const add = el.querySelector("#ext-add");
  if(add && !add.dataset.bound){
    add.dataset.bound = "1";
    add.onclick = async ()=>{
      const secret = (el.querySelector("#ext-secret").value || "").trim();
      if(!secret){ toast("Hãy dán thông tin xác thực trước"); return; }
      const body = {
        kind: extCurrent,
        label: (el.querySelector("#ext-label").value || "").trim(),
        secret,
        extra: parseExtraFields(el.querySelector("#ext-extra").value),
      };
      const hint = el.querySelector("#ext-hint");
      if(hint) hint.textContent = "Đang dùng thông tin xác thực này để kéo danh mục mô hình…";
      add.disabled = true;
      const j = await api("/ext/add", body);
      add.disabled = false;
      if(hint) hint.textContent = "Trước khi thêm sẽ dùng nó để kéo danh mục mô hình một lần——kéo không được thì không lưu vào kho";
      if(j && j.ok){
        el.querySelector("#ext-secret").value = "";
        el.querySelector("#ext-label").value = "";
        el.querySelector("#ext-extra").value = "";
        toast("Đã thêm:" + (j.label || j.id));
        renderExtCard(); refresh(); loadWallChannels();
      }
    };
  }
  // Uỷ thác hành động trong dòng: bảng tài khoản mỗi lần vẽ lại, các nút không thể tự gắn riêng.
  const list = el.querySelector("#ext-accounts");
  if(list && !list.dataset.bound){
    list.dataset.bound = "1";
    list.onclick = async (ev)=>{
      const btn = ev.target.closest(".ext-act");
      if(!btn || btn.disabled) return;
      const id = btn.dataset.id, act = btn.dataset.act;
      btn.disabled = true;
      if(act === "toggle"){
        await api("/ext/account/toggle", { kind: extCurrent, id, enabled: btn.dataset.enabled !== "1" });
      } else if(act === "remove"){
        if(!confirm("Xoá thông tin xác thực này? Sau đó các mô hình do nó cung cấp sẽ bị gỡ khỏi bộ chọn.")){ btn.disabled = false; return; }
        await api("/ext/remove", { kind: extCurrent, id });
      }
      btn.disabled = false;
      renderExtCard(); refresh(); loadWallChannels();
    };
  }
  const tg = el.querySelector("#tg-ext");
  if(tg && !tg.dataset.bound){
    tg.dataset.bound = "1";
    tg.onclick = ()=> toggleChannel(extCurrent, tg.dataset.on !== "1");
  }
}

/* zen / kilo không có nhóm tài khoản, trong cửa sổ bật lên chỉ đặt một đoạn mô tả và một công tắc bật/tắt; dòng trạng thái ghi「số mô hình」. */
function paintLanePane(key){
  const el = $("#page-providers"); if(!el) return;
  const c = (STATE && STATE.channels || []).find(x=>x.id === key) || {};
  const on = c.enabled !== false;
  const st = el.querySelector("#" + key + "-state");
  if(st) st.textContent = (on ? "Đã bật" : "Đã tắt") + " · " + (c.models || 0) + "  mô hình";
  const tg = el.querySelector("#" + key + "-toggle");
  if(!tg) return;
  tg.classList.toggle("on", on);
  tg.setAttribute("aria-checked", on ? "true" : "false");
  tg.title = on ? "Nhấn một cái để tắt kênh này" : "Nhấn một cái để bật kênh này";
  if(!tg.dataset.bound){
    tg.dataset.bound = "1";
    tg.onclick = async ()=>{
      const cur = ((STATE && STATE.channels) || []).find(x=>x.id === key) || {};
      const next = cur.enabled === false;   // Hiện đang tắt → Bật
      tg.disabled = true;
      const j = await api("/channel/" + key + "/enabled", { enabled: next });
      tg.disabled = false;
      if(j){
        toast(next ? "Kênh đã bật" : "Kênh đã tắt, mô hình bị gỡ khỏi bộ chọn");
        await refresh();
        if(openChannelId) chanModalOpen(openChannelId);
      }
    };
  }
}

/* Khu vực preset: Thường dùng = Sáu hãng miễn phí dùng thường xuyên, các hãng còn lại thuộc về「Tất cả」; tìm kiếm trên tất cả các preset.
   chips chỉ được xây dựng lại khi（tab, từ khoá tìm kiếm, danh sách）thay đổi——polling 10 giây không nhấp nháy, không làm mất hover. */

function dayKey(d){ const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }

function fmtUptime(sec){
  sec = Math.max(0, Math.floor(sec));
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60), s=sec%60;
  if(d>0) return d+" Ngày "+h+" Giờ "+m+" phút";
  if(h>0) return h+" Giờ "+m+" phút "+s+" giây";
  if(m>0) return m+" phút "+s+" giây";
  return s+" giây";
}

let bootAt = null;   // epoch ms of process start, synced from /state uptimeSec
function tickUptime(){
  if(bootAt==null) return;
  const el = $("#uptime-val");
  if(el) el.textContent = fmtUptime((Date.now()-bootAt)/1000);
}
setInterval(tickUptime, 1000);

function buildUsage(s){
  const keys = Object.keys(s.stats.days||{}).sort();
  const byDay = {};
  for(const k of keys){
    const v = s.stats.days[k];
    byDay[k] = { requests:v.requests, failed:v.failed, input:v.input, output:v.output,
      cacheRead:v.cacheRead||0, cacheWrite:v.cacheWrite||0,
      total:(v.input||0)+(v.output||0), models:v.models||{}, modelReqs:v.modelReqs||{}, agents:v.agents||{} };
  }
  const life = {};
  for(const k of keys) for(const [m,o] of Object.entries(byDay[k].models)) life[m]=(life[m]||0)+o;
  const top = Object.entries(life).sort((a,b)=>b[1]-a[1]).slice(0,7);
  return { keys, byDay, top, life };
}

/* Tỷ lệ trúng cache: thuật toán duy nhất.
   read = Token đầu vào trúng cache, input = Toàn bộ token đầu vào (bao gồm phần trúng).
   Khi không có đầu vào thì trả về null —— hiển thị「—」chứ không phải 0%, vì「không có yêu cầu nào」và「không trúng lần nào」
   là hai việc khác nhau, hiển thị trường hợp sau thành 0% sẽ khiến người ta tưởng cache bị hỏng. */
function cachePct(read, input){
  const r = read||0, i = input||0;
  if(i <= 0) return null;
  return Math.min(100, Math.round(r / i * 1000) / 10);
}
function cacheCell(read, input){
  const pct = cachePct(read, input);
  if(pct === null) return '<span class="muted">—</span>';
  return '<span class="mono">'+fmtN(read||0)+'</span> <span class="muted" style="font-size:11.5px">· '+pct+'%</span>';
}

  const ttfts = recent.filter(r=>r.ttftMs>0).map(r=>r.ttftMs);

      <div class="cell"><div class="v" title="Token đầu vào trúng cache tiền tố upstream / toàn bộ token đầu vào; 0% là kết luận chứ không phải lỗi——các kênh này đến nay chưa từng báo cáo bất kỳ mức sử dụng cache nào">${hitPct!==null?hitPct+"%":"—"}</div><div class="l">Trúng cache${grand.cr>0?` <span style="opacity:.7">${fmtN(grand.cr)}</span>`:""}</div></div>
      <div class="cell"><div class="v">${grand.req}</div><div class="l">Số yêu cầu</div></div>
      <div class="cell"><div class="v${grand.fail>0?" bad":""}">${grand.fail}</div><div class="l">Thất bại</div></div>
      <div class="cell"><div class="v">${avgTtft!==null?(avgTtft/1000).toFixed(1)+"s":"—"}</div><div class="l">Token đầu tiên trung bình</div></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:10px">
        <h3 style="margin:0">Hoạt động Token</h3>
        <div class="seg" id="hm-modes">
          ${["daily","weekly","cumulative"].map(m=>`<button data-m="${m}" class="${heatMode===m?"on":""}">${{daily:"Theo ngày",weekly:"Theo tuần",cumulative:"Tích luỹ"}[m]}</button>`).join("")}
        </div>
      </div>
      <div class="hm-scroll">

      <h3>Tốc độ và độ trễ</h3>
      <div class="speedgrid" id="speed"></div>
    </div>

      <div class="card"><h3>Tổng hợp theo mô hình (tích luỹ)</h3><div id="by-model"></div></div>
      <div class="card"><h3>Tổng hợp theo Agent (đầu ra tích luỹ)</h3><div id="by-agent"></div></div>
    </div>

    <div class="card"><h3>Yêu cầu gần đây</h3><div id="recent-list"></div></div>`;

  renderHeat(U, U.keys);

function renderHeat(U, keys){
  const grid = $("#hm"); if(!grid) return; grid.innerHTML = "";
  let tip = document.getElementById("hm-tip");
  if(!tip){ tip = document.createElement("div"); tip.id = "hm-tip"; document.body.appendChild(tip); }
  tip.style.display = "none";
  const end = new Date(); end.setHours(0,0,0,0);
  const start = new Date(end); start.setDate(start.getDate() - start.getDay() - 51*7);
  const p = n=>String(n).padStart(2,"0");
  const keyOf = d => `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  const valOf = k => U.byDay[k] ? U.byDay[k].total : 0;

  // cells: [key, value, col]; tips: key -> {date, line} for the hover popup
  const cells = [], tips = {};
  let peak = 0;
  if(heatMode === "weekly"){
    for(let w=0; w<52; w++){
      let sum=0, reqs=0, firstKey=null, lastKey=null, lastDate=null;
      for(let j=0;j<7;j++){
        const d = new Date(start); d.setDate(start.getDate()+w*7+j);
        const key = keyOf(d), dv = U.byDay[key];
        sum += valOf(key); reqs += dv ? (dv.requests||0) : 0;
        if(j===0) firstKey = key;
        lastKey = key; lastDate = d;
      }
      cells.push([lastKey, sum, w]);
      tips[lastKey] = { date: firstKey.slice(5)+" ~ "+lastKey.slice(5), line: fmtK(sum)+" tok · "+reqs+"  yêu cầu" };
      if(sum>peak) peak = sum;
    }
  } else {
    let acc = 0;
    const total = Math.round((end - start)/86400000) + 1;
    for(let i=0;i<total;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const key = keyOf(d), dv = U.byDay[key];
      const v = dv ? dv.total : 0;
      acc += v;
      const col = Math.floor(i/7);
      if(heatMode === "cumulative"){
        cells.push([key, acc, col]);
        tips[key] = { date: key+" · Tích luỹ", line: fmtK(acc)+" tok" };
        if(acc>peak) peak = acc;
      } else {
        cells.push([key, v, col]);
        tips[key] = { date: key, line: dv ? fmtK(v)+" tok · "+(dv.requests||0)+"  yêu cầu"+(dv.failed?" · Thất bại "+dv.failed:"") : "Không có mức sử dụng trong ngày" };
        if(v>peak) peak = v;
      }
    }
  }
  const level = v => v<=0 ? 0 : Math.min(4, Math.max(1, Math.ceil(v/peak*4)));
  grid.classList.toggle("wk", heatMode==="weekly");
  for(const [key,v,col] of cells){
    const div = document.createElement("div");
    div.className = "hm-cell" + (v>0 ? " has hm-level"+level(v) : "");
    div.dataset.col = col;
    div.dataset.key = key;
    div.onclick = ()=>{ usageDay = usageDay===key ? null : key; renderUsage(STATE); };
    grid.appendChild(div);
  }
  const months = $("#hm-months"); if(months) months.innerHTML = "";
  // Month labels span WEEK COLUMNS, not day cells: the months grid has the
  // same 52 columns as the heatmap, and a month touches ~4-5 of them. Counting
  // days here would create 300+ implicit columns and stretch the labels row
  // far past the grid.
  const groups = [];
  for(const [key,,col] of cells){
    const m = new Date(key+"T00:00:00").getMonth();
    const g = groups[groups.length-1];
    if(g && g.m === m){ g.end = col; } else { groups.push({m, start: col, end: col}); }
  }
  for(let i=0;i<groups.length;i++){
    const g = groups[i];
    const end = (i+1 < groups.length) ? groups[i+1].start : 52;
    const span = Math.max(1, Math.min(52 - g.start, end - g.start));
    const s = document.createElement("span");
    s.style.gridColumn = "span "+span;
    s.textContent = (g.m+1)+"Tháng";
    months.appendChild(s);
  }

  const showTip = (key, x, y) => {
    const t = tips[key];
    if(!t){ tip.style.display = "none"; return; }
    tip.innerHTML = '<div class="tt-date">'+t.date+'</div>'+esc(t.line);
    tip.style.display = "block";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let lx = x + 12, ly = y - th - 10;
    if(lx + tw > window.innerWidth - 8) lx = x - tw - 12;
    if(ly < 8) ly = y + 16;
    tip.style.left = lx+"px"; tip.style.top = ly+"px";
  };
  grid.onmousemove = e => {
    const c = e.target.closest ? e.target.closest(".hm-cell") : null;
    if(c) showTip(c.dataset.key, e.clientX, e.clientY); else tip.style.display = "none";
  };
  grid.onmouseleave = () => { tip.style.display = "none"; };
}

function renderSpeed(recent){
  const box = $("#speed");
  const streamed = recent.filter(r=>r.ok && (r.decodeMs||0) >= 250);
  const credible = streamed.filter(r=>r.output>0 && (r.output/(r.decodeMs/1000))<=250);
  const sumDecode = credible.reduce((a,r)=>a+r.decodeMs,0);
  const sumTok = credible.reduce((a,r)=>a+(r.decodeTok||0),0);
  const wTps = sumDecode>0 ? sumTok/(sumDecode/1000) : null;
  const ttfts = recent.filter(r=>r.ttftMs>0).map(r=>r.ttftMs);
  const avgTtft = ttfts.length ? Math.round(ttfts.reduce((a,b)=>a+b,0)/ttfts.length) : null;
  const outs = recent.map(r=>r.output||0);
  const avgOut = outs.length ? Math.round(outs.reduce((a,b)=>a+b,0)/outs.length) : null;
  const cell = (label, value, color) => {
    return '<div class="stat"><div class="v" style="color:'+color+'">'+value+'</div><div class="l">'+label+'</div></div>';
  };
  box.innerHTML =
    cell("Tốc độ đầu ra có trọng số", (wTps!==null&&credible.length>=2) ? wTps.toFixed(0)+" tok/s" : "—", SEASON[0]) +
    cell("Token đầu tiên trung bình", avgTtft!==null ? (avgTtft/1000).toFixed(1)+"s" : "—", SEASON[2]) +
    cell("Đầu ra trung bình / lần", avgOut!==null ? fmtK(avgOut)+" tok" : "—", SEASON[3]) +
    cell("Số mẫu", String(recent.length), "var(--ink-dim)");
}

   saved, so the 10-second state refresh cannot put the server's value back over

const settingsDirty = new Set();
function clearSettingsDirty(){ settingsDirty.clear(); }

const netDirty = new Set();
const NET_DIRTY_LABELS = {
  proxyMode: "chế độ proxy", proxyUrl: "URL proxy", proxyPool: "danh sách tĩnh",
  egressModes: "peer đầu ra", protonSocks5: "SOCKS5 Proton",

};

// paintNetDirty is global because the dropdown's change callback and the

function paintNetDirty(){

function relMs(ms){
  const n = Number(ms) || 0;
  if(!n) return "—";
  const d = Math.max(0, Date.now() - n);
  if(d < 60_000) return "vừa xong";
  if(d < 3_600_000) return Math.floor(d/60_000) + " phút trước";
  if(d < 86_400_000) return Math.floor(d/3_600_000) + " giờ trước";
  return Math.floor(d/86_400_000) + " ngày trước";
}

// EGRESS_FRESH_MS tolerates two missed two-minute watch samples before the
// dashboard calls the evidence stale. A sample is not a liveness probe: the
// UI must distinguish "this is the path now" from "this was the path recently".
const EGRESS_FRESH_MS = 10 * 60 * 1000;
const EGRESS_PEER_NAMES = {
  direct: "Trực tiếp", proxy: "Proxy tĩnh", singbox: "sing-box",
  relay: "Relay", warp: "WARP", proton: "Proton VPN", peer: "Peer",
};
function egressPeerName(peer){
  const p = String(peer || "").trim();
  if(!p) return "Chưa rõ peer";
  return EGRESS_PEER_NAMES[p] || p;
}
function maxRel(...stamps){
  return relMs(Math.max(0, ...stamps.map(Number)));
}

// netExitRows flattens the three sources the gateway actually knows: the last
// served exit plus the periodic IP sample, subscription nodes (probed), and
// the static pool (endpoint + transport park state). The current row never
// claims a public IP for a static endpoint; that needs traffic or a probe.
function netExitRows(s){
  const now = Date.now();
  const eg = s.egress || {};
  const lastAt = Number(eg.lastAt) || 0;
  const checkedAt = Number(eg.checkedAt) || 0;
  const lastIP = String(eg.lastIp || "").trim();
  const sampleIP = String(eg.ip || "").trim();
  const ip = lastIP || sampleIP;
  const lastFresh = lastAt > 0 && now - lastAt < EGRESS_FRESH_MS;
  const sampleFresh = checkedAt > 0 && now - checkedAt < EGRESS_FRESH_MS;
  const peer = eg.peer ? egressPeerName(eg.peer) : "Chưa rõ peer";
  let tone = "unknown", status = "Chưa rõ", when = 0;
  let note = "Chưa có mẫu IP; bấm「Dò tất cả đầu ra」để lấy bằng chứng đầu tiên";
  const usingSample = !lastIP && !!sampleIP;
  if(lastFresh){
    tone = "ok"; status = "Đang phục vụ"; when = lastAt;
    note = `Lưu lượng thành công gần nhất qua ${peer}`;
    if(usingSample){
      note += "; IP hiển thị lấy từ mẫu gần nhất, không phải IP do lượt đó trả về";
    } else if(sampleIP && lastIP && sampleIP !== lastIP){
      note += `; mẫu định kỳ thấy ${sampleIP} (${relMs(checkedAt)})`;
    }
  } else if(sampleFresh && ip){
    tone = "ok"; status = "Đã quan sát"; when = checkedAt;
    note = `IP lấy từ mẫu định kỳ ${relMs(checkedAt)}; chưa có yêu cầu thành công gần đây để xác nhận peer`;
  } else if(ip){
    tone = "warn"; status = "Dữ liệu cũ"; when = Math.max(lastAt, checkedAt);
    note = "Mẫu cuối đã cũ; bấm「Dò tất cả đầu ra」để cập nhật";
  }
  const rows = [{
    key: "current", tone, status,
    endpoint: ip || "Chưa rõ",
    name: lastFresh
      ? (usingSample ? "Lưu lượng gần nhất · IP mẫu" : "Lưu lượng gần nhất")
      : (sampleIP ? "Mẫu IP định kỳ" : "Chưa có mẫu"),
    source: "Hiện tại", proto: eg.peer ? peer : "—",
    country: eg.country || "—", latency: "—",
    last: relMs(when), note,
  }];
  const nodes = (s.subscriptions && s.subscriptions.singbox && s.subscriptions.singbox.nodes) || [];
  for(const n of nodes){
    const cooling = (Number(n.coolUntil) || 0) > now;
    const tone = cooling ? "warn" : (n.alive ? "ok" : "bad");
    rows.push({
      key: "sub:" + (n.id || n.name),
      tone,
      status: cooling ? "Đang làm mát" : (n.alive ? "Khả dụng" : "Lỗi"),
      endpoint: n.ip || "Chưa dò IP",
      name: n.name || n.id || "Node đăng ký",
      source: "Đăng ký", proto: n.proto || "—",
      country: n.country || "—",
      latency: n.latencyMs ? n.latencyMs + " ms" : "—",
      last: relMs(Math.max(Number(n.lastOkMs) || 0, Number(n.lastCheck) || 0)),
      note: cooling
        ? "Còn " + Math.max(1, Math.ceil(((Number(n.coolUntil) || now) - now) / 60000)) + " phút; hết làm mát tự quay lại"
        : n.alive
          ? (n.lastOkMs ? "Đã phục vụ lưu lượng thật" : "Dò thành công, chưa có lưu lượng thật")
          : "Dò thất bại; bấm「Dò node đăng ký」để thử lại",
    });
  }
  for(const p of (s.proxyPoolStatus || [])){
    const parked = (Number(p.deadUntil) || 0) > now;
    rows.push({
      key: "pool:" + (p.id || p.addr),
      tone: parked ? "warn" : "unknown",
      status: parked ? "Tạm dừng" : "Chưa dò",
      endpoint: p.addr || p.id || "—",
      name: "Proxy tĩnh",
      source: "Tĩnh", proto: p.scheme || "—",
      country: "—", latency: "—", last: "—",
      note: parked
        ? "Tạm dừng đến " + new Date(Number(p.deadUntil)).toLocaleTimeString("vi-VN", {hour:"2-digit", minute:"2-digit"})
        : "Chưa có lưu lượng; IP công khai chỉ biết sau lần dò đầu tiên",
    });
  }
  const rank = { "": -1, warn: 0, bad: 1, ok: 2, unknown: 3 };
  return rows.sort((a,b) => (a.key === "current" ? -1 : b.key === "current" ? 1 : rank[a.tone] - rank[b.tone]));
}

// networkHealth derives the summary from evidence, not from configuration:
// fresh served traffic is stronger than an IP sample, which is stronger than
// "we have a config". A green health label must never hide failing peers.
function networkHealth(s, configured){
  const eg = s.egress || {};
  const now = Date.now();
  const lastAt = Number(eg.lastAt) || 0;
  const checkedAt = Number(eg.checkedAt) || 0;
  const lastFresh = lastAt > 0 && now - lastAt < EGRESS_FRESH_MS;
  const sampleFresh = checkedAt > 0 && now - checkedAt < EGRESS_FRESH_MS;
  const hasIP = !!(String(eg.lastIp || "").trim() || String(eg.ip || "").trim());
  const ok = configured.filter(r => r.tone === "ok").length;
  const bad = configured.filter(r => r.tone === "bad").length;
  const warn = configured.filter(r => r.tone === "warn").length;
  const unknown = configured.filter(r => r.tone === "unknown").length;
  const issues = bad + warn;
  if(!hasIP && !configured.length){
    return {label:"Chưa cấu hình", tone:"unknown", detail:"Chưa có đường ra nào; mở「Proxy thượng nguồn」để thêm"};
  }
  if(!hasIP){
    return {label:"Chưa rõ", tone:"unknown", detail:`${configured.length} đầu ra đã cấu hình · chưa có mẫu IP`};
  }
  if(lastFresh && issues === 0){
    const reserve = configured.length
      ? `${ok}/${configured.length} đầu ra dự phòng đã xác minh${unknown ? ` · ${unknown} chưa dò` : ""}`
      : "chưa cấu hình đầu ra dự phòng";
    const label = configured.length && unknown > 0 ? "Đang chạy" : "Ổn định";
    return {label, tone:"ok", detail:`Lưu lượng ${relMs(lastAt)} · ${reserve}`};
  }
  if(lastFresh){
    return {label:"Có cảnh báo", tone:"warn", detail:`Lưu lượng ${relMs(lastAt)} · ${bad} lỗi, ${warn} cần chú ý, ${unknown} chưa dò trong ${configured.length} đầu ra`};
  }
  if(sampleFresh){
    return {label:"Đang quan sát", tone:"warn", detail:`IP mẫu ${relMs(checkedAt)} · chưa có lưu lượng thành công gần đây`};
  }
  return {label:"Dữ liệu cũ", tone:"warn", detail:`Mẫu cuối ${maxRel(lastAt, checkedAt)} · bấm「Dò tất cả đầu ra」`};
}

function paintNetworkExits(s){
  const el = $("#page-network"); if(!el) return;
  const rows = netExitRows(s);
  const configured = rows.filter(r => r.source !== "Hiện tại");
  const nodes = (s.subscriptions && s.subscriptions.singbox && s.subscriptions.singbox.nodes) || [];
  const pools = s.proxyPoolStatus || [];
  const eg = s.egress || {};
  const lastAt = Number(eg.lastAt) || 0;
  const checkedAt = Number(eg.checkedAt) || 0;
  const ip = String(eg.lastIp || eg.ip || "").trim();
  const fresh = (lastAt && Date.now() - lastAt < EGRESS_FRESH_MS) || (checkedAt && Date.now() - checkedAt < EGRESS_FRESH_MS);
  const health = networkHealth(s, configured);
  $("#net-total").textContent = String(configured.length);
  $("#net-egress-ip").textContent = ip || "Chưa rõ";
  $("#net-egress-ip").title = ip || "Chưa có mẫu IP công khai";
  const meta = [];
  meta.push(eg.country || "Chưa rõ quốc gia");
  meta.push(eg.peer ? egressPeerName(eg.peer) : "chưa xác định peer");
  if(fresh) meta.push(`mẫu ${relMs(Math.max(lastAt, checkedAt))}`);
  $("#net-egress-meta").textContent = meta.join(" · ");
  $("#net-health").textContent = health.label;
  $("#net-health").className = "v sm " + health.tone;
  $("#net-health-detail").textContent = health.detail;
  $("#net-exit-sub").textContent = `${nodes.length} đăng ký · ${pools.length} tĩnh · ${(s.settings.egressModes||[]).length} peer`;
  const needle = netf.q.trim().toLowerCase();
  const shown = rows.filter(r => {
    if(netf.state && r.tone !== netf.state) return false;
    if(!needle) return true;
    return [r.endpoint, r.name, r.source, r.proto, r.country, r.status, r.note].join(" ").toLowerCase().includes(needle);
  });
  const tbody = $("#net-exit-rows");
  if(tbody){
    tbody.innerHTML = shown.map(r => {
      const name = r.name && r.name !== r.endpoint ? `<div class="ep-sub">${esc(r.name)}</div>` : "";
      return `<tr title="${esc(r.note)}">
        <td><span class="pill ${r.tone}">${esc(r.status)}</span></td>
        <td><div class="ep">${esc(r.endpoint)}</div>${name}</td>
        <td>${esc(r.source)}</td>
        <td>${esc(r.proto)}</td>
        <td>${esc(r.country)}</td>
        <td class="mono">${esc(r.latency)}</td>
        <td class="last">${esc(r.last)}</td>
        <td class="note">${esc(r.note)}</td>
      </tr>`;
    }).join("");
  }
  const empty = $("#net-exit-empty");
  if(empty) empty.style.display = shown.length ? "none" : "";
}

// paintVPN renders the read-only tunnel status. It must not infer that the
// OpenKi egress equals the pVPN exit: an egress peer may be relay/WARP while
// the tunnel is up, so the card explicitly says "trạng thái tunnel".
function paintVPN(s){
  const el = $("#page-network"); if(!el) return;
  const v = s.vpn || {};
  const state = el.querySelector("#vpn-state");
  if(!state) return;
  let tone = "hidsync", label = "Không khả dụng";
  if(!v.available){
    tone = "unknown"; label = "Không có pvpnctl";
  } else if(v.error){
    tone = "warn"; label = "Không đọc được";
  } else if(v.connected){
    tone = "ok"; label = "Đã kết nối";
  } else {
    tone = "warn"; label = "Chưa kết nối";
  }
  state.className = "pill " + tone;
  state.textContent = label;
  el.querySelector("#vpn-server").textContent = v.server || "—";
  el.querySelector("#vpn-ip").textContent = v.ip || "—";
  el.querySelector("#vpn-ip").title = v.ip || "";
  el.querySelector("#vpn-country").textContent = v.country || "—";
  el.querySelector("#vpn-proto").textContent = v.protocol || "—";
  el.querySelector("#vpn-duration").textContent = v.duration || "—";
  el.querySelector("#vpn-checked").textContent = v.checkedAt ? relMs(v.checkedAt) : "—";
  const copy = el.querySelector("#vpn-copy");
  if(copy){ copy.disabled = !v.ip; copy.dataset.copy = v.ip || ""; }
  const note = el.querySelector("#vpn-note");
  if(!v.available){
    note.textContent = "Không tìm thấy pvpnctl. Đây là trạng thái chỉ đọc; cài helper hoặc đặt OPENKI_PVPNCTL nếu binary nằm ở đường dẫn khác.";
  } else if(v.error){
    note.textContent = "Không đọc được trạng thái: " + v.error;
  } else if(!v.connected){
    note.textContent = "Tunnel chưa kết nối. OpenKi không tự bật tunnel; dùng pvpnctl trong WSL nếu cần.";
  } else {
    note.textContent = "Tunnel đang chạy. Đây là trạng thái của pVPN, không nhất thiết là peer mà OpenKi đang dùng ở bảng trên.";
  }
}

// paintLegacyLayer makes the coexistence rule visible: when the equal-peer
// selector is active, proxyMode only supplies the base transport for relay and
// WARP (and is not used by sing-box/Proton/direct peers).
function paintLegacyLayer(s){
  const el = $("#page-network"); if(!el) return;
  const warn = el.querySelector("#net-legacy-warn");
  if(!warn) return;
  const modes = s.settings.egressModes || [];
  if(!modes.length){
    warn.style.display = "none";
    return;
  }
  const base = modes.some(m => m === "relay" || m === "warp");
  warn.style.display = "";
  warn.className = "netnotice";
  warn.innerHTML = base
    ? `Lớp peer đang bật. Chế độ proxy bên dưới chỉ cung cấp kết nối gốc cho <b>Relay/WARP</b>; sing-box và Proton dùng listener riêng, còn 「Trực tiếp」bỏ qua proxy gốc. Đổi chế độ không tắt các peer.`
    : `Lớp peer đang bật. Chế độ proxy và danh sách tĩnh bên dưới <b>không tham gia</b> định tuyến hiện tại; chúng chỉ có hiệu lực khi bỏ hết peer.`;
}

async function loadSourceUpdate(force){
  if(sourceUpdBusy) return;
  if(!force && sourceUpd && Date.now() - sourceUpdAt < 300000){ paintUpdate(STATE); return; }
  sourceUpdBusy = true;
  const btn = $("#upd-check");
  if(btn){ btn.disabled = true; btn.textContent = "Đang kiểm tra…"; }
  try {
    const j = await api("/update/source");
    sourceUpd = j || { error: "Không đọc được trạng thái cập nhật" };
    sourceUpdAt = Date.now();
  } catch(err) {
    sourceUpd = { error: err && err.message ? err.message : "Không đọc được trạng thái cập nhật" };
  } finally {
    sourceUpdBusy = false;
    if(btn){ btn.disabled = false; btn.textContent = "Kiểm tra lại"; }
  }
  paintUpdate(STATE);
}
function paintUpdate(s){
  const el = $("#page-update"); if(!el || !el.dataset.rendered) return;
  const u = sourceUpd;
  const ver = (u && u.version) || (s && s.version) || "dev";
  const buildBox = $("#upd-running-box");
  if(buildBox){
    const rows = [
      ["Phiên bản", ver],
      ["Commit", u && u.current ? u.current.slice(0,12) + (u.currentDirty ? " (có thay đổi cục bộ)" : "") : "không xác định"],
      ["Thời điểm build", u && u.currentTime ? new Date(u.currentTime).toLocaleString("vi-VN") : "không xác định"],
      ["Nền tảng", platformLabel((s.system || {}).platform) + ((s.system && s.system.arch) ? " · " + s.system.arch : "")],
    ];
    buildBox.innerHTML = rows.map(([k,v])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v mono" style="word-break:break-all">${esc(v)}</span></div>`).join("");
  }
  const box = $("#upd-source-box");
  if(box){
    if(!u){
      box.innerHTML = `<div class="muted">Đang kiểm tra GitHub…</div>`;
    } else {
      const repo = u.repo || "chipmax/OpenKi";
      const repoURL = "https://github.com/" + repo;
      let status, detail = "";
      if(u.error){
        status = `<span class="pill bad">Không kiểm tra được</span>`;
        detail = `<div class="muted" style="font-size:12px;margin-top:6px">${esc(u.error)}</div>`;
      } else if(u.upToDate){
        status = `<span class="pill ok">Đã cập nhật</span>`;
        detail = `<div class="muted" style="font-size:12px;margin-top:6px">Commit đang chạy trùng đầu nhánh <code class="k">${esc(u.branch || "master")}</code>.</div>`;
      } else if(u.behind > 0){
        status = `<span class="pill warn">Có ${u.behind} commit mới</span>`;
        detail = `<div class="muted" style="font-size:12px;margin-top:6px">${esc(u.latestSubject || "")}${u.latestShort ? " · " + esc(u.latestShort) : ""}${u.latestDate ? " · " + new Date(u.latestDate).toLocaleString("vi-VN") : ""}</div>`;
      } else if(u.behind === 0){
        status = `<span class="pill unknown">Cục bộ đi trước nhánh</span>`;
        detail = `<div class="muted" style="font-size:12px;margin-top:6px">Không có commit mới để kéo; bản dựng có thay đổi chưa đẩy lên GitHub.</div>`;
      } else {
        status = `<span class="pill unknown">Không so sánh được</span>`;
        detail = `<div class="muted" style="font-size:12px;margin-top:6px">Không xác định được commit cục bộ hoặc nhánh từ xa.</div>`;
      }
      box.innerHTML = `
        <div class="row" style="align-items:center;gap:10px;flex-wrap:wrap">
          ${status}
          <a href="${esc(repoURL)}" target="_blank" rel="noreferrer" class="muted" style="font-size:12px">${esc(repo)} ↗</a>
          <span style="flex:1"></span>
          <button class="ghost" id="upd-check">Kiểm tra lại</button>
        </div>
        ${detail}
        <div class="sysinfo" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:10px">
          <div class="kv"><span class="k">Nhánh theo dõi</span><span class="v mono">${esc(u.branch || "master")}</span></div>
          <div class="kv"><span class="k">Checkout nguồn</span><span class="v mono" style="word-break:break-all">${esc(u.sourceDir || "không tìm thấy")}</span></div>
          <div class="kv"><span class="k">Lần kiểm tra</span><span class="v">${u.checkedAt ? new Date(u.checkedAt).toLocaleString("vi-VN") : "—"}</span></div>
        </div>
        ${u.sourceFound ? "" : `<div class="muted" style="font-size:12px;margin-top:8px">Chưa thấy checkout có <code class="k">.git</code>. Clone một lần bằng lệnh bên dưới; đặt <code class="k">OPENKI_SOURCE</code> nếu muốn dùng thư mục khác.</div>`}`;
      const chk = box.querySelector("#upd-check");
      if(chk) chk.onclick = ()=>loadSourceUpdate(true);
    }
  }
  const dir = u && u.sourceFound && u.sourceDir ? u.sourceDir : "/home/admin/src/openki";
  const cmds = (u && u.sourceFound)
    ? `cd ${shQuote(dir)}\ngit pull --ff-only\nCGO_ENABLED=0 go build -trimpath -tags headless \\\n  -ldflags "-X github.com/chipmax/openki/internal/gateway.Version=${shQuote(ver)} -X github.com/chipmax/openki/internal/update.Current=${shQuote(ver)}" \\\n  -o /tmp/openki.new ./cmd/openki\nsudo install -m 0755 /tmp/openki.new /usr/local/bin/openki\nsudo systemctl restart openki`
    : `git clone https://github.com/${(u && u.repo) || "chipmax/openki"}.git ${shQuote(dir)}\ncd ${shQuote(dir)}\nCGO_ENABLED=0 go build -trimpath -tags headless \\\n  -ldflags "-X github.com/chipmax/openki/internal/gateway.Version=${shQuote(ver)} -X github.com/chipmax/openki/internal/update.Current=${shQuote(ver)}" \\\n  -o /tmp/openki.new ./cmd/openki\nsudo install -m 0755 /tmp/openki.new /usr/local/bin/openki\nsudo systemctl restart openki`;
  const pre = $("#upd-cmd");
  if(pre) pre.textContent = cmds;
  const copy = $("#upd-copy");
  if(copy) copy.onclick = async ()=>{
    try { await navigator.clipboard.writeText(cmds); $("#upd-copy-note").textContent = "Đã sao chép"; }
    catch(e) { $("#upd-copy-note").textContent = "Trình duyệt chặn clipboard, hãy chọn và sao chép thủ công"; }
  };
  const set = (s && s.settings) || {};
  const selfUpd = !!set.updateSelfUpdate;
  const winCard = $("#upd-windows");
  if(winCard) winCard.hidden = !selfUpd;
  const apply = $("#upd-apply");
  const applyNote = $("#upd-apply-note");
  const applyErr = $("#upd-apply-error");
  if(applyErr) applyErr.textContent = "";
  if(apply){
    if(!selfUpd){ apply.disabled = true; }
    else if(!set.updateAvailable){ apply.disabled = true; apply.textContent = "Đang ở bản mới nhất"; }
    else if(!set.updateAsset){ apply.disabled = true; apply.textContent = "Release chưa có asset cho nền tảng này"; }
    else { apply.disabled = false; apply.textContent = "Cập nhật một chạm"; }
  }
  if(applyNote){
    if(!selfUpd) applyNote.textContent = "";
    else if(!set.updateAvailable) applyNote.textContent = `Bản đang chạy ${esc((s && s.version) || "dev")} là mới nhất.`;
    else if(!set.updateAsset) applyNote.textContent = "Bản phát hành chưa có openki.exe; hãy dùng trang phát hành.";
    else applyNote.textContent = `Sẽ cập nhật từ ${esc((s && s.version) || "dev")} lên v${esc(set.updateVersion)}.`;
  }
  const winNote = $("#upd-windows-note");
  if(winNote){
    winNote.textContent = selfUpd
      ? "Bản Windows thay binary đang chạy sau khi kiểm tra SHA-256 và chữ ký manifest. Nếu thiếu một trong hai, cập nhật bị từ chối."
      : "";
  }
}

        clearSettingsDirty();
        refresh();
      }
    };
    el.querySelector("#tg-tray").onclick = async e => {
      const on = !e.target.dataset.on;
      const j = await api("/settings", {closeToTray: on});
      if(j) toast(on ? "Đóng cửa sổ sẽ thu nhỏ xuống khay hệ thống" : "Đóng cửa sổ sẽ thoát ứng dụng");
      refresh();
    };
    el.querySelector("#tg-notify").onclick = async e => {
      const on = !e.target.dataset.on;
      const j = await api("/settings", {notifications: on});
      if(j) toast(on ? "Thông báo hệ thống đã bật" : "Thông báo hệ thống đã tắt");
      refresh();
    };
    el.querySelector("#tg-autostart").onclick = async e => {
      const on = !e.target.dataset.on;
      const j = await api("/autostart", {enabled: on});
      if(j) toast(on ? "Đã thêm vào tự khởi động cùng hệ thống" : "Đã gỡ khỏi tự khởi động cùng hệ thống");
      refresh();
    };
    el.querySelector("#btn-export").onclick = ()=>{ window.location.href = "/admin/api/export"; };
    el.querySelector("#btn-export-keys").onclick = ()=>{ if(confirm("File này chứa toàn bộ key dạng rõ và liên kết đăng ký, chỉ truyền qua kênh an toàn.")) window.location.href = "/admin/api/export?secrets=1"; };
    el.querySelector("#btn-csv").onclick = ()=>{ window.location.href = "/admin/api/usage.csv"; };
    el.querySelector("#btn-import").onclick = ()=>{ el.querySelector("#import-file").click(); };
    el.querySelector("#import-file").onchange = async e => {
      const file = e.target.files[0]; if(!file) return;
      const text = await file.text();
      let body; try { body = JSON.parse(text); } catch(err){ toast("Không phải JSON hợp lệ"); return; }
      const j = await api("/import", body);
      if(j){ toast("Đã nhập cấu hình (cổng giữ nguyên; bản xuất đã ẩn key sẽ giữ lại key trên máy này)"); refresh(); }
      e.target.value = "";
    };
    // Điều hướng theo nhóm: nhấp để trượt tới nhóm, nhóm đang hiển thị được làm nổi bật theo (giới hạn tần suất cuộn).
    // Container cuộn là main.main (toàn bộ #app overflow:hidden), cuộn trực tiếp nó.
    const scroller = el.closest(".main") || document.querySelector(".main");
    el.querySelectorAll("#set-nav .mchip").forEach(ch=>{

        el.querySelectorAll("#set-nav .mchip").forEach(c=>c.classList.remove("on"));
        ch.classList.add("on");
        const card = el.querySelector("#"+ch.dataset.g);
        if(card && scroller){
          const top = card.getBoundingClientRect().top - scroller.getBoundingClientRect().top + scroller.scrollTop - 70;
          scroller.scrollTop = top;
        }
      };
    });
    let navTick = 0;
    const syncNav = ()=>{
      const now = Date.now();
      if(now - navTick < 200) return;
      navTick = now;
      const chips = [...el.querySelectorAll("#set-nav .mchip")];
      let best = null, bestTop = Infinity;
      for(const c of chips){
        const card = el.querySelector("#"+c.dataset.g);
        if(!card) continue;
        const top = Math.abs(card.getBoundingClientRect().top - 80);
        if(top < bestTop){ bestTop = top; best = c; }
      }
      if(best && !best.classList.contains("on")){
        chips.forEach(c=>c.classList.remove("on"));
        best.classList.add("on");
      }
    };
    scroller?.addEventListener("scroll", syncNav, { passive:true });
    el.dataset.rendered = "1";
  }
  fill(el.querySelector("#set-max"), s.settings.defaultMaxTokens);
  fill(el.querySelector("#set-probe"), s.settings.probeIntervalMinutes);
  /* Lựa chọn chưa lưu sống qua vòng vẽ lại 10 giây: giá trị của dropdown chỉ bị
     thay bằng giá trị máy chủ khi người dùng chưa chạm vào nó. */
  const pick = (sel, dirtyKey) => {
    const node = el.querySelector(sel);
    if(!node) return null;
    const remembered = settingsDirty.has(dirtyKey) ? node.dataset.value : null;
    return remembered || null;
  };
  makeDropdown(el.querySelector("#set-effort"),
    [["light","Light · Gọn nhẹ (2K)"],["balanced","Balanced · Cân bằng (8K)"],["deep","Deep · Suy nghĩ sâu (giới hạn tối đa của mô hình)"]],
    pick("#set-effort", "defaultEffort") || s.settings.defaultEffort || "balanced",
    ()=>settingsDirty.add("defaultEffort"));
  setToggle("#tg-tray", s.settings.closeToTray);
  setToggle("#tg-notify", s.settings.notifications);
  setToggle("#tg-autostart", s.settings.autostart);
  setToggle("#tg-failover", s.settings.failoverEnabled);
  el.querySelector("#fo-max-label").textContent = s.settings.failoverMax || 2;
  const foBtn = el.querySelector("#tg-failover");
  if(foBtn && !foBtn.dataset.bound){
    foBtn.dataset.bound = "1";
    foBtn.onclick = async ()=>{
      const on = foBtn.dataset.on !== "1";
      await api("/settings", { failoverEnabled: on });
      setToggle("#tg-failover", on);
      toast(on ? "Tự động chuyển khi bị giới hạn tốc độ đã bật" : "Tự động chuyển khi bị giới hạn tốc độ đã tắt");
      refresh();
    };
  }
  setToggle("#tg-smart", s.settings.smartRouting);
  setToggle("#tg-fallback", s.settings.laneFallbackToProviders);
  setToggle("#tg-autotag", s.settings.autoTagEnabled);
  setToggle("#tg-openref", s.settings.openRefEnabled);
  const sseg = el.querySelector("#strategy-seg");
  if (sseg){
    const cur = s.settings.routingStrategy || "catalog";
    sseg.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.s===cur));
    if(!sseg.dataset.bound){
      sseg.dataset.bound = "1";
      sseg.querySelectorAll("button").forEach(b=>b.onclick = async ()=>{
        const j = await api("/settings", { routingStrategy: b.dataset.s });
        if(j) toast(b.dataset.s==="latency" ? "Sắp xếp ứng viên: ưu tiên độ trễ token đầu tiên" : "Sắp xếp ứng viên: theo thứ tự danh mục");
        refresh();
      });
    }
  }
  const bindSettingToggle = (sel, key, msgOn, msgOff) => {
    const b = el.querySelector(sel);
    if(b && !b.dataset.bound){
      b.dataset.bound = "1";
      b.onclick = async ()=>{
        const on = b.dataset.on !== "1";
        const j = await api("/settings", { [key]: on });
        if(j){ setToggle(sel, on); toast(on ? msgOn : msgOff); }
        refresh();
      };
    }
  };
  bindSettingToggle("#tg-smart", "smartRouting", "Định tuyến thông minh đã bật: việc chuyển đổi sẽ tránh các mô hình không hỗ trợ modality của lần này", "Định tuyến thông minh đã tắt: khôi phục thứ tự danh mục, không lọc theo năng lực");
  bindSettingToggle("#tg-fallback", "laneFallbackToProviders", "Fallback về API tuỳ chỉnh khi cạn đã bật (tiêu tốn hạn mức Key của bạn)", "Fallback về API tuỳ chỉnh khi cạn đã tắt");
  bindSettingToggle("#tg-autotag", "autoTagEnabled", "Gắn nhãn năng lực AI đã bật", "Gắn nhãn năng lực AI đã tạm dừng");
  bindSettingToggle("#tg-openref", "openRefEnabled", "Tham chiếu dung lượng công khai đã bật: mô hình mới sẽ tự động nhận dung lượng thượng nguồn", "Tham chiếu dung lượng công khai đã tạm dừng");
  const retagBtn = el.querySelector("#btn-retag");
  if(retagBtn && !retagBtn.dataset.bound){
    retagBtn.dataset.bound = "1";
    retagBtn.onclick = async ()=>{
      const j = await api("/tags/retag", {});
      if(j && j.ok) toast("Đã xếp hàng " + (j.queued||0) + "  mô hình, đang gắn nhãn ở nền…");
    };
  }
}

function setToggle(sel, on){
  const b = document.querySelector(sel);
  b.textContent = on ? "Đã bật" : "Đóng";
  b.classList.toggle("off", !on);
  b.dataset.on = on ? "1" : "";
}

/* one-click update */
document.addEventListener("click", e=>{
  const open = e.target.closest("#upd-open");
  if(open){
    e.preventDefault();
    cur = "update"; localStorage.setItem("openki.page", cur); nav(); render();
    return;
  }
  const b = e.target.closest("#upd-apply");
  if(!b) return;
  const err = $("#upd-apply-error");
  if(err) err.textContent = "";
  b.disabled = true; b.textContent = "Đang tải…";
  fetch("/admin/api/update/apply",{method:"POST",headers:{"content-type":"application/json","x-openki-admin":"1"},body:"{}"})
    .then(async r=>({r, j:await r.json().catch(()=>({}))}))
    .then(({r,j})=>{
      if(r.ok && j && j.ok){
        b.textContent = "Đang khởi động lại…"; toast("Cập nhật xong, đang khởi động lại…");
        const t = setInterval(()=>{ fetch("/health").then(r=>{ if(r.ok){ clearInterval(t); location.reload(); } }).catch(()=>{}); }, 1000);
        setTimeout(()=>{ clearInterval(t); location.reload(); }, 60000);
      } else {
        b.disabled = false; b.textContent = "Cập nhật một chạm";
        if(err) err.textContent = (j && j.error) || `Cập nhật thất bại (HTTP ${r.status})`;
      }
    })
    .catch(()=>{ b.disabled = false; b.textContent = "Cập nhật một chạm"; if(err) err.textContent = "Không kết nối được gateway."; });
});

/* copy buttons */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-copy]");
  if(!t) return;
  navigator.clipboard.writeText(t.dataset.copy).then(()=>toast("Đã sao chép")).catch(()=>{
    const inp=document.createElement("textarea"); inp.value=t.dataset.copy; document.body.appendChild(inp);
    inp.select(); document.execCommand("copy"); inp.remove(); toast("Đã sao chép");
  });
});

let lastSig = "";
async function refresh(){
  if(stateRequest) return stateRequest;
  stateRequest = (async()=>{
    const j = await api("/state");
    if(!j){
      const dot = document.getElementById("svcdot");
      const stat = document.getElementById("svcstat");
      if(dot) dot.style.background = "var(--bad)";
      if(stat) stat.textContent = "Kết nối thất bại";
      return null;
    }
    if(typeof j.uptimeSec === "number") bootAt = Date.now() - j.uptimeSec*1000;
    const sig = JSON.stringify([j.models,j.agents,j.stats,j.settings,j.egress,j.mainKey,j.baseURL,j.port,j.providers,j.subscriptions,j.announcements,j.announcementArchive]);
    if (sig === lastSig){ tickUptime(); return j; }
    lastSig = sig; STATE = j; render();
    return j;
  })().finally(()=>{ stateRequest = null; });
  return stateRequest;
}

/* ---- custom dropdown ---- */
/* Ô chọn thả xuống: một nút + một menu listbox.
   Có ba thứ ở đây dễ âm thầm hỏng nhất, đều xử lý theo “lần gọi cuối cùng”:
   1. Tuỳ chọn thay đổi thì phải dựng lại menu (cùng một container thường được nạp một danh sách mô hình mới);
   2. onChange phải lưu thành closure mới nhất, nếu không sau lần render thứ hai, nhấp vào tuỳ chọn sẽ chạy callback trên dữ liệu cũ;
   3. Truy cập được bằng bàn phím: phím mũi tên để di chuyển, Enter để chọn, Esc để đóng, khi menu sát đáy cửa sổ thì mở lên trên. */
function makeDropdown(container, options, value, onChange){
  container.classList.add("sel");
  if(!container.querySelector(".sel-btn")){
    container.innerHTML = `<button type="button" class="sel-btn" aria-haspopup="listbox" aria-expanded="false">`
      + `<span class="sel-val"></span>`
      + `<svg class="arr" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      + `</button><div class="sel-menu" role="listbox"></div>`;
  }
  const val = container.querySelector(".sel-val");
  const btn = container.querySelector(".sel-btn");
  const menu = container.querySelector(".sel-menu");
  // Callback mới nhất được lưu trên container: menu chỉ dựng lại khi tuỳ chọn thay đổi, lúc nhấp luôn đọc ở đây.
  container.__change = onChange;
  const label = v => { const o = options.find(x=>x[0]===v); return o ? o[1] : v; };
  const sig = options.map(o=>o[0]+"\u0000"+o[1]).join("\u0001");
  if(menu.dataset.sig !== sig){
    // Mỗi ô chọn có một bộ option id ổn định để aria-activedescendant trỏ tới;
    // Khi container không có id cũng phải có được một id, không được sinh ra giá trị bất hợp lệ bắt đầu bằng "-" ở phần mở đầu.
    if(!container.id) container.id = "sel-" + (makeDropdown.seq++);
    const pid = container.id;
    menu.innerHTML = options.map(([v,t], i)=>
      `<div class="opt" role="option" tabindex="-1" id="${pid}-o${i}" data-v="${esc(String(v))}">`
      + `<span>${esc(t)}</span>`
      + `<svg class="okm" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6 9.5 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      + `</div>`).join("");
    menu.dataset.sig = sig;
    menu.querySelectorAll(".opt").forEach(o=>{
      o.onclick = () => pick(o.dataset.v);
      o.onmouseenter = () => move(opts(), o);
    });
  }
  function set(v){
    container.dataset.value = v;
    val.textContent = label(v);
    menu.querySelectorAll(".opt").forEach(o=>{
      const on = o.dataset.v === v;
      o.classList.toggle("on", on);
      o.setAttribute("aria-selected", on ? "true" : "false");
    });
  }
  function pick(v){
    set(v);
    close();
    if(container.__change) container.__change(v);
  }
  set(value);
  const opts = () => Array.from(menu.querySelectorAll(".opt"));

  function move(list, target){
    if(!list.length) return;
    let i = target === null ? list.findIndex(o=>o.classList.contains("on"))
                             : list.indexOf(target);
    if(i < 0) i = 0;
    list.forEach(o=>o.classList.remove("cursor"));
    list[i].classList.add("cursor");
    btn.setAttribute("aria-activedescendant", list[i].id);
    list[i].scrollIntoView({block:"nearest"});
  }

  function open(){
    document.querySelectorAll(".sel.open").forEach(x=>{ if(x!==container) x.classList.remove("open"); });
    // Không đặt xuống dưới được thì mở lên trên: ô chọn ở trang Cài đặt và thẻ nhà cung cấp thường sát đáy cửa sổ.
    const r = btn.getBoundingClientRect();
    const roomBelow = window.innerHeight - r.bottom;
    container.classList.toggle("up", roomBelow < Math.min(320, (r.height + 8) * 6) && roomBelow < r.top);
    container.classList.add("open");
    btn.setAttribute("aria-expanded","true");
    move(opts(), null);
    document.addEventListener("click", outside);
  }
  function close(){
    container.classList.remove("open");
    container.__pressIn = false;
    btn.setAttribute("aria-expanded","false");
    btn.removeAttribute("aria-activedescendant");
    document.removeEventListener("click", outside);
  }
  const outside = e => { if(!container.contains(e.target)) close(); };

  btn.onclick = e => {
    e.stopPropagation();
    if(container.classList.contains("open")) close(); else open();
  };
  btn.onkeydown = e => {
    const list = opts();
    const isOpen = container.classList.contains("open");
    if(!isOpen && (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "Enter" || e.key === " ")) {
      e.preventDefault(); open(); return;
    }
    if(!isOpen) return;
    const i = list.findIndex(o=>o.classList.contains("cursor"));
    if(e.key === "Escape"){ e.preventDefault(); close(); btn.focus(); }
    else if(e.key === "Tab"){ close(); }
    else if(e.key === "ArrowDown"){ e.preventDefault(); move(list, list[Math.min(i+1, list.length-1)]); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); move(list, list[Math.max(i-1, 0)]); }
    else if(e.key === "Home"){ e.preventDefault(); move(list, list[0]); }
    else if(e.key === "End"){ e.preventDefault(); move(list, list[list.length-1]); }
    else if(e.key === "Enter" || e.key === " "){ e.preventDefault(); if(list[i]) pick(list[i].dataset.v); }
  };
  // Khi nhấn chuột vào tuỳ chọn, nút sẽ mất focus trước: nếu đóng menu ngay lúc này, menu lập tức display:none,
  // mouseup/click sẽ rơi vào khoảng trống, nhấp chuột vào tuỳ chọn sẽ không bao giờ có tác dụng (trong khi đường bàn phím lại bình thường).
  // Vì vậy lần mất focus do “nhấn vào trong menu” đó không đóng; tuỳ chọn cũng mang tabindex=-1, nhấp vào nó focus vẫn nằm trong container.
  if(!menu.dataset.pressBound){
    menu.dataset.pressBound = "1";
    menu.addEventListener("mousedown", () => { container.__pressIn = true; });
  }
  btn.onblur = () => {
    if(container.__pressIn){ container.__pressIn = false; return; }
    if(!container.contains(document.activeElement)) close();
  };
}
makeDropdown.seq = 1;

/* ---- theme ---- */
function syncThemeToggle(){
  const btn = document.getElementById("theme-toggle");
  if (!btn) return;
  const dark = document.documentElement.dataset.theme !== "light";
  const label = dark ? "Giao diện sáng" : "Giao diện tối";
  btn.innerHTML = icon(dark ? "sun" : "moon") + `<span class="lbl">${label}</span>`;
  btn.title = dark ? "Chuyển sang giao diện sáng" : "Chuyển sang giao diện tối";
  btn.setAttribute("aria-label", btn.title);
}
function setTheme(t){
  document.documentElement.dataset.theme = t;
  localStorage.setItem("openki.theme", t);
  syncThemeToggle();
}

/* ---- window controls ---- */
const wbtn = id => document.getElementById(id);
wbtn("w-min").onclick = e => { e.stopPropagation(); window.openkiMinimize && openkiMinimize(); };
wbtn("w-max").onclick = e => { e.stopPropagation(); window.openkiToggleMax && openkiToggleMax(); };
wbtn("w-close").onclick = e => { e.stopPropagation(); window.openkiClose && openkiClose(); };
const tb = document.getElementById("titlebar");
let dragArmed = false, dragX = 0, dragY = 0;
tb.addEventListener("mousedown", e => {
  if (e.button !== 0 || e.target.closest("button")) return;
  dragArmed = true; dragX = e.screenX; dragY = e.screenY;
});
window.addEventListener("mousemove", e => {
  if (!dragArmed) return;
  if (!(e.buttons & 1)) { dragArmed = false; return; }
  if (Math.abs(e.screenX - dragX) + Math.abs(e.screenY - dragY) > 4) {
    dragArmed = false;
    window.openkiDrag && openkiDrag();
  }
});
window.addEventListener("mouseup", () => { dragArmed = false; });
tb.addEventListener("dblclick", e => {
  if (e.target.closest("button")) return;
  window.openkiToggleMax && openkiToggleMax();
});

nav(); render(); refresh(); setInterval(refresh, 10000);
</script>
