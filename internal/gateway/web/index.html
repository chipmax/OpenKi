<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OpenKi — Bảng điều khiển</title>
<link rel="icon" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme = localStorage.getItem("openki.theme") || "dark";</script>
<style>
  /* ===== Ngôn ngữ thiết kế ZCode: xám trung tính + xanh da trời, căn theo Tailwind v4 ===== */
  :root { --card-shadow:none; --r-lg:12px; --r-md:8px; --r-sm:6px; --ease:cubic-bezier(.2,.8,.2,1); }
  :root[data-theme="dark"] {
    /* Thang độ sáng: nền trang / thẻ / lồng nhau mỗi cấp lệch hẳn một bậc, ranh giới thẻ nhìn là phân biệt ngay (sửa"tình trạng xám chết đồng loạt"） */
    --bg:#0a0b0e; --bg-2:#08090b; --side:#07080a; --panel:#111318; --panel-2:#181b21;
    --hairline:rgba(225,235,255,.09); --hairline-soft:rgba(225,235,255,.055);
    --ink:#eef0f4; --ink-dim:#a8afb8; --ink-mute:rgba(238,240,244,.58); --ink-faint:rgba(238,240,244,.34);
    /* Màu nhấn duy nhất toàn cục: chàm. Xanh lá, vàng, đỏ chỉ dành cho ngữ nghĩa trạng thái */
    --accent:#6e7bff; --accent-strong:#8b96ff; --accent-ink:#ffffff; --accent-soft:rgba(110,123,255,.16);
    --ok:#3fdd8b; --ok-bg:rgba(63,221,139,.13);
    --warn:#f5b544; --warn-bg:rgba(245,181,68,.13);
    --bad:#f87a7a; --bad-bg:rgba(248,122,122,.12);
    --primary-bg:var(--accent); --primary-fg:#ffffff;
    --hm0:rgba(255,255,255,.04); --hm1:rgba(110,123,255,.25); --hm2:rgba(110,123,255,.45); --hm3:rgba(110,123,255,.66); --hm4:#8b96ff;
    --card-shadow:0 1px 2px rgba(0,0,0,.35);
    --gap-card:12px; --gap-sec:26px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Microsoft YaHei UI",monospace;
    --body:ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  }
  :root[data-theme="light"] {
    --bg:#f6f7f9; --bg-2:#eef0f3; --side:#f1f2f5; --panel:#ffffff; --panel-2:#f2f4f7;
    --hairline:rgba(15,23,42,.11); --hairline-soft:rgba(15,23,42,.07);
    --ink:#1c2127; --ink-dim:#454c55; --ink-mute:rgba(28,33,39,.68); --ink-faint:rgba(28,33,39,.4);
    --accent:#5b62f0; --accent-strong:#4249e0; --accent-ink:#ffffff; --accent-soft:rgba(91,98,240,.11);
    --ok:#189a5b; --ok-bg:rgba(24,154,91,.11);
    --warn:#b57d0e; --warn-bg:rgba(181,125,14,.11);
    --bad:#d63c3c; --bad-bg:rgba(214,60,60,.09);
    --primary-bg:var(--accent); --primary-fg:#ffffff;
    --hm0:rgba(15,23,42,.05); --hm1:rgba(91,98,240,.18); --hm2:rgba(91,98,240,.38); --hm3:rgba(74,81,232,.6); --hm4:#3d43d6;
    --card-shadow:0 1px 2px rgba(15,23,42,.06);
    --gap-card:12px; --gap-sec:26px;
  }
  * { box-sizing:border-box; margin:0; padding:0;
    transition: background-color .18s ease, color .18s ease, border-color .18s ease,
      fill .18s ease, stroke .18s ease, box-shadow .18s ease; }
  html,body { height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; user-select:none; }
  #app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  /* ---- custom title bar ---- */
  #titlebar { height:42px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 8px 0 18px; border-bottom:1px solid var(--hairline-soft); cursor:default;
    background:linear-gradient(180deg,var(--panel),var(--bg)); position:relative; }
  #titlebar::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.45; }
  #titlebar .wm { font-family:var(--mono); font-size:14px; letter-spacing:.18em; font-weight:600; white-space:nowrap; }
  #titlebar .wm .tick { color:var(--accent-strong); }
  /* Ô thương hiệu: một ô vuông nhỏ bo góc + 135° chuyển sắc + phát sáng ngoài, không cần file biểu tượng vẫn có cảm giác nhận diện.
     Màu sắc dùng theo màu nhấn duy nhất toàn cục (chàm), không mở thêm một bộ sắc độ riêng để xung đột với màu trạng thái. */
  #titlebar .wm .mark { display:inline-block; width:8px; height:8px; border-radius:3px; margin-right:9px;
    vertical-align:1px;
    background:linear-gradient(135deg, var(--accent-strong), var(--accent));
    box-shadow:0 0 8px var(--accent-soft), 0 0 2px var(--accent); }
  #titlebar .wbtns { display:flex; height:100%; }
  #titlebar .wbtns button { width:46px; height:100%; border:0; background:none; color:var(--ink-dim);
    font-size:13px; font-family:var(--mono); cursor:pointer; border-radius:0; }
  #titlebar .wbtns button:hover { background:var(--panel-2); color:var(--ink); }
  #titlebar .wbtns button.close:hover { background:var(--bad-bg); color:var(--bad); }

  .body { display:flex; flex:1; min-height:0; }

  /* ---- sidebar ---- */
  .side { width:208px; flex:none; background:linear-gradient(180deg,var(--side),var(--bg-2)); border-right:1px solid var(--hairline-soft);
    display:flex; flex-direction:column; padding:0 10px 10px;
    overflow-y:auto; overflow-x:hidden;
    transition:width .18s ease, background-color .2s ease; }
  .side.collapsed { width:58px; padding:0 6px 10px; }
  .side.collapsed .lbl, .side.collapsed .grp-txt, .side.collapsed .side-foot,
  .side.collapsed .collapse-btn span.lbl, .side.collapsed .status-card { display:none; }
  .side.collapsed .nav button { justify-content:center; padding:9px 0; }
  .side.collapsed .collapse-btn { justify-content:center; padding:9px 0; }
  .side.collapsed .brand-row { padding:8px 0 10px; justify-content:center; }
  .side.collapsed .brand-row > div { display:none; }

  .brand-row { display:flex; align-items:center; gap:10px; padding:17px 10px 18px; }
  .brand-row img { width:30px; height:30px; border-radius:9px; flex:none; box-shadow:0 0 0 4px var(--accent-soft); }
  .brand-row .bw { font-family:var(--mono); font-size:13.5px; letter-spacing:.16em; font-weight:600; white-space:nowrap; }
  .brand-row .bw .tick { color:var(--accent-strong); }
  .brand-row .ver { font-size:10px; color:var(--ink-mute); letter-spacing:.04em; margin-top:1px; }

  .nav { display:flex; flex-direction:column; gap:3px; }
  .nav .grp { font-size:10px; color:var(--ink-mute); letter-spacing:.1em; font-weight:650; padding:12px 12px 4px;
    white-space:nowrap; overflow:hidden; }
  .side.collapsed .grp { visibility:hidden; height:20px; padding:12px 0 4px; }
  .nav button { position:relative; display:flex; align-items:center; gap:11px; text-align:left;
    min-height:40px; padding:8px 12px; border-radius:9px; color:var(--ink-dim);
    background:none; border:1px solid transparent; font-size:13px; cursor:pointer;
    white-space:nowrap; overflow:hidden;
    transition:background-color .16s ease, color .16s ease, border-color .16s ease; }
  .nav button:hover { background:var(--panel-2); color:var(--ink); }
  .nav button.on { background:linear-gradient(90deg,var(--accent-soft),transparent); color:var(--accent-strong); border-color:color-mix(in srgb,var(--accent) 22%,transparent); font-weight:650; box-shadow:inset 0 0 18px var(--accent-soft); }
  .nav button::before { content:""; position:absolute; left:-1px; top:16%; bottom:16%; width:3px;
    border-radius:3px; background:var(--accent-strong); box-shadow:0 0 12px var(--accent);
    opacity:0; transform:scaleY(.25); transform-origin:center;
    transition:opacity .2s var(--ease), transform .22s var(--ease); }
  .nav button.on::before { opacity:1; transform:scaleY(1); }
  .nav .ic { width:16px; height:16px; flex:none; }
  .nav .cnt { margin-left:auto; font-size:11px; color:var(--ink-mute); font-variant-numeric:tabular-nums; }

  .status-card { background:linear-gradient(135deg,var(--panel-2),var(--panel)); border:1px solid var(--hairline-soft); border-radius:10px; padding:11px 12px; margin:8px 0 8px; box-shadow:var(--card-shadow); }
  .status-card .row1 { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; }
  .status-card .row1 .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); }
  .status-card .row2 { margin-top:2px; font-size:11px; color:var(--ink-mute); font-variant-numeric:tabular-nums; }

  .side-foot { padding:8px 10px; font-size:11px; color:var(--ink-mute); line-height:1.5; }
  .side-foot .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:6px; }

  .sysinfo { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px 18px; font-size:12.5px; }
  .sysinfo .kv { display:flex; justify-content:space-between; gap:8px; border-bottom:1px dashed var(--hairline-soft); padding:4px 0; }
  .sysinfo .kv .k { color:var(--ink-mute); }
  .sysinfo .kv .v { color:var(--ink); text-align:right; word-break:break-all; font-variant-numeric:tabular-nums; }
  .sysgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; }
  .syssec { background:var(--panel-2); border:1px solid var(--hairline); border-radius:10px; padding:11px 13px; min-width:0; }
  .syssec h4 { margin:0 0 6px; font-size:11px; font-weight:650; letter-spacing:.35px; text-transform:uppercase; color:var(--ink-mute); }
  .membar { height:6px; border-radius:3px; background:var(--hairline); overflow:hidden; margin:3px 0 5px; }
  .membar i { display:block; height:100%; background:var(--accent); border-radius:3px; }

  .cgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px; }
  .ccard { background:var(--panel-2); border:1px solid var(--hairline-soft); border-radius:var(--r-md); padding:12px 14px;
    display:flex; flex-direction:column; }
  .ccard .cn { font-weight:600; margin-bottom:4px; }
  .ccard .cd { font-size:12px; color:var(--ink-mute); margin-bottom:8px; }
  /* Mô tả dài ngắn khác nhau, nút sao chép căn theo cạnh đáy thẻ, đọc dọc một hàng thấy các thao tác nằm trên cùng một đường */
  .ccard .ghost { margin-top:auto; align-self:flex-start; }
  .collapse-btn { display:flex; align-items:center; gap:10px; text-align:left; padding:8px 12px;
    border-radius:var(--r-sm); color:var(--ink-mute); background:none; border:1px solid transparent;
    font-size:12.5px; cursor:pointer; white-space:nowrap; overflow:hidden; }
  .collapse-btn:hover { background:var(--panel-2); color:var(--ink); }
  .collapse-btn .ic { width:16px; height:16px; flex:none; }
  .side .side-foot { padding:8px 10px; font-size:11px; color:var(--ink-mute); line-height:1.5; }
  .side .side-foot .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:6px; }
  .ic { display:block; }

  /* ---- main ---- */
  .main { flex:1; min-width:0; overflow-y:auto; padding:28px clamp(18px,3vw,42px) 52px; background:var(--bg); }
  .main > .page { max-width:1240px; margin:0 auto; }
  .page { display:none; } .page.on { display:block; animation:pageIn .18s ease; }
  @keyframes pageIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  /* First paint: /state can take a moment (it probes every installed agent),
     and an empty dark rectangle reads as "broken" long before it reads as
     "loading". A skeleton of the page that is about to arrive keeps the
     layout honest — same KPI strip, same panel rhythm. */
  .skel { display:flex; flex-direction:column; gap:14px; }
  .skel i { display:block; border-radius:6px; height:12px;
    background:linear-gradient(90deg,
      color-mix(in srgb,var(--ink) 7%,var(--panel)) 0%,
      color-mix(in srgb,var(--ink) 15%,var(--panel)) 50%,
      color-mix(in srgb,var(--ink) 7%,var(--panel)) 100%);
    background-size:200% 100%; animation:shimmer 1.6s ease-in-out infinite; }
  @keyframes shimmer { 0% { background-position:100% 0; } 100% { background-position:-100% 0; } }
  .skel .sk-head { display:flex; align-items:center; gap:12px; }
  .skel .sk-kpis { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px; background:var(--hairline);
    border:1px solid var(--hairline); border-radius:12px; overflow:hidden; }
  .skel .sk-kpi { background:var(--panel); padding:16px 18px; display:flex; flex-direction:column; gap:9px; }
  .skel .sk-kpi i:first-child { height:22px; width:52%; }
  .skel .sk-kpi i:last-child { width:72%; }
  .skel .sk-panel { background:var(--panel); border:1px solid var(--hairline); border-radius:12px;
    padding:18px; display:flex; flex-direction:column; gap:12px; }
  .skel .sk-panel i:nth-child(1) { width:26%; height:14px; }
  .skel .sk-panel i:nth-child(2) { width:94%; }
  .skel .sk-panel i:nth-child(3) { width:88%; }
  .skel .sk-panel i:nth-child(4) { width:64%; }
  .skel .sk-cols { display:grid; grid-template-columns:1.35fr 1fr; gap:12px; }
  .skel .sk-cols .sk-panel i:nth-child(1) { width:34%; }
  .skel .sk-cols .sk-panel i:nth-child(2) { width:78%; }
  .skel .sk-cols .sk-panel i:nth-child(3) { width:60%; }
  .skel .sk-cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .skel .sk-cards .sk-panel { height:104px; }
  h2.pt { font-size:22px; margin:0 0 18px; font-weight:650; letter-spacing:-.02em; }
  h2.pt .sub { font-size:12.5px; color:var(--ink-mute); font-weight:400; margin-left:10px; }
  .card { background:var(--panel); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:16px 18px; margin-bottom:var(--gap-card);
    box-shadow:var(--card-shadow), inset 0 1px 0 rgba(255,255,255,.035);
    transition: background-color .16s ease, color .16s ease, border-color .16s ease; }
  .card h3 { font-size:15px; color:var(--ink); font-weight:600; margin-bottom:11px; letter-spacing:.005em; }
  /* Gấp gọn: một dòng tiêu đề thay cho cả thẻ. Dùng cho thông tin hệ thống và
     thư viện preset, để trang không phải xếp chồng mọi thứ cùng lúc. */
  details.fold > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px;
    font-size:15px; color:var(--ink); font-weight:600; letter-spacing:.005em; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary::after { content:"＋"; margin-left:auto; color:var(--ink-mute);
    font-family:var(--mono); font-size:13px; font-weight:400; }
  details.fold[open] > summary::after { content:"－"; }
  details.fold[open] > summary { margin-bottom:11px; }
  details.fold > summary .sub { font-size:11.5px; font-weight:400; color:var(--ink-mute); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--ink-mute); } .dim { color:var(--ink-dim); }
  .mono { font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; }
  .nowrap { white-space:nowrap; }
  code.k { background:var(--panel-2); border:1px solid var(--hairline-soft); border-radius:5px; padding:2px 7px; font-family:var(--mono); font-size:11.5px; user-select:all; }
  pre { background:var(--side); border:1px solid var(--hairline-soft); border-radius:var(--r-md); padding:10px 12px;
    overflow-x:auto; font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); user-select:text; white-space:pre-wrap; margin:8px 0 0; }
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px; border:1px solid var(--hairline-soft); border-radius:10px; overflow:hidden; }
  th,td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--hairline-soft); vertical-align:top; }
  th { color:var(--ink-mute); font-weight:500; font-size:11.5px; letter-spacing:.04em; }
  tr:last-child td { border-bottom:0; }
  .exit-wrap { overflow-x:auto; border-radius:10px; }
  .exit-wrap .exit-table { min-width:940px; }
  .exit-wrap .exit-table th:nth-child(2), .exit-wrap .exit-table td:nth-child(2) { min-width:200px; }
  .exit-wrap .exit-table td { padding:8px 10px; }
  .exit-wrap .exit-table tr:hover td { background:var(--panel-2); }
  .exit-wrap .exit-table .ep { font-family:var(--mono); font-size:11.5px; word-break:break-all; }
  .exit-wrap .exit-table .ep-sub { color:var(--ink-mute); font-size:11px; margin-top:2px; word-break:break-all; }
  .exit-wrap .exit-table .last { font-size:11.5px; color:var(--ink-mute); white-space:nowrap; }
  .exit-wrap .exit-table .note { font-size:11.5px; color:var(--ink-mute); line-height:1.45; }
  .sumstrip #net-summary { margin-bottom:12px; }
  .sumstrip .v.mono { font-size:20px; }
  /* IPv6 is 39 characters: the old 24px mono value clipped or forced the whole
     strip wider than the viewport. Let the address wrap inside its own cell
     and keep the label baseline aligned. */
  #net-summary .v.ip { font-size:clamp(13px,1.7vw,20px); line-height:1.3; overflow-wrap:anywhere; word-break:break-all; letter-spacing:0; }
  #net-summary .v.sm { font-size:14px; line-height:1.35; }
  #net-health.ok { color:var(--ok); }
  #net-health.warn { color:var(--warn); }
  #net-health.bad { color:var(--bad); }
  #net-health.unknown { color:var(--ink-mute); }
  #net-egress-meta { overflow-wrap:anywhere; }
  #net-summary .cell { min-width:0; }
  #net-summary .l { min-width:0; }
  /* One sticky save replaces the three page-local save buttons. It only
     appears when a network field is dirty, so it cannot cover content while
     the user is reading. */
  .netsticky { position:sticky; bottom:12px; z-index:20; display:none; align-items:center; gap:12px;
    margin:12px 0 0; padding:10px 14px; border:1px solid var(--hairline); border-radius:12px;
    background:color-mix(in srgb,var(--panel) 92%,transparent); backdrop-filter:blur(8px);
    box-shadow:0 8px 24px rgba(0,0,0,.24); }
  .netsticky.show { display:flex; }
  .netsticky .txt { min-width:0; flex:1; font-size:12.5px; color:var(--ink-dim); overflow-wrap:anywhere; }
  .netsticky .txt b { color:var(--ink); }
  .netnotice { border-left:2px solid var(--warn); background:var(--warn-bg); color:var(--ink-dim);
    border-radius:8px; padding:8px 11px; font-size:11.5px; line-height:1.55; margin-top:10px; }
  .netnotice.ok { border-left-color:var(--ok); background:var(--ok-bg); }
  .netnotice code { font-family:var(--mono); }
  .vpnrow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .vpnrow .vpnaddr { font-family:var(--mono); font-size:12px; overflow-wrap:anywhere; }
  .vpnmeta { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:7px 14px; margin-top:9px; }
  .vpnmeta .kv { display:flex; justify-content:space-between; gap:10px; font-size:12px; min-width:0; }
  .vpnmeta .k { color:var(--ink-mute); flex:none; }
  .vpnmeta .v { font-family:var(--mono); text-align:right; overflow-wrap:anywhere; min-width:0; }
  #page-usage table tr:hover td { background:var(--panel-2); }
  .pill { display:inline-block; padding:1px 9px; border-radius:999px; font-size:11.5px; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); }
  .pill.unknown { background:var(--panel-2); color:var(--ink-mute); }
  .pill.warn { background:var(--warn-bg); color:var(--warn); }
  .pill.bad { background:var(--bad-bg); color:var(--bad); }
  /* Hệ thống nút chỉ giữ ba loại: nút chính nền đặc màu nhấn (nặng nhất, duy nhất trên trang) / nút phụ viền xám / thao tác nguy hiểm dạng chữ */
  button.act { background:var(--accent); color:var(--primary-fg); border:0; border-radius:var(--r-md);
    padding:8px 17px; cursor:pointer; font-size:13px; font-weight:600; letter-spacing:.01em;
    box-shadow:0 1px 2px rgba(0,0,0,.18);
    transition:filter .15s ease, transform .12s ease, background-color .15s ease; }
  button.act:hover:not(:disabled) { filter:brightness(1.1); }
  button.act.off { background:var(--panel-2); color:var(--ink); border:1px solid var(--hairline); font-weight:400; box-shadow:none; }
  /* Nút act dạng công tắc: 「bật」 chỉ là một trạng thái, không nên là thứ sáng nhất toàn trang——
     nhuộm nhẹ màu nhấn + một chấm tròn nhỏ, để nút chính trắng tinh cho thao tác chính thực sự (lưu/uỷ quyền/cập nhật một chạm). */
  button.act[data-on="1"] { display:inline-flex; align-items:center; gap:7px; padding:7px 14px;
    background:var(--accent-soft); color:var(--accent-strong); border:0; font-weight:600;
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent); }
  button.act[data-on="1"]::before { content:""; width:6px; height:6px; border-radius:50%; flex:none;
    background:var(--accent); box-shadow:0 0 8px var(--accent); }
  button.ghost { background:var(--panel-2); border:1px solid var(--hairline); color:var(--ink-dim);
    border-radius:8px; padding:7px 14px; cursor:pointer; font-size:12.5px; }
  button.ghost:hover { color:var(--ink); border-color:var(--accent); background:var(--accent-soft); }
  button:disabled, input:disabled, textarea:disabled { opacity:.55; cursor:not-allowed; }
  button.act:focus-visible, button.ghost:focus-visible, .nav button:focus-visible,
  .collapse-btn:focus-visible, .pchip:focus-visible, .pvops button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button.act:not(:disabled):active, button.ghost:not(:disabled):active,
  .pvops button:not(:disabled):active { transform:translateY(1px); }
  input[type=number] { background:var(--panel-2); border:1px solid var(--hairline); color:var(--ink);
    border-radius:var(--r-sm); padding:6px 9px; width:90px; font-family:var(--mono); }
  input[type=text], textarea { outline:none; transition:border-color .18s ease, box-shadow .18s ease, background-color .18s ease; }
  input[type=text]:focus, input[type=number]:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  /* ---- Ô chọn thả xuống: ba trạng thái mặc định / di chuột / mở rộng, khi mở menu tự tìm vị trí ---- */
  .sel { position:relative; display:inline-flex; }
  .sel-btn { display:inline-flex; align-items:center; justify-content:space-between; gap:10px;
    min-height:34px; min-width:180px; padding:6px 10px 6px 12px; text-align:left;
    background:var(--panel-2); border:1px solid var(--hairline); color:var(--ink-dim);
    border-radius:var(--r-md); cursor:pointer; font-size:13px;
    transition:border-color .16s ease, background-color .16s ease, color .16s ease, box-shadow .16s ease; }
  .sel-btn .sel-val { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Ô chọn ở hàng lọc thu theo nội dung, không theo chiều rộng mặc định 180px làm vỡ một hàng */
  .sel.tight .sel-btn { min-width:150px; }
  .sel-btn .arr { flex:none; width:12px; height:12px; color:var(--ink-mute);
    transition:transform .18s var(--ease), color .16s ease; }
  .sel-btn:hover { border-color:var(--accent); color:var(--ink); }
  .sel-btn:hover .arr { color:var(--accent-strong); }
  .sel.open .sel-btn { border-color:var(--accent); background:var(--panel); color:var(--ink);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .sel.open .sel-btn .arr { transform:rotate(180deg); color:var(--accent-strong); }
  .sel-menu { position:absolute; top:calc(100% + 6px); left:0; min-width:100%;
    max-height:min(320px,42vh); overflow-y:auto; padding:4px; display:none; z-index:70;
    background:var(--panel); border:1px solid var(--hairline); border-radius:10px;
    box-shadow:0 14px 34px rgba(0,0,0,.28); animation:selIn .14s var(--ease); }
  /* Ô chọn gần đáy cửa sổ mà mở xuống sẽ đẩy menu ra khỏi vùng hiển thị, khi mở sẽ quyết định hướng mở theo vị trí đo thực tế */
  .sel.up .sel-menu { top:auto; bottom:calc(100% + 6px); animation:selInUp .14s var(--ease); }
  .sel.open .sel-menu { display:block; }
  @keyframes selIn   { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
  @keyframes selInUp { from { opacity:0; transform:translateY(4px);  } to { opacity:1; transform:none; } }
  .sel-menu .opt { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:7px 9px; border-radius:var(--r-sm); cursor:pointer; font-size:12.5px;
    color:var(--ink-dim); white-space:nowrap; }
  .sel-menu .opt:hover { background:var(--panel-2); color:var(--ink); }
  .sel-menu .opt.on { color:var(--accent-strong); background:var(--accent-soft); }
  .sel-menu .opt .okm { flex:none; width:12px; height:12px; opacity:0; color:var(--accent-strong); }
  .sel-menu .opt.on .okm { opacity:1; }
  .sel-menu .opt.cursor { background:var(--panel-2); color:var(--ink); }

  /* ---- Pool tài khoản: mỗi tài khoản một thẻ mục (danh tính + trạng thái + chỉ số + thao tác) ---- */
     Mục nổi bên trong thẻ lớn「Kênh」, nên bản thân nó không còn đổ bóng nữa: dựa vào nền nhạt + viền bán trong suốt để thành khối,
     chỉ thẻ đang nhận yêu cầu mới sáng lên. Thứ bậc là thẻ kênh > mục tài khoản > huy hiệu/chỉ số, chứ không phải hai lớp thẻ nặng ngang nhau. */
  .acc-list { display:flex; flex-direction:column; gap:8px; }
  .acc { position:relative; display:flex; flex-direction:column; gap:6px; padding:9px 11px;
    border-left:2px solid color-mix(in srgb,var(--hairline) 90%,transparent);
    border-bottom:1px solid color-mix(in srgb,var(--hairline) 60%,transparent);
    border-right:1px solid color-mix(in srgb,var(--hairline) 60%,transparent);
    border-radius:0 11px 11px 0;
    transition:border-color .16s ease, opacity .16s ease; }
  .acc:hover { border-left-color:color-mix(in srgb,var(--accent) 55%,transparent); }
  /* Thẻ đang nhận yêu cầu là thẻ duy nhất được làm sáng: dải màu bên trái đổi thành màu nhấn, không thêm đổ bóng, không lồng hộp lớp thứ hai */
  .acc.now { border-left-color:var(--accent); }
  /* Vô hiệu hoá không phải là “không quan trọng”: trạng thái đã ghi trong huy hiệu và chip rồi, ở đây chỉ làm nhạt tên,
     làm cả thẻ bán trong suốt sẽ khiến cả chữ mô tả cũng bị nhạt đến không đọc được. */
  .acc.off .acc-name, .acc.off .acc-id { color:var(--ink-mute); }
  .acc.off { border-left-color:color-mix(in srgb,var(--hairline) 90%,transparent); }
  .acc-hd { display:flex; align-items:center; gap:8px; min-width:0; }
  .acc-idx { flex:none; font-family:var(--mono); font-size:11px; color:var(--ink-mute); }
  .acc-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:13px; font-weight:650; color:var(--ink); }
  .acc-badge { margin-left:auto; flex:none; }
  .acc-id { font-family:var(--mono); font-size:11px; color:var(--ink-mute);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; user-select:all; }
  .acc-meta { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; color:var(--ink-mute); }
  .acc-meta b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .acc-chips { display:flex; flex-wrap:wrap; gap:5px; }
  .acc-chip { font-size:10.5px; padding:2px 8px; border-radius:999px; white-space:nowrap;
    border:1px solid var(--hairline); color:var(--ink-dim); background:transparent; }
  .acc-chip.now { color:var(--accent-strong); background:var(--accent-soft);
    border-color:color-mix(in srgb,var(--accent) 45%,transparent); }
  .acc-chip.warn { color:var(--warn); background:var(--warn-bg);
    border-color:color-mix(in srgb,var(--warn) 45%,transparent); }
  /* Một nguyên nhân thất bại là một câu, không phải nhãn: đi theo quy cách của .prose là 13px. */
  .acc-note { font-size:13px; line-height:1.6; color:var(--warn); overflow-wrap:anywhere; max-width:74ch; }
  .acc-note.bad { color:var(--bad); }
  .acc-acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:1px; }
  .acc-acts button { font:inherit; font-size:11.5px; padding:3px 10px; border-radius:8px;
    border:1px solid var(--hairline); background:transparent; color:var(--ink-dim); cursor:pointer;
    transition:border-color .16s ease, color .16s ease, background-color .16s ease; }
  .acc-acts button:hover:not(:disabled) { color:var(--ink); border-color:var(--accent); background:var(--accent-soft); }
  .acc-acts button.danger:hover:not(:disabled) { color:var(--bad); border-color:var(--bad); background:var(--bad-bg); }
  .acc-acts button:disabled { opacity:.45; cursor:default; }
  /* Chữ mô tả thành câu (nội dung thẻ kênh, nội dung thông báo): từ 13px, chiều cao dòng 1.7;
     11–12px chỉ dành cho văn bản ngắn dạng nhãn như huy hiệu, chỉ số, câu không nên dùng cỡ chữ đó. */
  .prose { font-size:13px; line-height:1.7; color:var(--ink-dim); overflow-wrap:anywhere; max-width:74ch; }
  .acc-empty { font-size:13px; line-height:1.7; color:var(--ink-mute); padding:10px 12px;
    border:1px dashed var(--hairline); border-radius:var(--r-lg); }
  /* Thanh chờ của cửa sổ uỷ quyền: không phải lỗi, nên dùng cùng quy cách với trạng thái trống trung tính (nét đứt, không có khối màu thường trực),
     chỉ có một chấm tròn nhỏ nhấp nháy kiểu thở để biểu thị “vẫn đang chờ”, không tranh màu nhấn của thẻ đang nhận yêu cầu. */
  .acc-wait { display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.7;
    color:var(--ink-dim); padding:9px 12px; border:1px dashed var(--hairline);
    border-radius:var(--r-lg); overflow-wrap:anywhere; }
  .acc-wait .dot { flex:none; width:6px; height:6px; margin-top:7px; border-radius:999px;
    background:var(--accent); animation:tpb 1.4s ease-in-out infinite; }
  /* Danh sách tài khoản và hàng thao tác ở trang thẻ: danh sách tự mang khoảng cách, hàng thao tác không bao giờ viết kiểu nội tuyến */
  .acc-list:not(:empty) { margin-top:10px; }
  .oprow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .oprow .k { flex:none; font-size:12px; color:var(--ink-mute); letter-spacing:.02em; }
  .switch { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:11px 2px; border-bottom:1px solid var(--hairline-soft); }
  .switch:last-child { border-bottom:0; }
  .switch .nm { font-weight:600; }
  .switch .ds { color:var(--ink-mute); font-size:12px; margin-top:2px; }
  .warnline { color:var(--warn); font-size:12px; margin-top:3px; }
  /* Thông báo: danh sách dạng hàng, chỉ dùng dải màu phân cấp 2px bên trái, không lồng thêm một thẻ nữa */
  .annitem { position:relative; padding:11px 0 12px 13px; border-bottom:1px dashed var(--hairline-soft); }
  .annitem:last-child { border-bottom:0; padding-bottom:4px; }
  .annitem::before { content:""; position:absolute; left:0; top:14px; bottom:15px; width:2px; border-radius:2px;
    background:var(--lv,var(--accent)); opacity:.8; }
  .annitem.ended { opacity:.6; }
  .ann-head { display:flex; align-items:center; gap:8px; min-width:0; flex-wrap:wrap; }
  .ann-title { font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; max-width:min(100%, 62ch); }
  .annitem.unread .ann-title::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
    margin-right:7px; vertical-align:1px; background:var(--lv,var(--accent)); }
  .ann-date { font-family:var(--mono); font-size:11px; color:var(--ink-mute); white-space:nowrap; flex:none; }
  .ann-acts { margin-left:auto; display:flex; align-items:center; gap:6px; flex:none; }
  .ann-acts .ghost { padding:2px 10px; font-size:11.5px; }
  .ann-link, .linkbtn { font-size:11.5px; color:var(--accent); text-decoration:none; white-space:nowrap; }
  .linkbtn { background:none; border:0; cursor:pointer; padding:0 2px; }
  .linkbtn:hover, .ann-link:hover { text-decoration:underline; }
  .ann-body { margin-top:5px; font-size:13px; line-height:1.72; color:var(--ink-dim); white-space:pre-wrap; max-width:78ch; }
  .annitem.clamp .ann-body { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  /* Sau khi mở rộng, nội dung tự cuộn, không đẩy「Tổng quan dịch vụ / Agent」xuống dưới đường gấp */
  .annitem.open .ann-body { display:block; max-height:32vh; overflow:auto; padding-right:6px; }
  .ann-hd { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
  /* Base URL / Key chính mỗi thứ thành một nhóm riêng, khi xuống dòng thì nhãn, giá trị, nút không tách rời nhau */
  .svcrow { gap:22px; }
  .kvp { display:inline-flex; align-items:center; gap:8px; min-width:0; }
  .kvp code.k { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .statgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .stat { background:var(--panel-2); border-radius:var(--r-md); padding:10px 14px; }
  .stat .v { font-family:var(--mono); font-size:18px; color:var(--ink); font-weight:600; }
  .stat .l { font-size:11px; color:var(--ink-mute); }
  .num { text-align:right; font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; }
  /* Chữ trong tuỳ chọn/nút/viên thuốc không bao giờ ngắt dòng (ngay cả ở cửa sổ hẹp cũng không xuất hiện kiểu ngắt dòng như đã bậ/t) */
  .pill, .seg > button, .switch .act, .nav button .lbl, .collapse-btn .lbl, .hm-legend { white-space:nowrap; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; border-radius:4px; }

  /* ---- model cards ---- */
  .mgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(265px,1fr)); gap:var(--gap-card); margin-bottom:var(--gap-card); }
  .mcard { background:var(--panel); box-shadow:var(--card-shadow); border:1px solid var(--hairline);
    border-top:2px solid var(--hairline); border-radius:var(--r-lg); padding:14px 15px 12px;
    display:flex; flex-direction:column; gap:6px;
    transition:border-color .16s ease, box-shadow .2s var(--ease), transform .18s var(--ease); }
  .mcard:hover { border-color:color-mix(in srgb,var(--accent) 45%,var(--hairline)); transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.22); }
  .mcard.st-available { border-top-color:var(--ok); }
  .mcard.st-custom { border-top-color:color-mix(in srgb,var(--accent) 45%,var(--hairline)); }
  /* Bốn trạng thái bất thường bốn màu: bị giới hạn tốc độ (hổ phách) / cổng khu vực (tím) / không khả dụng (đỏ) / chưa dò kiểm tra (xám nét đứt) */
  .mcard.st-throttled { border-top-color:var(--warn); }
  .mcard.st-region-blocked { border-top-color:#a78bfa; }
  .mcard.st-unavailable { border-top-color:var(--bad); }
  .mcard.st-unknown { border-top-style:dashed; border-top-color:var(--hairline); }
  .mcard.st-hidden { border-top-color:var(--hairline); }
  .mcard.dimmed { opacity:.5; }
  .pill.custom { background:var(--accent-soft); color:var(--accent); }
  .pill.region { background:rgba(167,139,250,.16); color:#c4b5fd; }
  .pill.hidsync { background:var(--panel-2); color:var(--ink-mute); }
  /* Huy hiệu kênh: một bộ cú pháp giao diện trung tính, danh tính kênh dựa vào chính chữ, không còn mỗi kênh chiếm một sắc độ riêng để xung đột với màu nhấn */
  .chan-badge { flex:none; font-size:10px; font-weight:600; letter-spacing:.5px; padding:2px 7px; border-radius:6px;
    font-family:var(--mono); background:var(--panel-2); color:var(--ink-dim); border:1px solid var(--hairline-soft); }
  .chan-custom { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
  /* Đầu mục nhóm theo kênh/chủ đề: phân đoạn thật——tên + số đếm + thao tác của đoạn căn phải, khoảng cách giữa các đoạn là cả một nhịp */
  .msec { display:flex; align-items:center; gap:10px; margin:var(--gap-sec) 2px 10px; }
  .msec:first-of-type { margin-top:0; }
  .msec .chname { font-size:13.5px; font-weight:650; color:var(--ink); letter-spacing:.01em; }
  .msec .chdesc { font-size:12px; color:var(--ink-mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msec .chcount { font-size:12px; color:var(--ink-mute); margin-left:auto; font-variant-numeric:tabular-nums; }
  .msec .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .msec .dot.on { background:var(--ok); } .msec .dot.off { background:var(--bad); }

  /* ---- Tường kênh: nhìn một lượt là thấy hết「ai đang mở, ai đã tắt, ai chưa đăng nhập」 ---- */
     Nó không nắm giữ trạng thái nào: việc nhóm chỉ nhìn vào s.channels[].enabled, hàng trạng thái chỉ nhìn vào
     giao diện status của riêng chúng, mọi thao tác nhấp đều uỷ thác cho thẻ quản lý đã có ở bên dưới. Tường là tổng quan, thẻ là mặt quản lý. */
  .cwall { display:flex; flex-direction:column; gap:10px; margin-bottom:var(--gap-card); }
  .cwall-tools { display:flex; align-items:center; gap:10px; }  .cwall-filter { background:var(--panel-2); border:1px solid var(--hairline); color:var(--ink);
    border-radius:var(--r-md); padding:7px 11px; font-size:12.5px; width:220px;
    font-family:var(--body); transition:border-color .18s var(--ease); }
  .cwall-filter::placeholder { color:var(--ink-faint); }
  .cwall-filter:hover { border-color:var(--hairline-soft); }
  .cwall-filter:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .cwall-group + .cwall-group { margin-top:16px; }
  .cwall-group-title { font-size:12px; font-weight:650; color:var(--ink-dim); letter-spacing:.02em;
    margin:0 2px 8px; display:flex; align-items:center; gap:8px; }
  .cwall-group-title::after { content:""; flex:1; height:1px; background:var(--hairline-soft); }
  /* Mô tả bổ sung ở đầu nhóm: đi sau tiêu đề, trước đường phân cách */
  .cwall-group-note { font-size:11px; font-weight:500; color:var(--ink-mute); letter-spacing:0; }
  .cwall-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:9px; }
  .wcard { display:flex; flex-direction:column; gap:7px; align-items:flex-start; text-align:left;
    background:var(--panel); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:12px 13px; cursor:pointer; position:relative; overflow:hidden;
    transition:transform .16s var(--ease), border-color .18s var(--ease), background-color .18s var(--ease); }
  .wcard:hover { transform:translateY(-2px); border-color:var(--accent); background:var(--panel-2); }
  .wcard:active { transform:scale(.985); }
  .wcard:focus-visible { outline:none; box-shadow:0 0 0 3px var(--accent-soft); border-color:var(--accent); }
  /* Đã chọn/làm nổi bật: dải dọc 3px bên trái, cùng một ngôn ngữ với ô đầu tiên của thanh tóm tắt */
  .wcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--accent); opacity:0; transition:opacity .18s var(--ease); }
  .wcard.flash::before { opacity:1; }
  .wcard[data-off="true"] { opacity:.62; }
  .wcard[data-off="true"]:hover { opacity:.85; }
  .wcard-head { display:flex; align-items:center; gap:9px; width:100%; }
  /* Đế biểu tượng kênh: ô vuông nền trắng + đồ hoạ 20px, cùng cảm giác với tường thẻ jet-hub.
     Biểu tượng là data URI nội tuyến, nền trắng là bắt buộc —— mấy PNG đó tự mang khoảng trắng sáng màu. */
  .wcard-ic { flex:none; width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
    overflow:hidden; background:#fff; }
  .wcard-ic img { display:block; width:20px; height:20px; object-fit:contain; }
  .wcard-ic[data-bare="true"] { background:transparent; }
  .wcard[data-off="true"] .wcard-ic { opacity:.55; filter:grayscale(.6); }
  .wcard-mark { flex:none; width:28px; height:28px; border-radius:8px; display:flex;
    align-items:center; justify-content:center; font-family:var(--mono); font-size:13px; font-weight:700;
    color:#fff; letter-spacing:0; background:linear-gradient(135deg,var(--accent-strong),var(--accent)); }
  .wcard[data-off="true"] .wcard-mark { background:var(--panel-2); color:var(--ink-mute); }
  /* Việc bật/tắt của zen / kilo là công tắc file kênh, không phải「đang chạy」——dùng viên tgl thay vì dùng loại có
     chấm trạng thái .act[data-on], tránh để bên cạnh「đã bật」treo một đèn xanh khiến người ta tưởng đang chạy. */
  .chan-pane .chead .tgl { margin-top:2px; }

  /* ---- Cửa sổ bật lên của kênh: sau khi nhấp vào thẻ sẽ chứa phần quản lý tài khoản của kênh đó ---- */
  .chan-modal .modal-card { width:min(880px, 94vw); max-height:88vh; }
  .chan-hd { display:flex; align-items:center; gap:11px; min-width:0; }
  .chan-hd-ic { flex:none; width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
    overflow:hidden; background:#fff; }
  .chan-hd-ic img { display:block; width:22px; height:22px; object-fit:contain; }
  .chan-hd-ic[data-bare="true"] { background:transparent; }
  .chan-hd-t { min-width:0; }
  .chan-hd-t .n { font-size:15px; font-weight:600; color:var(--ink); }
  .chan-hd-t .d { font-size:12px; color:var(--ink-mute); margin-top:2px; }
  /* Thẻ quản lý được chuyển vào cửa sổ bật lên sẽ bỏ lớp vỏ của chính nó, chỉ còn nội dung —— cửa sổ bật lên đã là thẻ đó rồi */
  .chan-body > .card { background:transparent; border:0; border-radius:0; box-shadow:none; padding:0; }
  .chan-body > .card > .chead { display:none; }
  /* Mặt quản lý của mỗi kênh thường trú trong DOM, cửa sổ bật lên chỉ hiển thị một trong số đó. Dùng [hidden] thay vì vẽ lại,
     việc polling trong bảng điều khiển và các handler đã gắn đều giữ nguyên như cũ. */
  .chan-pane[hidden] { display:none; }
  .chan-pane .prose { margin-bottom:10px; }
  /* Hàng tiêu đề sẵn có của bảng điều khiển không lặp lại: đầu cửa sổ bật lên đã ghi tên kênh, ở đây bỏ .cnm trùng tên,
     chỉ giữ hàng trạng thái (.cmeta)——trạng thái là động, hàng ở đầu không chứa hết được nó. */
  .chan-pane .chead .ct .cnm { display:none; }
  .chan-pane .chead .ct .cmeta { margin-top:0; }
  .chan-foot { flex:none; display:flex; justify-content:flex-end; align-items:center; gap:8px;
    padding:12px 20px 16px; border-top:1px solid var(--hairline-soft); }
  .wcard-name { font-size:13px; font-weight:600; color:var(--ink); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .wcard-meta { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-mute);
    width:100%; min-height:16px; }
  .wcard-dot { flex:none; width:6px; height:6px; border-radius:50%; background:var(--ok); }
  .wcard-state { flex:none; font-weight:650; }
  .wcard-state[data-tone="warn"] { color:var(--warn); }
  /* 「Đã đóng」là chữ trạng thái, không phải trang trí: dùng --ink-mute thay vì --ink-faint,
     cái sau trên nền tối chỉ đạt 1.7:1, không đọc được nội dung thì bằng như không viết. */
  .wcard-state[data-tone="off"] { color:var(--ink-mute); }
  .wcard-meta-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .cwall-empty { padding:14px 2px; font-size:12px; color:var(--ink-mute); }
  /* Nhấp thẻ sẽ đi đâu: thẻ đích tạm thời được viền một vòng, người dùng nhìn là xác nhận được điểm đến */
  .flash-target { animation:flashRing 1.8s var(--ease); }
  @keyframes flashRing {
    0%, 100% { box-shadow:0 0 0 0 transparent; }
    12%, 60% { box-shadow:0 0 0 3px var(--accent-soft); border-color:var(--accent); }
  }
  .msec .ghost { padding:3px 10px; font-size:11.5px; }
  /* Hàng chips lọc */
  .mfilters { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .mchip { font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--hairline);
    background:var(--panel-2); color:var(--ink-mute); cursor:pointer; user-select:none; }
  .mchip { transition:transform .1s ease, border-color .15s ease, color .15s ease, background .15s ease; }
  .mchip:hover { border-color:var(--accent); color:var(--ink); }
  .mchip.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:500; }
  .msearch { font-size:13px; padding:4px 10px; border-radius:8px; border:1px solid var(--hairline);
    background:var(--panel-2); color:var(--ink); width:180px; outline:none; }
  .msearch:focus { border-color:var(--accent); }
  .mempty { padding:26px 0 8px; text-align:center; color:var(--ink-mute); font-size:13px; }
  .mcard .mhead { display:flex; align-items:center; gap:8px; min-width:0; }
  .mcard .mhead .mname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mcard .mfoot { display:flex; justify-content:space-between; align-items:center; gap:8px;
    border-top:1px dashed var(--hairline-soft); padding-top:8px; margin-top:auto; }

  /* ---- v1.9.1 Trang mô hình: dính trên / lựa chọn tốt nhất / công tắc chọn dùng / dùng chính / chế độ xem danh sách ---- */
  .msticky { position:sticky; top:0; z-index:30; padding:8px 0 8px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline-soft); margin-bottom:10px; }
  /* Thanh điều khiển một hàng: tìm kiếm/mặc định/chips lọc/thao tác hàng loạt/chế độ xem tất cả trên một hàng, rộng thì trải phẳng, hẹp thì tự nhiên ngắt dòng */
  .msticky .mbar { display:flex; align-items:center; gap:6px 8px; flex-wrap:wrap; margin-top:8px; }
  .msticky .mbar .spacer { flex:1; min-width:8px; }
  /* Neo nhóm ở trang cài đặt: khi nhảy theo điều hướng dính trên, để tiêu đề nhóm rơi xuống dưới thanh điều hướng, không bị che mất */
  #page-settings .card { scroll-margin-top:70px; }
  /* Cửa sổ hẹp: thanh ngang neo dính trên (giữ nguyên); cửa sổ rộng: điều hướng dọc bên trái sticky + nội dung bên phải hai cột */
  #set-nav { position:sticky; top:0; z-index:30; padding:8px 0;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline-soft); }
  @media (min-width:1100px) {
    /* Phải giới hạn bằng .on: display:grid của ID trần #page-settings sẽ đè lên .page{display:none}，
       khiến trang cài đặt thường trú ở dưới mọi trang khác */
    #page-settings.on { display:grid; grid-template-columns:150px minmax(0,1fr); column-gap:28px; align-items:start; }
    #page-settings > h2.pt { grid-column:1/-1; }
    #set-nav { grid-column:1; grid-row:2 / span 999; position:sticky; top:4px;
      flex-direction:column; align-items:stretch; flex-wrap:nowrap; gap:3px;
      background:var(--bg); backdrop-filter:none; -webkit-backdrop-filter:none;
      border-bottom:0; padding:0 0 8px; margin-top:0; }
    #set-nav .mchip { border-radius:var(--r-md); padding:6px 12px; font-size:12.5px; background:transparent; }
    #page-settings > .card { grid-column:2; }
  }
  /* Lựa chọn tốt nhất: thanh gọn——nền panel + dải dọc màu nhấn 3px bên trái, một hàng chứa tên/chỉ số/thao tác */
  .hero { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:11px 16px; margin:0 0 var(--gap-card);
    border:1px solid var(--hairline); border-left:3px solid var(--accent);
    background:var(--panel); border-radius:var(--r-lg); box-shadow:var(--card-shadow); }
  .hero .h-name { font-size:15px; font-weight:650; letter-spacing:-.01em; }
  .hero .h-meta { display:flex; gap:12px; font-size:12px; color:var(--ink-mute); flex-wrap:wrap; }
  .hero .h-meta b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .hero .h-act { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .hero.degraded { border-left-color:var(--warn); }
  .btn-primary { font-size:13px; font-weight:600; padding:8px 17px; border-radius:var(--r-md); cursor:pointer;
    border:0; background:var(--accent); color:var(--primary-fg);
    box-shadow:0 1px 2px rgba(0,0,0,.18);
    transition:filter .15s ease, transform .12s ease; }
  .btn-primary:hover:not(:disabled) { filter:brightness(1.1); transform:translateY(-1px); }
  .btn-primary:active { transform:translateY(0) scale(.98); }
  .btn-primary:disabled { opacity:.55; cursor:default; transform:none; }
  /* Chọn dùng: nâng cấp từ hộp kiểm thành công tắc trạng thái rõ ràng */
  .vpill { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    padding:5px 12px; border-radius:8px; cursor:pointer; user-select:none;
    border:1px solid var(--hairline); background:var(--panel-2); color:var(--ink-mute);
    transition:all .15s ease; }
  .vpill:hover { border-color:var(--accent); color:var(--ink); }
  .vpill:active, .mchip:active, .starbtn:active { transform:scale(.95); }
  .vpill.on { background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 55%,transparent); color:var(--accent); }
  /* Dấu sao dùng chính */
  .starbtn { flex:none; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:7px; border:1px solid transparent; background:transparent; color:var(--ink-mute);
    cursor:pointer; font-size:14px; line-height:1; transition:all .15s ease; }
  .starbtn:hover { border-color:var(--hairline); background:var(--panel-2); color:var(--ink); }
  .starbtn.on { color:var(--accent-strong); }
  /* Chế độ xem danh sách */
  .mlist { width:100%; border-collapse:collapse; font-size:13px; }
  .mlist th { text-align:left; font-size:11.5px; font-weight:600; color:var(--ink-mute); text-transform:none;
    padding:6px 10px; border-bottom:1px solid var(--hairline); position:sticky; top:0;
    background:var(--bg); white-space:nowrap; }
  .mlist td { padding:7px 10px; border-bottom:1px solid var(--hairline-soft); vertical-align:middle; }
  .mlist tr:hover td { background:var(--panel-2); }
  .mlist .mono { font-family:var(--mono); font-size:12px; opacity:.9; }
  /* Số đếm chips */
  .mchip .cnt { opacity:.65; font-size:10.5px; margin-left:3px; }
  .mchip.zero { opacity:.4; }
  /* Chuyển đổi chế độ xem */
  .vtoggle { display:inline-flex; border:1px solid var(--hairline); border-radius:8px; overflow:hidden; }
  .vtoggle button { font-size:11.5px; padding:4px 12px; border:none; background:transparent;
    color:var(--ink-mute); cursor:pointer; }
  .vtoggle button.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  /* Mục kênh trống mặc định thu gọn */
  .msec .ghost.fold { padding:3px 10px; font-size:12px; }
  /* Lần xuất hiện đầu tiên: nhân vật chính đến trước, phần còn lại theo sau (chỉ phát ở nhịp render mới đó) */
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .mcard { animation:rise .22s cubic-bezier(.22,.9,.32,1) backwards; }
  .mcard:nth-child(n+13) { animation-delay:.06s; }
  .mgrid { animation:rise .2s cubic-bezier(.22,.9,.32,1) backwards; }
  .mcard .mtest { font-size:11px; padding:2px 9px; flex:none; }
  .mcard .vispick { display:inline-flex; align-items:center; gap:5px; font-size:11.5px;
    color:var(--ink-dim); cursor:pointer; flex:none; user-select:none; }
  .mcard .vispick input { accent-color:var(--accent); margin:0; cursor:pointer; }
  .mcard .vispick:hover { color:var(--ink); }
  .mcard .mname { font-weight:600; }
  .mcard .mid { color:var(--ink-mute); font-size:11px; user-select:all; word-break:break-all; }
  .mcard .mmeta { display:flex; gap:12px; font-size:12.5px; color:var(--ink-mute); flex-wrap:wrap; }
  .mcard .mmeta b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .mcard .mtags { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .mcard .tag { font-size:12px; color:var(--ink-dim); background:var(--panel-2); border-radius:5px; padding:1px 7px; }
  .mcard .meff { display:flex; gap:6px; flex-wrap:wrap; }
  .mcard .meff .eff { font-size:11px; color:var(--ink-dim); background:var(--panel-2); border-radius:5px; padding:1px 7px; }
  .mcard .meff .eff b { color:var(--accent); font-family:var(--mono); }
  .mcard .mblurb { font-size:12.5px; line-height:1.6; color:var(--ink-dim); background:var(--panel-2);
    border-left:2px solid var(--accent); border-radius:0 5px 5px 0; padding:5px 8px; margin-top:7px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    cursor:pointer; user-select:none; position:relative; }
  /* Nhấp để mở rộng: bỏ cắt ngắn theo số dòng, phần quá cao chuyển thành cuộn nội bộ, mô tả dài không còn làm phình thẻ */
  .mcard .mblurb.open { -webkit-line-clamp:unset; display:block;
    max-height:170px; overflow-y:auto; user-select:text; padding-bottom:22px; }
  /* Ở trạng thái thu gọn, góc dưới phải cho một OpenKi rộng rõ ràng, đừng để người dùng phải đoán là có thể nhấp */
  .mcard .mblurb:not(.open)::after { content:"Nhấp để mở rộng ▾"; position:absolute; right:7px; bottom:4px;
    font-size:10px; color:var(--accent); background:var(--accent-soft); border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
    padding:0 6px; border-radius:6px; pointer-events:none; }
  .mcard .mblurb.open::after { content:"Nhấp để thu gọn ▴"; position:absolute; right:7px; bottom:4px;
    font-size:10px; color:var(--ink-mute); background:var(--panel-2); padding:0 6px; border-radius:6px; pointer-events:none; }
  /* Mô tả trùng lặp đó được thu vào đầu trang: một dải mảnh một hàng, không tranh với thông số trong thẻ */
  .mnote { display:flex; gap:10px; align-items:flex-start; padding:9px 13px; margin:0 0 12px;
    border:1px solid var(--hairline-soft); border-left:2px solid var(--accent); border-radius:8px;
    background:var(--panel); color:var(--ink-dim); font-size:12.5px; line-height:1.7; }
  .mnote .k { flex:none; color:var(--ink-mute); }
  .mcard .mquota { margin-top:8px; border-top:1px dashed var(--hairline-soft); padding-top:7px; }
  .mcard .qbar { height:5px; background:var(--panel-2); border-radius:3px; overflow:hidden; }
  .mcard .qbar i { display:block; height:100%; border-radius:3px; transition:width .3s ease; }
  .mcard .qbar i.ok { background:var(--ok, #34d399); }
  .mcard .qbar i.warn { background:var(--warn, #fbbf24); }
  .mcard .qbar i.bad { background:var(--bad, #f87171); }
  .mcard .qtext { font-size:11px; color:var(--ink-mute); margin-top:3px; }
  .mcard .qtext.warn2 { color:var(--warn, #fbbf24); }
  .mcard .mdetail { font-size:11.5px; color:var(--ink-mute); border-top:1px dashed var(--hairline-soft); padding-top:6px; word-break:break-all; }

  /* ---- Tiến trình dò kiểm tra (kiểm thử / đo thực tế năng lực)---- */
  .mcard .mtask { margin-top:8px; border-top:1px dashed var(--hairline-soft); padding-top:7px;
    display:flex; flex-direction:column; gap:5px; }
  .mcard .mtask .th { display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-dim); }
  .mcard .mtask .th .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mcard .mtask .th b { font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); }
  .mcard .mtask .tdet { font-size:11px; padding:1px 8px; flex:none; }
  .mcard .mtask .tps { display:flex; gap:5px; flex-wrap:wrap; }
  .mcard .tp { font-size:11px; border-radius:5px; padding:1px 7px; background:var(--panel-2);
    color:var(--ink-mute); display:inline-flex; gap:4px; align-items:center; }
  .mcard .tp b { font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; }
  .mcard .tp.run { color:var(--accent); background:var(--accent-soft); animation:tpb 1.4s ease-in-out infinite; }
  .mcard .tp.ok { color:var(--ok, #34d399); }
  .mcard .tp.fail { color:var(--bad, #f87171); }
  .mcard .tp.unknown { color:var(--warn, #fbbf24); }
  @keyframes tpb { 0%,100% { opacity:1; } 50% { opacity:.5; } }

  /* ---- Ngăn kéo chi tiết dò kiểm tra ---- */
  #tdrawer { position:fixed; top:0; right:0; bottom:0; width:min(470px,92vw); z-index:80;
    background:var(--panel); border-left:1px solid var(--hairline); box-shadow:-12px 0 32px rgba(0,0,0,.3);
    display:flex; flex-direction:column; }
  #tdrawer .hd { display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--hairline); }
  #tdrawer .hd .t { font-weight:600; font-size:12.5px; flex:1; min-width:0; word-break:break-all; }
  #tdrawer .bd { overflow:auto; padding:12px 16px 20px; }
  #tdrawer .run { border:1px solid var(--hairline); border-radius:var(--r-md); padding:8px 10px;
    margin-bottom:9px; background:var(--panel-2); }
  #tdrawer .rh { font-size:11.5px; color:var(--ink-dim); margin-bottom:6px; display:flex; gap:9px; }
  #tdrawer .row { display:grid; grid-template-columns:62px 1fr auto; gap:8px; font-size:11.5px;
    padding:2px 0; align-items:start; }
  #tdrawer .row .tm { color:var(--ink-mute); font-family:var(--mono); }
  #tdrawer .row .nm { color:var(--ink); min-width:0; word-break:break-all; }
  #tdrawer .row .ms { color:var(--ink-mute); font-family:var(--mono); text-align:right; white-space:nowrap; }
  #tdrawer .row .err, #tdrawer .row .out { grid-column:1/-1; border-radius:5px; padding:5px 7px;
    font-family:var(--mono); font-size:11px; white-space:pre-wrap; word-break:break-all; user-select:all;
    background:var(--panel); border:1px solid var(--hairline); }
  #tdrawer .row .err { color:var(--bad, #f87171); }
  #tdrawer .row .out { color:var(--ink-dim); }
  #tdrawer .empty { color:var(--ink-mute); font-size:12px; }

  /* ---- agent cards ---- */
  .agrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin-bottom:var(--gap-card); }
  .acard { background:var(--panel); box-shadow:var(--card-shadow); border:1px solid var(--hairline);
    border-top:2px solid var(--hairline); border-radius:var(--r-lg); padding:14px 15px;
    display:flex; flex-direction:column; gap:8px;
    transition:border-color .16s ease, box-shadow .2s var(--ease), transform .18s var(--ease); }
  .acard:hover { border-color:color-mix(in srgb,var(--accent) 45%,var(--hairline)); transform:translateY(-1px); box-shadow:0 8px 22px rgba(0,0,0,.24); }
  .acard.st-on { border-top-color:var(--ok); }
  .acard.st-noinst { opacity:.55; }
  .acard .ahead { display:flex; align-items:center; gap:10px; }
  .acard .aicon { width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center;
    background:var(--panel-2); border:1px solid var(--hairline-soft); border-radius:var(--r-md); color:var(--ink-dim); }
  .acard .aicon svg { width:17px; height:17px; display:block; }
  .acard .aicon.lg-wide svg { width:auto; height:10px; }
  .acard .aicon.lg-neutral svg { color:#171717; }
  :root[data-theme="dark"] .acard .aicon.lg-neutral svg { color:#fafafa; }
  .acard.st-on .aicon { color:var(--accent); background:var(--accent-soft); border-color:transparent; }
  .acard .att { min-width:0; }
  .acard .aname { font-weight:600; font-size:13.5px; line-height:1.3; }
  .acard .aver { font-size:11px; color:var(--ink-mute); font-family:var(--mono); margin-top:1px; }
  .acard .ads { font-size:11.5px; line-height:1.55; color:var(--ink-mute); flex:1; }
  .acard .afoot { display:flex; justify-content:space-between; align-items:center; gap:10px;
    border-top:1px dashed var(--hairline-soft); padding-top:9px; margin-top:auto; }
  /* Công tắc gạt: 40×22 rãnh viên thuốc, ::after là con trượt */
  .tgl { position:relative; width:40px; height:22px; flex:none; border-radius:999px; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--hairline); padding:0;
    transition:background-color .15s ease, border-color .15s ease; }
  .tgl::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:var(--ink-mute); transition:transform .15s ease, background-color .15s ease; }
  .tgl:hover { border-color:var(--accent); }
  .tgl.on { background:var(--accent); border-color:var(--accent); }
  .tgl.on::after { transform:translateX(18px); background:#fff; }
  .tgl:disabled { opacity:.4; cursor:not-allowed; }
  .tgl:disabled:hover { border-color:var(--hairline); }
  .tgl:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* ---- providers API tuỳ chỉnh ---- */
  /* .tin đồng thời dùng ở <input> và của「tải nhiều Key」 <textarea> ở trên. Nếu chỉ viết input.tin thì,
     textarea đó sẽ trở về nền trắng chữ đen mặc định của trình duyệt——mảng trắng chói mắt duy nhất trong cửa sổ bật lên. */
  input.tin, textarea.tin { background:var(--panel-2); border:1px solid var(--hairline); color:var(--ink);
    border-radius:var(--r-sm); padding:6px 9px; font-family:var(--mono); font-size:12.5px; }
  input.tin:focus, textarea.tin:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  input.tin::placeholder, textarea.tin::placeholder { color:var(--ink-mute); }
  textarea.tin { resize:vertical; min-height:54px; line-height:1.5; }
  .pchips { display:grid; grid-template-columns:repeat(auto-fill,minmax(216px,1fr)); gap:10px; }
  .pchip { display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-height:70px; background:var(--panel);
    border:1px solid var(--hairline); border-radius:10px; padding:10px 13px; cursor:pointer; min-width:0;
    transition:border-color .15s ease, transform .15s var(--ease), box-shadow .15s ease; }
  .pchip:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.12); }
  .pchip:active { transform:scale(.98); }
  .pchip .pnote { font-size:11.5px; color:var(--ink-mute); line-height:1.5; max-width:100%; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; }
  .pchip .pn { font-size:13px; font-weight:600; color:var(--ink); max-width:100%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .pchip .pu { font-size:10.5px; color:var(--ink-mute); font-family:var(--mono); max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pmodels { display:flex; flex-wrap:wrap; gap:4px; min-width:0; }
  .pmodels .pm, .badge { font-size:11px; font-family:var(--mono); color:var(--ink-dim);
    background:var(--panel-2); border-radius:5px; padding:1px 7px; user-select:all; }
  .pform .frow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:9px; }
  .pform .frow .flbl { width:76px; flex:none; font-size:12.5px; color:var(--ink-dim); }
  /* Đầu thống nhất của thẻ kênh/nhà cung cấp: bên trái tên + một hàng thông tin meta, bên phải thao tác chính——sửa"tình trạng nội dung dồn sang trái 60%, thao tác chính chìm xuống đáy thẻ" */
  .chead { display:flex; align-items:flex-start; gap:12px; margin-bottom:10px; }
  .chead .ct { min-width:0; flex:1; }
  .chead .cnm { display:block; font-size:15px; font-weight:600; color:var(--ink); letter-spacing:.005em; }
  .chead .cmeta { display:block; font-size:12px; color:var(--ink-mute); margin-top:3px; min-height:15px; }
  .chead .cact { flex:none; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }

  /* Danh sách chọn mô hình (sau khi kéo về, đánh dấu chọn những mô hình nào để đưa vào kho) */
  .pv-pickhead { display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap; margin-top:4px; }
  .pv-picklist { max-height:216px; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:1px 12px; border:1px solid var(--hairline-soft); border-radius:var(--r-md);
    background:var(--panel-2); padding:8px 10px; margin-top:8px; }
  .pv-picklist label { display:flex; gap:7px; align-items:center; font-size:11.5px; font-family:var(--mono);
    color:var(--ink-dim); cursor:pointer; padding:2.5px 4px; border-radius:4px; min-width:0; }
  .pv-picklist label:hover { background:var(--panel); color:var(--ink); }
  .pv-picklist label span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pv-picklist input[type=checkbox] { accent-color:var(--accent); flex:none; margin:0; }
  .pv-picklist .pv-empty { grid-column:1/-1; font-size:12px; color:var(--ink-mute); padding:6px 4px; }

  /* ---- Cửa sổ modal (thêm/chỉnh sửa nhà cung cấp)---- */
  .modal { position:fixed; inset:0; z-index:90; display:none; }
  .modal.open { display:flex; align-items:center; justify-content:center; padding:24px; }
  .modal-mask { position:absolute; inset:0; background:rgba(4,5,8,.62); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .modal-card { position:relative; width:min(680px, 94vw); max-height:86vh; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--hairline); border-radius:var(--r-lg);
    box-shadow:0 24px 64px rgba(0,0,0,.5); animation:modalIn .16s var(--ease); }
  @keyframes modalIn { from { opacity:0; transform:translateY(10px) scale(.985); } to { opacity:1; transform:none; } }
  .modal-hd { flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:15px 20px; border-bottom:1px solid var(--hairline-soft); }
  .modal-title { font-size:15px; font-weight:600; color:var(--ink); }
  .modal-x { flex:none; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:var(--r-md); border:1px solid transparent; background:transparent; color:var(--ink-mute);
    font-size:13px; cursor:pointer; }
  .modal-x:hover { background:var(--panel-2); color:var(--ink); border-color:var(--hairline); }
  .modal-bd { overflow-y:auto; padding:16px 20px 20px; }
  .modal-bd .frow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:9px; }
  .modal-bd .frow .flbl { width:76px; flex:none; font-size:12.5px; color:var(--ink-dim); }

  /* Thẻ nhà cung cấp */
  /* Container lưới tự mang khoảng cách đáy: thẻ theo sau (như biểu mẫu「Thêm nhà cung cấp」) không còn dính sát vào lưới */
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:10px; margin-bottom:var(--gap-card); }
  .pvcard { background:var(--panel); box-shadow:var(--card-shadow); border:1px solid var(--hairline);
    border-radius:var(--r-lg); padding:14px 16px 12px; display:flex; flex-direction:column; gap:9px;
    position:relative; overflow:hidden;
    transition:border-color .16s ease, box-shadow .2s var(--ease), transform .18s var(--ease); }
  .pvcard:hover { border-color:color-mix(in srgb,var(--accent) 45%,var(--hairline)); transform:translateY(-1px); box-shadow:0 8px 22px rgba(0,0,0,.24); }
  .pvcard::before { content:""; position:absolute; left:0; right:0; top:0; height:2px;
    background:linear-gradient(90deg, var(--accent), transparent 72%); }
  .pvcard.off::before { background:var(--hairline); }
  .pvcard.off .pvn, .pvcard.off .pvmrow { opacity:.5; }
  .pvhead { display:flex; align-items:center; gap:10px; }
  .pvdot { width:8px; height:8px; border-radius:50%; background:var(--ink-mute); flex:none; }
  .pvdot.on { background:var(--ok); box-shadow:0 0 0 3px var(--ok-bg); }
  .pvt { min-width:0; flex:1; }
  .pvn { font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:7px; min-width:0; }
  .pvn .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pvpill { flex:none; font-size:10px; font-weight:500; color:var(--accent); background:var(--accent-soft);
    border-radius:999px; padding:0 8px; line-height:16px; letter-spacing:.04em; }
  .pvu { font-size:11px; color:var(--ink-mute); margin-top:1px; display:flex; gap:6px; align-items:center; min-width:0; }
  .pvu .u { font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pvu .sep { opacity:.5; flex:none; }
  .pvu .k { flex:none; font-family:var(--mono); }
  .pvmrow { display:flex; gap:8px; align-items:flex-start; min-height:22px; }
  .pvcount { flex:none; font-size:11px; color:var(--ink-dim); background:var(--panel-2); border-radius:5px;
    padding:2px 8px; margin-top:1px; font-variant-numeric:tabular-nums; }
  .pvfoot { display:flex; justify-content:space-between; align-items:center; gap:10px;
    border-top:1px dashed var(--hairline-soft); padding-top:8px; }
  .pvfoot .u { font-size:10.5px; color:var(--ink-mute); font-family:var(--mono);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pvops { display:flex; gap:1px; flex:none; }
  .pvops button { background:none; border:0; color:var(--ink-mute); font-size:12px; cursor:pointer;
    border-radius:5px; padding:3px 8px; white-space:nowrap; }
  .pvops button:hover { background:var(--panel-2); color:var(--ink); }
  .pvops button.danger:hover { background:var(--bad-bg); color:var(--bad); }

  /* ---- usage dashboard (ZCode style) ---- */
  /* Tỷ lệ hai cột cố định: nội dung chính bên trái 1.35 / cột ngữ cảnh bên phải 1; thẻ ở cuối cột không còn kéo giãn để lấp đầy (thẻ trống còn khó nhìn hơn so le) */
  .two { display:grid; grid-template-columns:1.35fr 1fr; gap:12px; align-items:start; }
  .two > div { display:flex; flex-direction:column; min-width:0; }
  .two > div > .card:last-child { margin-bottom:0; }
  .sumstrip { display:flex; overflow:hidden; border-radius:12px;
    background:var(--panel); border:1px solid var(--hairline); box-shadow:var(--card-shadow); margin-bottom:12px; }
  .sumstrip .cell { flex:1; min-width:0; padding:15px 18px; text-align:left; border-right:1px solid var(--hairline-soft); transition:background-color .18s ease; }
  .sumstrip .cell:hover { background:var(--accent-soft); }
  .sumstrip .cell:last-child { border-right:0; }
  .sumstrip .v { font-family:var(--mono); font-size:24px; line-height:1.15; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--ink); }
  /* Ô nhân vật chính: chỉ số sức khoẻ cốt lõi (mô hình khả dụng) dải trái + số màu nhấn, bốn ô còn lại cùng trọng số lùi lại nửa bước */
  .sumstrip .cell:first-child { border-left:3px solid var(--accent); }
  .sumstrip .cell:first-child .v { font-size:27px; color:var(--accent-strong); }
  /* Hàng nhiệm vụ bàn làm việc */
  .task { display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px dashed var(--hairline-soft); }
  .task:last-child { border-bottom:0; }
  .task .t-dot { flex:none; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; border:1.5px solid var(--hairline); color:var(--ink-mute); }
  .task.done .t-dot { border-color:var(--ok); background:var(--ok-bg); color:var(--ok); }
  .task .t-name { font-size:13.5px; font-weight:600; color:var(--ink); }
  .task.done .t-name { color:var(--ink-mute); font-weight:500; }
  .task .t-desc { font-size:12px; color:var(--ink-mute); margin-top:1px; }
  .task .t-go { margin-left:auto; flex:none; }
  .sumstrip .v.bad { color:var(--bad); }
  .sumstrip .l { margin-top:3px; font-size:12.5px; color:var(--ink-mute); display:flex; align-items:center; gap:6px; }
  /* Banner phiên bản mới: dải trái mảnh + có thể ngắt dòng, cửa sổ hẹp không cắt chữ */
  .updbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:11px 16px 11px 14px; margin-bottom:12px; border-left:2px solid var(--accent); }
  .updbar .txt { font-size:12.5px; color:var(--ink-dim); }
  .updbar .txt b { color:var(--ink); }
  .updbar .acts { display:flex; align-items:center; gap:10px; flex:none; flex-wrap:wrap; }
  .updbar .acts a { font-size:12.5px; white-space:nowrap; color:var(--accent); text-decoration:none; }
  .updbar .acts a:hover { text-decoration:underline; }
  .seg { position:relative; display:inline-flex; height:28px; border-radius:999px; background:var(--panel-2); padding:2px; }
  .seg > button { position:relative; z-index:1; border:0; background:none; color:var(--ink-mute); padding:0 12px;
    font-size:12px; font-weight:500; cursor:pointer; border-radius:999px; transition:color .18s ease; }
  .seg > button.on { color:var(--ink); }
  .seg .thumb { position:absolute; top:2px; bottom:2px; left:2px; width:40px; border-radius:999px;
    background:var(--panel); box-shadow:var(--card-shadow);
    transition:left .18s cubic-bezier(.4,0,.2,1), width .18s cubic-bezier(.4,0,.2,1); z-index:0; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-dim);
    background:var(--panel-2); border:1px solid transparent; border-radius:999px; padding:2px 9px; cursor:pointer; }
  .chip.on { border-color:var(--accent); color:var(--ink); }
  /* Chip mô tả: không nhấp được, dùng viền nét đứt để phân biệt, không dựa vào việc làm nhạt chữ đến mức không đọc rõ */
  .chip.static { cursor:default; border:1px dashed var(--hairline); color:var(--ink-mute); background:transparent; }
  .chip .dotc { width:8px; height:8px; border-radius:50%; }

  /* ---- Nhật ký ---- */
  /* Ba hàng điều khiển (ghi / hiển thị / ghi vào file) căn trái thành một cột, trước tiên nhận ra đó là các việc khác nhau, rồi mới nhìn điều khiển */
  .logrow { display:flex; align-items:center; gap:9px; flex-wrap:wrap; row-gap:8px; }
  .logrow .k { flex:none; width:58px; font-size:12px; color:var(--ink-mute); letter-spacing:.02em; }
  /* Nhật ký dài trong terminal sau khi ngắt dòng cần phân biệt với mục trước: dòng tiếp theo thụt vào, dòng quay lại không để sát lề trên */
  #log-view { font-size:11.5px; line-height:1.72; }
  #log-view > div { padding-left:1.5em; text-indent:-1.5em; }

  /* heatmap */
  .hm-scroll { overflow-x:auto; padding-bottom:2px; }
  .hm { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); grid-template-columns:repeat(52,1fr); gap:3px; width:100%; aspect-ratio:52/7; min-width:660px; }
  .hm.wk { aspect-ratio:52/1; grid-template-rows:minmax(0,1fr); }
  .hm-cell { width:100%; height:100%; min-height:0; border-radius:3px; border:1px solid var(--hairline-soft);
    background:var(--hm0); transition:transform .1s ease, border-color .1s ease; cursor:pointer; }
  .hm-cell:hover { transform:scale(1.15); border-color:var(--ink-dim); }
  .hm-cell.colhi { border-color:var(--hairline); }
  .hm-months { display:grid; grid-auto-flow:column; grid-template-columns:repeat(52,1fr); gap:3px; width:100%; min-width:660px; margin-top:4px; }
  .hm-months span { font-size:10.5px; color:var(--ink-mute); text-align:left; white-space:nowrap; overflow:visible; }
  .hm-legend { display:flex; align-items:center; gap:3px; justify-content:flex-end; margin-top:8px; font-size:11px; color:var(--ink-mute); }
  .hm-legend i { width:10px; height:10px; border-radius:3px; display:inline-block; border:1px solid transparent; }
  .hm-level1 { background:var(--hm1); } .hm-level2 { background:var(--hm2); }
  .hm-level3 { background:var(--hm3); } .hm-level4 { background:var(--hm4); border-color:transparent; }
  .hm-cell.has { border-color:var(--hairline); }
  #hm-tip { position:fixed; z-index:60; background:var(--panel); border:1px solid var(--hairline);
    border-radius:var(--r-sm); padding:5px 9px; font-size:11.5px; color:var(--ink); pointer-events:none;
    display:none; box-shadow:0 4px 12px rgba(0,0,0,.18); white-space:nowrap; }
  #hm-tip .tt-date { font-weight:600; margin-bottom:4px; }
  .speedgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .barwrap { position:relative; background:var(--panel-2); border-radius:4px; height:8px; width:100%; min-width:80px; overflow:hidden; }
  .barwrap .bar { position:absolute; top:0; bottom:0; left:0; background:var(--accent); border-radius:4px; }
  .dayhead { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:10px 0 6px; }
  .dayhead .x { cursor:pointer; color:var(--ink-mute); font-size:14px; padding:0 4px; }
  .dayhead .x:hover { color:var(--ink); }

  /* ---- scrollbars ---- */
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--hairline); border-radius:6px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:var(--ink-mute); background-clip:padding-box; border:2px solid transparent; }
  ::-webkit-scrollbar-corner { background:transparent; }
  html { scrollbar-width:thin; scrollbar-color:var(--hairline) transparent; }
  .main { scrollbar-gutter:stable; }

  #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--panel);
    border:1px solid var(--hairline); color:var(--ink); padding:8px 20px; border-radius:var(--r-md);
    display:none; font-size:13px; z-index:50; box-shadow:0 4px 12px rgba(0,0,0,.18); animation:toastIn .18s ease; }
  @keyframes toastIn { from { opacity:0; transform:translate(-50%,8px); } to { opacity:1; transform:translate(-50%,0); } }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none!important; transition:none!important; }
  .mcard:hover,.acard:hover,.pvcard:hover { transform:none; } }
  @media (max-width:900px) {
    .side { width:176px; }
    .main { padding:18px 16px 36px; }
    .two { grid-template-columns:1fr; }
    .sumstrip { display:grid; grid-template-columns:repeat(3,1fr); }
    .sumstrip .cell:nth-child(3n) { border-right:0; }
    .sumstrip .cell:nth-child(n+4) { border-top:1px solid var(--hairline-soft); }
    /* The network strip has four cells, not five: 2×2 avoids a lone cell in
       the second row and gives the IPv6 address half the width. */
    #net-summary { grid-template-columns:repeat(2,1fr) !important; }
    #net-summary .cell:nth-child(3n) { border-right:1px solid var(--hairline-soft); }
    #net-summary .cell:nth-child(2n) { border-right:0; }
    #net-summary .cell:nth-child(n+3) { border-top:1px solid var(--hairline-soft); }
    /* Thanh tóm tắt giờ có 6 ô (trúng cache chiếm một ô): 3 cột ×2 hàng, 2 cột ×3 hàng đều chia hết,

    .cwall-grid { grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); }

  const modes=(settings&&settings.egressModes)||[];

function fmtCap(n){
  if(!n) return "—";

  const raw = String(payload?.error || payload?.message || "").trim();

  const requestId = ++refreshBusy;
