# Companion to the Dockerfile: one service, one volume, the port the API listens
# on. The panel stays loopback-only, so the published port is the OpenAI /
# Anthropic endpoint under /v1 and not the admin surface (issue #79).
services:
  openki:
    build: .
    image: openki:local
    ports:
      - "8787:8787"
    volumes:
      - openki-data:/data
    environment:
      OPENKI_HEADLESS: "1"
      OPENKI_HOME: /data
    restart: unless-stopped

volumes:
  openki-data:
